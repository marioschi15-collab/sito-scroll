name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  verifica:
    name: Typecheck, test, controllo sicurezza
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # la versione di pnpm viene dal campo packageManager di package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build --filter './packages/*'
      - run: pnpm typecheck
      - run: pnpm test
      - name: Controllo anti-credenziali e regole di permesso
        run: node scripts/verifica-sicurezza.mjs

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f93b4">
<title>Mondino · il plastico che prende vita</title>
<style>
:root{--crema:#fff8ec;--inchiostro:#3d2b1d;--oro:#f2b33d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2f93b4;touch-action:none;user-select:none;-webkit-user-select:none;
 font-family:"Nunito","Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI","Inter",system-ui,sans-serif;color:var(--inchiostro)}
#mondo{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ---------- in alto ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;
 padding:calc(env(safe-area-inset-top) + 12px) 12px 0;pointer-events:none}
.pillola{pointer-events:auto;background:linear-gradient(180deg,rgba(255,252,245,.96),rgba(255,243,226,.93));
 border-radius:999px;box-shadow:0 6px 18px rgba(16,60,80,.28),inset 0 1px 0 #fff,inset 0 -2px 0 rgba(190,150,100,.18)}
#contatore{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px}
#contatore canvas{width:34px;height:34px}
#contatore .etich{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a77c4f;line-height:1.1}
#contatore .num{font-size:19px;font-weight:900;line-height:1.05;letter-spacing:.01em}
#contatore .num span{color:#b08b66;font-weight:800;font-size:15px}
#barra{width:58px;height:6px;border-radius:9px;background:#efdcc2;overflow:hidden;margin-top:3px}
#barra i{display:block;height:100%;width:20%;border-radius:9px;background:linear-gradient(90deg,#ffcf5a,#f39a2e);transition:width .8s cubic-bezier(.2,1.4,.4,1)}
#contatore.salta{animation:salta .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes salta{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
#era{margin-left:auto;padding:7px 14px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
#era small{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a77c4f}
#era b{font-size:13.5px;font-weight:900}
#aiuto{pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer}
#aiuto canvas{width:30px;height:30px}
/* ---------- vassoio dei gettoni ---------- */
#vassoio{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:6;width:100%;max-width:760px;
 padding:14px 0 calc(env(safe-area-inset-bottom) + 10px);
 background:linear-gradient(180deg,rgba(255,250,240,.95),rgba(252,238,216,.96));
 border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(10,50,70,.28),inset 0 2px 0 #fff}
#vassoio:before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:rgba(160,120,80,.22)}
#gettoni{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding:4px 14px 2px;scrollbar-width:none;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
 mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
#gettoni::-webkit-scrollbar{display:none}
.gettone{flex:0 0 auto;width:70px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;touch-action:none}
.gettone canvas{width:62px;height:62px;transition:transform .18s}
.gettone span{font-size:12px;font-weight:800;color:#6b4b2e;white-space:nowrap}
.gettone.preso canvas{transform:scale(.82);opacity:.45}
.gettone.nascosto{visibility:hidden}
.gettone.pop canvas{animation:pop .7s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.gettone.invita canvas{animation:invita 1.6s ease-in-out infinite}
@keyframes invita{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* ---------- oggetti volanti ---------- */
#fantasma{position:fixed;left:0;top:0;width:74px;height:74px;margin:-37px 0 0 -37px;z-index:20;pointer-events:none;display:none;
 filter:drop-shadow(0 10px 10px rgba(0,30,50,.35))}
#fantasma canvas{width:74px;height:74px}
#strato{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.nome{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;animation:sale 1.5s ease-out forwards}
.nome b{display:block;font-size:19px;font-weight:900;color:#fff;letter-spacing:.01em;
 text-shadow:0 2px 0 var(--c,#7a5230),0 0 2px var(--c,#7a5230),0 3px 10px rgba(0,0,0,.35)}
.nome.grande{animation:festa 2.7s cubic-bezier(.2,1,.3,1) forwards}
.nome.grande .nuova{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#7a4b12;
 background:linear-gradient(180deg,#ffe58a,#ffbf3c);padding:3px 10px;border-radius:99px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.nome.grande b{font-size:34px;margin-top:2px;text-shadow:0 3px 0 var(--c,#7a5230),0 0 3px var(--c,#7a5230),0 6px 18px rgba(0,0,0,.4)}
.nome small{display:inline-block;margin-top:3px;font-size:12px;font-weight:800;color:#5a3d22;background:rgba(255,248,236,.94);
 padding:3px 10px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
@keyframes sale{0%{opacity:0;transform:translate(-50%,-80%) scale(.7)}15%{opacity:1;transform:translate(-50%,-110%) scale(1.05)}
 70%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
@keyframes festa{0%{opacity:0;transform:translate(-50%,-60%) scale(.3)}12%{opacity:1;transform:translate(-50%,-120%) scale(1.18)}
 22%{transform:translate(-50%,-125%) scale(1)}80%{opacity:1;transform:translate(-50%,-150%) scale(1)}100%{opacity:0;transform:translate(-50%,-185%) scale(.96)}}
.vola{position:fixed;left:0;top:0;width:62px;height:62px;margin:-31px 0 0 -31px;z-index:18;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,30,50,.35))}
#ricetta{position:fixed;z-index:19;pointer-events:none;transform:translate(-50%,-100%);display:none;white-space:nowrap;
 background:rgba(255,250,240,.97);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800;color:#5a3d22;
 box-shadow:0 6px 16px rgba(0,30,50,.3)}
#ricetta em{font-style:normal;color:#d07a1e}
#ricetta:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,250,240,.97)}
/* ---------- fumetto suggerimenti ---------- */
#fumetto{position:fixed;left:50%;z-index:7;max-width:min(340px,88vw);transform:translate(-50%,10px);opacity:0;pointer-events:none;
 background:#fffaf1;border-radius:18px;padding:10px 16px;font-size:14.5px;font-weight:700;line-height:1.35;text-align:center;color:#4b331f;
 box-shadow:0 10px 26px rgba(10,50,70,.3);transition:opacity .35s,transform .35s cubic-bezier(.2,1.4,.4,1)}
#fumetto.su{opacity:1;transform:translate(-50%,0)}
#fumetto b{color:#c56a12}
#fumetto:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fffaf1}
/* ---------- reazione a catena e ere ---------- */
#catena{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);z-index:8;transform:translateX(-50%);pointer-events:none;opacity:0;
 font-size:17px;font-weight:900;color:#fff;letter-spacing:.02em;white-space:nowrap;padding:7px 16px;border-radius:99px;
 background:linear-gradient(180deg,#ff9b4a,#e8551f);box-shadow:0 6px 18px rgba(120,40,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
#catena i{font-style:normal;display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.28)}
#catena.via{animation:catena 2.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes catena{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.12)}
 22%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
#nuovaEra{position:fixed;left:50%;top:32%;z-index:9;transform:translate(-50%,-50%);pointer-events:none;opacity:0;text-align:center;
 padding:16px 28px 18px;border-radius:24px;background:linear-gradient(180deg,rgba(255,250,238,.97),rgba(255,236,205,.97));
 box-shadow:0 16px 40px rgba(10,40,60,.4),inset 0 2px 0 #fff;min-width:240px}
#nuovaEra small{display:block;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#b07a35}
#nuovaEra b{display:block;font-size:27px;font-weight:900;margin:2px 0 4px}
#nuovaEra span{font-size:13.5px;font-weight:700;color:#7a5a3a}
#nuovaEra.via{animation:era 3.6s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes era{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
 18%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(.98)}}
/* ---------- titolo iniziale ---------- */
#titolo{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:18vh;pointer-events:none;
 background:radial-gradient(ellipse at 50% 40%,rgba(255,244,222,.0),rgba(18,70,96,.35));transition:opacity 1.1s}
#titolo h1{font-size:54px;font-weight:900;color:#fff;letter-spacing:.01em;text-shadow:0 4px 0 #c46a24,0 0 4px #c46a24,0 12px 30px rgba(0,0,0,.35)}
#titolo p{margin-top:8px;font-size:16px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,30,50,.6);text-align:center;padding:0 30px}
#titolo.via{opacity:0}
/* mano che mostra il gesto */
#mano{position:fixed;left:0;top:0;width:62px;height:62px;margin:-31px 0 0 -31px;z-index:12;pointer-events:none;opacity:0}
#mano canvas{width:62px;height:62px}
</style>
</head>
<body>
<canvas id="mondo"></canvas>
<div id="hud">
 <div id="contatore" class="pillola"><canvas id="icStella"></canvas>
  <div><div class="etich">Scoperte</div><div class="num"><b id="nScop">4</b><span>/20</span></div><div id="barra"><i></i></div></div>
 </div>
 <div id="era" class="pillola"><small id="eraNum">Era 1</small><b id="eraNome">Gli elementi</b></div>
 <button id="aiuto" class="pillola" aria-label="Suggerimento"><canvas id="icLuce"></canvas></button>
</div>
<div id="catena"></div>
<div id="nuovaEra"></div>
<div id="fumetto"></div>
<div id="vassoio"><div id="gettoni"></div></div>
<div id="strato"></div>
<div id="fantasma"></div>
<div id="ricetta"></div>
<div id="mano"></div>
<div id="titolo"><h1>Mondino</h1><p>Unisci gli elementi e fai nascere un piccolo mondo</p></div>
<script>
(()=>{
'use strict';
const DPR=Math.min(2,window.devicePixelRatio||1);
const $=s=>document.querySelector(s);
const cv=$('#mondo'), ctx=cv.getContext('2d');
let VW=0,VH=0,W=60,Q=15,S=14,B=18,OX=0,OY=0;
const N=9;
let tempo=0, ora=0.1, scalaTempo=1;
const DURATA_GIORNO=170;
let notte=0, crepuscolo=0;
let ventoBoost=0;
const vento={x:0.07,y:-0.05};
const SCOSTA_DITO=62;

// ================= utilità =================
const R=Math.random;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const scuro=(h,k)=>rgb(hex(h).map(v=>v*k));
const chiaro=(h,k)=>rgb(hex(h).map(v=>v+(255-v)*k));
function tela(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*DPR));c.height=Math.max(1,Math.ceil(h*DPR));
 const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);return{c,ctx:x,w,h}}
function poly(c,pts,fill){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}}
const coda=[]; // eventi programmati nel tempo del gioco
function dopo(s,fn){coda.push({t:tempo+s,fn})}

// ================= elementi =================
const EL={
 terra:{nome:'Terra',fondo:'#f3c48d',col:'#9a6436',ricetta:'Elemento di base'},
 acqua:{nome:'Acqua',fondo:'#a4def7',col:'#2b8fd0',ricetta:'Elemento di base'},
 fuoco:{nome:'Fuoco',fondo:'#ffc684',col:'#e8551f',ricetta:'Elemento di base'},
 aria:{nome:'Aria',fondo:'#dcf1fb',col:'#4f9cc8',ricetta:'Elemento di base'},
 fango:{nome:'Fango',fondo:'#d2ad85',col:'#6e4a2c',ricetta:'Acqua + Terra'},
 argilla:{nome:'Argilla',fondo:'#f6b892',col:'#c0592c',ricetta:'Fango + Aria'},
 lava:{nome:'Lava',fondo:'#ffa66b',col:'#d8400f',ricetta:'Fuoco + Terra'},
 pietra:{nome:'Pietra',fondo:'#ccd4dd',col:'#5d6875',ricetta:'Lava + Acqua'},
 vapore:{nome:'Vapore',fondo:'#e9f1f7',col:'#6c8aa3',ricetta:'Acqua + Fuoco'},
 nuvola:{nome:'Nuvola',fondo:'#c7e6fb',col:'#4f86b5',ricetta:'Il vapore sale'},
 pioggia:{nome:'Pioggia',fondo:'#a9cdee',col:'#3a72a8',ricetta:'Nuvola carica'},
 germoglio:{nome:'Germoglio',fondo:'#d3efa9',col:'#4c9a2a',ricetta:'Fango + Pioggia'},
 pianta:{nome:'Pianta',fondo:'#b6e48f',col:'#3f8a26',ricetta:'Il germoglio cresce'},
 albero:{nome:'Albero',fondo:'#9fd987',col:'#2f7a2a',ricetta:'La pianta cresce'},
 cenere:{nome:'Cenere',fondo:'#d3cec7',col:'#5c5650',ricetta:'Fuoco + Albero'},
 legno:{nome:'Legno',fondo:'#ecc597',col:'#86532a',ricetta:'Pietra + Albero'},
 utensile:{nome:'Utensile',fondo:'#e0d7ca',col:'#6b5a48',ricetta:'Pietra + Legno'},
 omini:{nome:'Omini',fondo:'#ffdcb0',col:'#c4562e',ricetta:'Albero + Fango'},
 mattone:{nome:'Mattone',fondo:'#f7b199',col:'#b2452c',ricetta:'Argilla + Fuoco'},
 casa:{nome:'Casa',fondo:'#ffd9a0',col:'#b8432f',ricetta:'Mattone + Legno'},
};
const TOTALE=Object.keys(EL).length;
const noti=new Set(['terra','acqua','fuoco','aria']);

// ================= disegno dei simboli =================
function glifo(c,id){
 c.lineJoin='round';c.lineCap='round';
 const lg=(y0,y1,a,b)=>{const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g};
 const dot=(x,y,r,f)=>{if(f)c.fillStyle=f;c.beginPath();c.arc(x,y,r,0,7);c.fill()};
 const ell=(x,y,rx,ry,f,rot)=>{if(f)c.fillStyle=f;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,7);c.fill()};
 const nuv=(x,y,s,f,g)=>{c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle=g;[[-9,3,7],[0,-1,9],[9,3,7],[-3,5,7],[5,5,7]].forEach(b=>{c.beginPath();c.arc(b[0],b[1]+2,b[2],0,7);c.fill()});
  c.fillStyle=f;[[-9,3,7],[0,-1,9],[9,3,7],[-3,5,7],[5,5,7]].forEach(b=>{c.beginPath();c.arc(b[0],b[1],b[2],0,7);c.fill()});
  c.fillStyle='rgba(255,255,255,.9)';dot(-3,-4,3.5);c.restore()};
 const albero=(x,y,s)=>{c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle=lg(0,14,'#8a5a34','#5e3a1f');c.beginPath();c.moveTo(-3,16);c.lineTo(-2,2);c.lineTo(2,2);c.lineTo(3,16);c.closePath();c.fill();
  c.fillStyle='#2f7a2a';[[-7,-1,8],[7,-1,8],[0,-8,10],[0,1,8]].forEach(b=>dot(b[0],b[1]+1.5,b[2]));
  c.fillStyle='#4fa63a';[[-7,-1,8],[7,-1,8],[0,-8,10],[0,1,8]].forEach(b=>dot(b[0],b[1],b[2]-1));
  c.fillStyle='#86d062';dot(-4,-11,4);dot(-9,-3,3);c.restore()};
 switch(id){
 case 'terra':
  c.fillStyle=lg(-12,12,'#b98049','#7a4824');
  c.beginPath();c.moveTo(-17,11);c.bezierCurveTo(-15,-3,-7,-11,1,-11);c.bezierCurveTo(9,-11,15,-3,17,11);c.quadraticCurveTo(0,15,-17,11);c.fill();
  c.fillStyle='rgba(255,220,170,.35)';c.beginPath();c.moveTo(-12,0);c.bezierCurveTo(-9,-7,-3,-10,2,-10);c.bezierCurveTo(-3,-6,-8,-2,-12,0);c.fill();
  dot(-6,-3,2.3,'#dca46d');dot(4,-6,1.8);dot(9,2,2.1);dot(-10,5,1.7);dot(1,3,2);
  dot(-2,-1,1.5,'#5a3418');dot(6,-1,1.3);dot(-12,9,1.3);dot(11,8,1.4);dot(-3,8,1.2);
  break;
 case 'acqua':
  c.fillStyle=lg(-16,17,'#6fd2f7','#1c78c4');
  c.beginPath();c.moveTo(0,-17);c.bezierCurveTo(7,-7,13,-1,13,6);c.bezierCurveTo(13,13,7,17,0,17);c.bezierCurveTo(-7,17,-13,13,-13,6);c.bezierCurveTo(-13,-1,-7,-7,0,-17);c.fill();
  c.fillStyle='rgba(255,255,255,.85)';ell(-5,5,2.6,5,null,0.35);dot(-2,-3,1.6);
  c.strokeStyle='rgba(10,70,130,.35)';c.lineWidth=1.4;c.beginPath();c.arc(1,7,7,0.2,1.4);c.stroke();
  break;
 case 'fuoco':
  c.fillStyle=lg(-17,17,'#ff5a1c','#ffb23c');
  c.beginPath();c.moveTo(0,-18);c.bezierCurveTo(6,-9,14,-4,13,6);c.bezierCurveTo(12,13,6,17,0,17);c.bezierCurveTo(-7,17,-13,12,-13,5);
  c.bezierCurveTo(-13,-1,-9,-5,-7,-10);c.bezierCurveTo(-5,-4,-3,-3,-1,-4);c.bezierCurveTo(-1,-9,-2,-13,0,-18);c.fill();
  c.fillStyle=lg(-4,17,'#ffe36e','#fff6c8');
  c.beginPath();c.moveTo(1,-4);c.bezierCurveTo(5,1,8,5,7,10);c.bezierCurveTo(6,14,3,16,0,16);c.bezierCurveTo(-4,16,-7,13,-7,9);c.bezierCurveTo(-7,5,-3,3,1,-4);c.fill();
  break;
 case 'aria':
  c.strokeStyle='#4b95c4';c.lineWidth=3.6;
  c.beginPath();c.moveTo(-16,-6);c.lineTo(5,-6);c.bezierCurveTo(12,-6,13,-15,6,-15);c.bezierCurveTo(2,-15,1,-11,3,-10);c.stroke();
  c.beginPath();c.moveTo(-16,2);c.lineTo(10,2);c.bezierCurveTo(17,2,18,11,11,11);c.bezierCurveTo(7,11,6,7,8,6);c.stroke();
  c.strokeStyle='#8cc6e6';c.beginPath();c.moveTo(-12,10);c.lineTo(-1,10);c.stroke();
  break;
 case 'fango':
  c.fillStyle=lg(-6,14,'#8a5e3c','#5a3b24');
  c.beginPath();c.moveTo(-17,6);c.bezierCurveTo(-17,-4,-6,-8,2,-6);c.bezierCurveTo(12,-6,18,-1,17,6);c.bezierCurveTo(16,13,6,13,0,12);c.bezierCurveTo(-8,13,-17,13,-17,6);c.fill();

function trovaMeta(){

 if(nuvole.filter(n=>!n.deco).length>=6)return null;

function scorriAcqua(t0){
 const path=[t0];let cur=t0,fine=null;
 for(let k=0;k<10;k++){
  if(cur.g==='terra'&&!cur.o){fine=()=>{cur.g='fango';toccata(cur);schizzi(cur,6);scopri('fango',cur,cur!==t0)};break}

  if(cur.g==='cenere'){fine=()=>{cur.g='terra';toccata(cur)};break}

  let best=null;for(const n of vicini4(cur))if(n&&n.isola&&liv(n)<liv(cur)-0.01&&(!best||liv(n)<liv(best)))best=n;

const NOMI_SUOLO={roccia:'Roccia',basalto:'Roccia scura',terra:'Terra',fango:'Fango',argilla:'Argilla',pietra:'Pietra',cenere:'Cenere',erba:'Prato',lava:'Lava'};
function nomeCasella(t){
 if(t.fuoco>0)return'Fuoco';
 if(t.o){const o=t.o;if(o.t==='verde')return EL[stadio(o)].nome;return{casa:'Casa',legno:'Legno',mattone:'Mattoni',utensile:'Utensile'}[o.t]}
 if(t.g==='acqua')return t.h===0?'Laghetto':'Pozza';return NOMI_SUOLO[t.g];
}
const Rg=(res,testo,fai)=>({res,testo,fai});
function regola(id,t){
 const g=t.g,o=t.o,ob=o?o.t:null,st=ob==='verde'?stadio(o):null,libero=!o&&g!=='acqua'&&g!=='lava'&&!t.fuoco;
 switch(id){
 case 'terra':
  if(t.fuoco)return Rg(null,'spegne il fuoco',()=>spegni(t,true));
  if(g==='acqua')return Rg('fango','',()=>{t.g='fango';t.h=Math.max(1,t.h+1);toccata(t);scopri('fango',t)});
  if(g==='lava')return Rg(null,'copre la lava',()=>{t.g='terra';t.lava=null;toccata(t);spegni(t,true)});
  if(ob==='verde')return Rg(null,'nutre la pianta',()=>{o.gr+=0.25;o.pop=1;toccata(t)});
  if(o)return null;
  return Rg(null,t.h<4?'si ammucchia':'copre',()=>{if(t.h<4)t.h++;t.g='terra';toccata(t)});
 case 'acqua':
  if(t.fuoco)return Rg('vapore','spegne il fuoco',()=>{spegni(t);vaporeSu(t,14,true,8);scopri('vapore',t)});
  if(g==='lava')return Rg('pietra','',()=>{t.g='pietra';t.lava=null;toccata(t);vaporeSu(t,24,true,10);scopri('pietra',t)});
  if(g==='acqua')return Rg(null,'fa le onde',()=>schizzi(t));
  if(ob==='verde')return Rg(g==='terra'?'fango':null,'innaffia',()=>{t.bagnato=1;o.pop=1;schizzi(t,8);if(g==='terra'){t.g='fango';toccata(t);scopri('fango',t)}});
  if(g==='terra'&&!o)return Rg('fango','',()=>{t.g='fango';toccata(t);schizzi(t,8);scopri('fango',t)});
  if(g==='cenere'&&!o)return Rg(null,'diventa terra buona',()=>{t.g='terra';toccata(t);schizzi(t,6)});
  if(o)return Rg(null,'bagna',()=>{t.bagnato=1;schizzi(t)});
  return Rg(null,'scorre in basso',()=>scorriAcqua(t));
 case 'fuoco':
  if(g==='acqua')return Rg('vapore','',()=>{vaporeSu(t,22,true,10);fiammata(t,6);scopri('vapore',t)});
  if(ob==='casa')return Rg(null,'meglio di no',()=>rifiuta(t,'La casa no: dentro si sta al calduccio!'));
  if(ob==='verde'||ob==='legno')return Rg(st==='albero'||ob==='legno'?'cenere':null,'brucia',()=>accendi(t,4.4));
  if(g==='argilla'&&!o)return Rg('mattone','',()=>{t.g='terra';metti(t,{t:'mattone'});fiammata(t);suono.fuoco();scopri('mattone',t)});
  if(g==='terra'&&!o)return Rg('lava','',()=>{t.g='lava';t.lava={e:7,timer:0.7,eta:0};toccata(t);fiammata(t);suono.fuoco();scopri('lava',t)});
  if(g==='fango'&&!o)return Rg(null,'lo asciuga',()=>{t.g='terra';toccata(t);vaporeSu(t,6,false)});

let bersaglio=null;
function disegna(){

 c.drawImage(sfondo.c,0,0,VW,VH);
 c.save();c.translate(sh,0);
 mareVivo(c);
 if(notte>0.05){c.fillStyle='#fff';for(const s of STELLE){const a=notte*(0.55+0.45*Math.sin(tempo*1.5+s.f));c.globalAlpha=a;c.beginPath();c.arc(s.x,s.y,s.r*1.3,0,7);c.fill()}c.globalAlpha=1}
 // ---- terreno
 const gA=c.createLinearGradient(OX-3*W,OY+W,OX+3*W,OY+3*W);gA.addColorStop(0,'#72d3ea');gA.addColorStop(1,'#3a9ccf');
 for(const t of ORDINE){if(!t.isola)continue;disegnaCasella(c,t,gA)}
 schiuma(c);
 // ---- ombre

 if(bersaglio)evidenzia(c,bersaglio);
 // ---- oggetti e omini, riga per riga
 const perCasella=new Map();
 for(const om of omini){if(om.stato==='dentro')continue;let t=tileOm(om);if(om.stato==='cammina'&&om.a&&om.a.t&&(om.a.t.x+om.a.t.y)>(t?t.x+t.y:-1))t=om.a.t;if(!t)continue;
  if(!perCasella.has(t.i))perCasella.set(t.i,[]);perCasella.get(t.i).push(om)}
 let d0=-1;
 for(let k=0;k<ORDINE.length;k++){const t=ORDINE[k];const d=t.x+t.y;
  if(t.isola){disegnaOggetto(c,t);const lista=perCasella.get(t.i);if(lista){lista.sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(const om of lista)disegnaOmino(c,om)}}
  const nx=ORDINE[k+1];if(!nx||nx.x+nx.y!==d){ // fine riga: ridisegna le caselle davanti più alte (coprono gli oggetti dietro)
   for(const f of ORDINE)if(f.x+f.y===d+1&&f.isola){const dietro=[casella(f.x-1,f.y),casella(f.x,f.y-1)];
    if(dietro.some(b=>b&&b.isola&&(b.o||b.fuoco||perCasella.has(b.i))&&zTop(f)>zTop(b)+S*0.6))blit(c,f)}}
 }
 // ---- particelle normali, pioggia, nuvole
 disegnaParticelle(c,false);

 c.restore();
 // ---- notte
 if(notte>0.01||crepuscolo>0.01){

 tr={id:g&&!g.classList.contains('nascosto')?g.dataset.id:null,g,pid:e.pointerId,x0:e.clientX,y0:e.clientY,sl0:gettoniEl.scrollLeft,modo:'attesa',tipo:e.pointerType};
 try{vassoio.setPointerCapture(e.pointerId)}catch(_){}
});
vassoio.addEventListener('pointermove',e=>{
 if(!tr||e.pointerId!==tr.pid)return;const dx=e.clientX-tr.x0,dy=e.clientY-tr.y0;
 const scorrevole=gettoniEl.scrollWidth>gettoniEl.clientWidth+4;
 if(tr.modo==='attesa'&&Math.hypot(dx,dy)>7){if(tr.id&&(!scorrevole||-dy>Math.abs(dx)*0.45))iniziaTrascino(e);else tr.modo='scorri'}
 if(tr.modo==='scorri'){gettoniEl.scrollLeft=tr.sl0-dx;if(tr.id&&e.clientY<vassoio.getBoundingClientRect().top-6){gettoniEl.scrollLeft=tr.sl0;iniziaTrascino(e)}}
 if(tr.modo==='trascina')muovi(e);
});
function iniziaTrascino(e){
 tr.modo='trascina';tr.g.classList.add('preso');fantasma.innerHTML='';fantasma.append(canvasGettone(tr.id,74));fantasma.style.display='block';
 suono.presa();nascondiFumetto();fermaMano();muovi(e);
}
function muovi(e){
 const[x,y]=puntoFantasma(e);fantasma.style.transform=`translate(${x}px,${y}px) scale(${bersaglio?0.82:1})`;
 const sopraVassoio=e.clientY>vassoio.getBoundingClientRect().top;
 const t=sopraVassoio?null:casellaIn(x,y);bersaglio=t;
 if(t){const r=regola(tr.id,t);const[cx,cy]=centro(t);chip.style.display='block';chip.style.left=cx+'px';chip.style.top=(cy-W*0.55)+'px';
  let testo=`${EL[tr.id].nome} + ${nomeCasella(t)}`;
  if(!r)testo+=' · <em>niente</em>';else if(r.res)testo+=noti.has(r.res)?` = <em>${EL[r.res].nome}</em>`:' = <em>?</em>';else testo+=` · <em>${r.testo}</em>`;
  chip.innerHTML=testo}else chip.style.display='none';
}
function fineTrascino(e,annulla){
 if(!tr||e.pointerId!==tr.pid)return;
 if(tr.modo==='trascina'){tr.g.classList.remove('preso');chip.style.display='none';
  const t=bersaglio;bersaglio=null;
  if(t&&!annulla){fantasma.style.display='none';lascia(tr.id,t)}
  else{const r=tr.g.getBoundingClientRect();const a=fantasma.animate([{transform:fantasma.style.transform},{transform:`translate(${r.left+r.width/2}px,${r.top+r.height/2-8}px) scale(.8)`}],{duration:280,easing:'ease-in'});
   a.onfinish=()=>{fantasma.style.display='none'}}}
 else if(tr.modo==='attesa'&&tr.id)infoGettone(tr.id);
 tr=null;
}
vassoio.addEventListener('pointerup',e=>fineTrascino(e,false));
vassoio.addEventListener('pointercancel',e=>fineTrascino(e,true));
vassoio.addEventListener('wheel',e=>{gettoniEl.scrollLeft+=e.deltaY+e.deltaX;e.preventDefault()},{passive:false});
function lascia(id,t){
 primoTrascino=true;ultimaAzione=tempo;
 const[sx,sy]=centro(t);const top=sy-W*1.0;
 const zolle={terra:['#a26c42','#7c4a26','#c08a5c'],fango:['#6e4a2c','#4f3422','#8d6445'],argilla:['#d6865b','#b4673f'],cenere:['#9a948e','#6e6862']}[id];
 let durata=0.3;
 if(zolle){for(let i=0;i<16;i++)part({tipo:'zolla',x:sx+(R()-0.5)*W*0.35,y:top-R()*W*0.4,vx:(R()-0.5)*20,vy:R()*40,g:1300,max:2,r:W*(0.025+R()*0.03),col:zolle[i%zolle.length],rot:R()*3,fondo:sy+(R()-0.5)*Q*0.8})}
 else if(id==='acqua'||id==='pioggia'){for(let i=0;i<16;i++)part({tipo:'goccia',x:sx+(R()-0.5)*W*0.25,y:top-R()*W*0.5,vx:(R()-0.5)*15,vy:R()*60,g:1300,max:1,r:1.8+R()*2,fondo:sy})}
 else if(id==='fuoco'||id==='lava'){part({tipo:'lampoFuoco',x:sx,y:sy-W*0.3,max:0.5,r:W*0.9,luce:true});for(let i=0;i<10;i++)part({tipo:'scintilla',x:sx+(R()-0.5)*W*0.2,y:top+R()*W*0.5,vx:(R()-0.5)*30,vy:200+R()*100,g:600,max:0.35,r:2,luce:true})}
 else if(id==='aria'){durata=0.1}
 else part({tipo:'icona',x:sx,y:top,vy:0,g:1500,max:0.32,id});
 dopo(durata,()=>{
  const r=regola(id,t);eventoCatena(false);
  if(r){r.fai();if(zolle||id==='pietra'||id==='mattone'||id==='legno'||id==='utensile'||id==='casa'){suono.tonfo();polvere(t,null,8)}}
  else{rifiuta(t,'Qui non succede niente… prova altrove!')}
  dopo(1.2,()=>{if(!noti.has('fango')||noti.size<6)suggerisci(false)});
 });
}
function infoGettone(id){
 const g=gettoniEl.querySelector(`[data-id="${id}"]`);const r=g.getBoundingClientRect();
 mostraFumetto(`<b>${EL[id].nome}</b> · ${EL[id].ricetta==='Elemento di base'?'un elemento di base':EL[id].ricetta}.<br>Trascinalo su una casella dell'isola!`,r.left+r.width/2);suono.presa();
}

// ================= suggerimenti =================
const SUGG=[
 [()=>!T.some(t=>t.g==='terra')&&!noti.has('fango'),'Trascina la <b>Terra</b> su una casella: si ammucchia!'],
 [()=>!noti.has('fango'),'Ora versa l\'<b>Acqua</b> sulla Terra. Cosa nascerà?'],
 [()=>!noti.has('lava'),'Prova il <b>Fuoco</b> sulla Terra… qualcosa di caldo cola giù!'],
 [()=>!noti.has('pietra'),'Fai arrivare la <b>Lava</b> fino al laghetto e guarda la reazione.'],
 [()=>!noti.has('argilla'),'Il vento asciuga: <b>Aria</b> sul Fango.'],
 [()=>!noti.has('vapore'),'<b>Fuoco</b> sull\'acqua del laghetto: sale qualcosa…'],
 [()=>!noti.has('germoglio'),'Metti della <b>Terra</b> dove passa la nuvola: con la pioggia diventa fango, e poi…'],
 [()=>!noti.has('albero'),'Aspetta un attimo: il germoglio sta crescendo!'],
 [()=>!noti.has('omini'),'<b>Fango</b> ai piedi di un Albero: guarda chi arriva!'],
 [()=>!noti.has('mattone'),'Cuoci l\'<b>Argilla</b> col Fuoco.'],
 [()=>!noti.has('legno'),'Una <b>Pietra</b> contro un Albero fa… legna!'],
 [()=>!noti.has('casa'),'<b>Legno</b> sui Mattoni: una casa per gli omini!'],
 [()=>!noti.has('utensile'),'<b>Pietra</b> sul Legno: il primo attrezzo!'],
 [()=>!noti.has('cenere'),'Attenzione al <b>Fuoco</b> vicino agli alberi…'],
 [()=>true,'Hai fatto nascere un mondo intero! Presto: nuove ere, fino alle stelle.'],
];
function suggerisci(forza){const s=SUGG.find(x=>x[0]());const terra=gettoniEl.querySelector('[data-id="terra"]');
 const r=$('#vassoio').getBoundingClientRect();mostraFumetto(s[1],VW/2,forza?6:4.5)}
let fumettoTimer=null;
function mostraFumetto(html,x,sec){fumetto.innerHTML=html;const r=vassoio.getBoundingClientRect();fumetto.style.top=(r.top-fumetto.offsetHeight-16)+'px';
 fumetto.style.left=clamp(x,Math.min(VW/2,180),VW-Math.min(VW/2,180))+'px';fumetto.classList.add('su');clearTimeout(fumettoTimer);
 requestAnimationFrame(()=>{fumetto.style.top=(r.top-fumetto.offsetHeight-16)+'px'});
 fumettoTimer=setTimeout(nascondiFumetto,(sec||4.5)*1000)}
function nascondiFumetto(){fumetto.classList.remove('su')}
$('#aiuto').addEventListener('pointerdown',e=>{sbloccaAudio();chiudiTitolo();suggerisci(true);suono.presa()});
// mano fantasma che mostra il gesto all'inizio
const mano=$('#mano');let manoAn=null;
function avviaMano(){
 const g=gettoniEl.querySelector('[data-id="terra"]');if(!g||primoTrascino)return;const r=g.querySelector('canvas').getBoundingClientRect();
 const t=casella(6,3);const[tx,ty]=centro(t);mano.innerHTML='';mano.append(canvasGettone('terra',62));g.classList.add('invita');
 manoAn=mano.animate([{transform:`translate(${r.left+31}px,${r.top+31}px) scale(1)`,opacity:0},{opacity:0.85,offset:0.12},
  {transform:`translate(${tx}px,${ty}px) scale(.85)`,opacity:0.85,offset:0.7},{transform:`translate(${tx}px,${ty}px) scale(.5)`,opacity:0}],{duration:2200,iterations:Infinity,delay:400,easing:'ease-in-out'});
}
function fermaMano(){if(manoAn){manoAn.cancel();manoAn=null}mano.style.opacity=0;gettoniEl.querySelectorAll('.invita').forEach(g=>g.classList.remove('invita'))}
let titoloChiuso=false;
function chiudiTitolo(){if(titoloChiuso)return;titoloChiuso=true;$('#titolo').classList.add('via');setTimeout(()=>$('#titolo').remove(),1200)}

// ================= icone dell'interfaccia =================
function iconeHud(){
 const st=$('#icStella');st.width=st.height=34*DPR;let c=st.getContext('2d');c.scale(DPR,DPR);
 let g=c.createRadialGradient(13,12,2,17,17,17);g.addColorStop(0,'#fff3b8');g.addColorStop(1,'#ffb52e');c.fillStyle=g;c.beginPath();c.arc(17,17,15,0,7);c.fill();
 c.fillStyle='#fff';c.save();c.translate(17,17.5);c.beginPath();for(let k=0;k<10;k++){const r=k%2?4.2:9.5,a=-Math.PI/2+k*Math.PI/5;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();c.restore();
 const lu=$('#icLuce');lu.width=lu.height=30*DPR;c=lu.getContext('2d');c.scale(DPR,DPR);
 g=c.createRadialGradient(13,10,1,15,12,10);g.addColorStop(0,'#fffbe0');g.addColorStop(1,'#ffc93c');c.fillStyle=g;
 c.beginPath();c.arc(15,12,8.5,Math.PI*0.8,Math.PI*2.2);c.lineTo(18.5,21);c.lineTo(11.5,21);c.closePath();c.fill();
 c.fillStyle='#9b8a76';c.beginPath();c.roundRect(11.2,21.5,7.6,4.5,1.5);c.fill();c.strokeStyle='#d8cbb8';c.lineWidth=1;c.beginPath();c.moveTo(11.5,23.6);c.lineTo(18.5,23.6);c.stroke();
 c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1.6;c.lineCap='round';c.beginPath();c.arc(15,12,5,Math.PI*1.1,Math.PI*1.5);c.stroke();
}

// ================= ciclo principale =================
let ultimo=performance.now();
function ciclo(now){
 const dtr=Math.min(0.05,(now-ultimo)/1000);ultimo=now;fpsMedia=lerp(fpsMedia,1/Math.max(0.001,dtr),0.05);
 aggiorna(dtr*scalaTempo);
 disegna();
 if(primoTrascino&&tempo-ultimaAzione>16){ultimaAzione=tempo;suggerisci(false)}
 requestAnimationFrame(ciclo);
}
function avvio(){
 for(const id of noti)aggiungiGettone(id,false);
 iconeHud();layout();calcolaDist();
 nuvole.push({deco:true,x:1,y:3,alt:3.8,vx:0,vy:0,var:0,alpha:0.9,nasce:1,fase:1});
 nuvole.push({deco:true,x:5.5,y:-1,alt:4.2,vx:0,vy:0,var:1,alpha:0.9,nasce:1,fase:2});
 requestAnimationFrame(ciclo);
 setTimeout(()=>{chiudiTitolo();setTimeout(()=>{if(!primoTrascino){suggerisci(true);avviaMano()}},700)},2200);
}
let rt=null;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout()},120)});
avvio();

// ================= strumenti per le prove automatiche =================
window.__mondo={
 casella:(x,y)=>{const t=casella(x,y);const[sx,sy]=centro(t);return{x:sx,y:sy,g:t.g,h:t.h,o:t.o?(t.o.t==='verde'?stadio(t.o):t.o.t):null,fuoco:t.fuoco>0}},
 scosta:()=>SCOSTA_DITO,
 noti:()=>[...noti],
 ora:v=>{if(v!=null)ora=v;return ora},
 velocita:k=>{scalaTempo=k},
 gettone:id=>{const g=gettoniEl.querySelector(`[data-id="${id}"]`);if(!g)return null;g.scrollIntoView({inline:'center',block:'nearest'});const r=g.querySelector('canvas').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}},
 stato:()=>({nuvole:nuvole.length,omini:omini.length,ominiStati:omini.map(o=>o.stato),particelle:P.length,fps:Math.round(fpsMedia),W}),
 mappa:()=>{let s='';for(let y=0;y<N;y++){for(let x=0;x<N;x++){const t=casella(x,y);s+=!t.isola?' . ':(t.o?(t.o.t==='verde'?stadio(t.o)[0].toUpperCase():t.o.t[0].toUpperCase()):t.g.slice(0,1))+t.h+' '}s+='\n'}return s},
};

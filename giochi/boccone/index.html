</script>
<script>
/* Boccone — i livelli (B.livelli): costruisce, dal cast e da ciò che è registrato in questo momento, tutto quello che
   serve al mondo (50-mondo.js) per creare una partita. Solo dati: nessun disegno e nessuno stato.
   I campi della configurazione sono descritti in ARCHITETTURA.md §8. */
(() => {
'use strict';
const B = window.B;
const { limita } = B.util;

// ---------------------------------------------------------------- taratura
// Le regole di base (potenze, taglie, quanti pesci, banchi) vengono dalla versione precedente; il resto è tarato con
// strumenti/prova-mondo.mjs (tabella in ARCHITETTURA §8): non cambiare i numeri senza rifare quella prova.
const PER_AMBIENTE = B.cast.livelliPerAmbiente || 5;
/* Gli ambienti giocabili, in ordine: quelli di B.cast.aperti che esistono nel cast (se l'elenco manca, tutti). */
const APERTI = (Array.isArray(B.cast.aperti) && B.cast.aperti.length ? B.cast.aperti : B.cast.ambienti.map(a => a.id))
  .map(id => B.cast.ambienti.find(a => a.id === id)).filter(Boolean);
const TOTALE = Math.max(1, APERTI.length) * PER_AMBIENTE;
const POTENZA_BASE = 18;          // potenza minima della taglia 1
const PASSO_TAGLIA = 6;           // ogni taglia è 6 volte più forte della precedente
const LARGHEZZA_FASCIA = 2.6;     // dal più debole al più forte della stessa taglia
const QUANTI = [10, 9, 8, 7, 6];  // esemplari per taglia in un mondo di 2600 × 2600
const GENTILE = 0.85;             // al primo livello i pesci sono un po' meno
/* Nei cinque livelli del primo ambiente i pesci grossi aumentano piano (poi vale AFFOLLAMENTO dell'ambiente). */
const FOLLA_PRIMI = [GENTILE, 1.0, 1.05, 1.1, 1.0];
/* Quanti pesci in più o in meno per ambiente (1 = come da QUANTI). Gli ambienti con le specie più tranquille (timide,
   pigre, da agguato) ne hanno di più, quelli pieni di inseguitori di meno: così la difficoltà cresce con i livelli e
   non a salti secondo chi ci abita. Numeri trovati con prova-mondo.mjs: da rivedere se cambia il cast. */
const AFFOLLAMENTO = { laguna: 1.2, mare_aperto: 1.2, ghiacci: 0.9, rovine: 1.1, vulcano: 1.15, abisso: 0.9 };
const AREA_BASE = 2600 * 2600;
const VALORE_PESCIOLINO = [1, 1, 2, 6, 25, 100];   // quanto vale un pesciolino secondo la fascia dell'eroe
const BANCHI_BASE = 16, PESCI_PER_BANCO = 70, BANCHI_MAX = 24;
const RAGGIO_CAPO = 120, RAGGIO_CAPO_PASSO = 8;    // capobranco: 120, 128, 136, 144 (il gigante è più grosso)
const MORSI_GIGANTE = 3, POTENZA_GIGANTE = 0.8;   // potenza del gigante rispetto a quella di un capobranco
const RAGGI_PERICOLO = { medusa: 24, medusa_criniera: 34, riccio: 26, mina: 32, amo: 20, sfiatatoio: 38, stalattite: 26 };
const RAGGIO_PERICOLO = 26;
const SCIAME = 1.5, PERICOLI_MAX = 14;   // particolarità "sciame": meduse × 1,5; in tutto mai più di 14 pericoli

/* Difficoltà (decide velocità e vista dei pesci, e la velocità di capobranco e gigante): 0 al primo livello, 4 al
   secondo, sale in fretta fino al decimo (9,6) e poi piano fino a 12,6 all'ultimo. Nella versione precedente saliva
   di uno a livello fino a 12; qui i livelli sono quaranta e gli ambienti più avanti hanno già abitanti e pericoli più
   insidiosi: i livelli alti si affrontano con i potenziamenti del negozio. */
/* Il primo ambiente è la scuola del gioco e sale più dolce: 0, 2,5, 3,5, 4,3, 5,2. */
const PRIMI_LIVELLI = [0, 2.5, 3.5, 4.3, 5.2];
function difficolta(n) { return n <= PRIMI_LIVELLI.length ? PRIMI_LIVELLI[Math.max(1, n) - 1] : n <= 10 ? 4 + (n - 2) * 0.7 : 9.6 + (n - 10) * 0.1; }

// ---------------------------------------------------------------- particolarità dei livelli
const PARTICOLARITA = {
  corrente: { tipo: 'corrente', nome: 'Corrente forte', descrizione: 'L\'acqua ti spinge: nuota controcorrente.' },
  buio:     { tipo: 'buio',     nome: 'Acque buie',     descrizione: 'Si vede poco: tieni gli occhi aperti.' },
  branchi:  { tipo: 'branchi',  nome: 'Mare pescoso',   descrizione: 'Tanti banchi di pesciolini da mangiare.' },
  sciame:   { tipo: 'sciame',   nome: 'Sciame',         descrizione: 'Attento: ce ne sono molte più del solito.' },
  dorato:   { tipo: 'dorato',   nome: 'Banco dorato',   descrizione: 'I pesciolini dorati passano spesso: valgono molto.' },
};
/* Per ogni ambiente (in ordine) la particolarità dei suoi cinque livelli. Il primo livello di ogni ambiente e quello
   del gigante non ne hanno: lì la novità è l'ambiente, o il gigante. Nemmeno il secondo livello del gioco ne ha. */
const CALENDARIO = [
  [null, null, 'dorato', 'sciame', null],
  [null, 'corrente', 'dorato', 'sciame', null],
  [null, 'buio', 'branchi', 'sciame', null],
  [null, 'corrente', 'dorato', 'branchi', null],
  [null, 'sciame', 'corrente', 'dorato', null],
  [null, 'branchi', 'buio', 'corrente', null],
  [null, 'sciame', 'dorato', 'buio', null],
  [null, 'buio', 'sciame', 'corrente', null],
];

// ---------------------------------------------------------------- ambiente e specie
/* La scheda del cast dell'ambiente che occupa il posto dato (1, 2, 3…) fra quelli aperti. */
function schedaAmbiente(ordine) {
  const a = APERTI.length ? APERTI : B.cast.ambienti;
  return a[(ordine - 1) % a.length];
}

/* L'ambiente al posto dato: quello registrato; se manca, un altro registrato; se non ce n'è nessuno, la scheda del
   cast (senza disegno: il mondo funziona lo stesso, la scena resta vuota). */
function ambienteDiOrdine(ordine) {
  const registrati = B.ambienti.inOrdine();
  const scheda = schedaAmbiente(ordine);
  return registrati.find(a => a.id === scheda.id)
    || registrati[(ordine - 1) % Math.max(1, registrati.length)]
    || Object.assign({ colori: {}, banchi: [], pericoli: [] }, scheda);
}

function ordineDi(n) { return Math.ceil(limita(Math.round(n) || 1, 1, TOTALE) / PER_AMBIENTE); }
function ambienteDi(n) { return ambienteDiOrdine(ordineDi(n)); }

const postoNelCast = id => { const i = B.cast.specie.findIndex(s => s.id === id); return i < 0 ? 9999 : i; };

/* I pesci registrati, nell'ordine del cast (l'ordine di registrazione dipende dai file: così il livello è sempre uguale). */
function pesciRegistrati() { return B.specie.diTipo('pesce').sort((a, b) => postoNelCast(a.id) - postoNelCast(b.id)); }

/* Le specie candidate per una taglia in un ambiente: quelle dell'ambiente (prima quelle "di casa"); se non ce ne sono,
   quelle della stessa taglia di altri ambienti; se non ce ne sono proprio, quelle della taglia più vicina. */
function candidati(pesci, idAmbiente, taglia) {
  const diCasa = pesci.filter(s => s.taglia === taglia && s.ambienti.includes(idAmbiente));
  if (diCasa.length) return diCasa.sort((a, b) => (a.ambienti[0] === idAmbiente ? 0 : 1) - (b.ambienti[0] === idAmbiente ? 0 : 1));
  for (let scarto = 0; scarto < 5; scarto++) {
    const vicine = pesci.filter(s => Math.abs(s.taglia - taglia) === scarto);
    if (vicine.length) return vicine;
  }
  return [];
}

/* Dalle candidate ne sceglie fino a tre, a rotazione secondo il livello; la prima compare il doppio delle altre, così
   i livelli dello stesso ambiente non si somigliano troppo. Una specie timida non è mai quella che compare il doppio
   (se ce n'è un'altra): altrimenti certi livelli sarebbero una passeggiata. */
function specieDellaFascia(lista, giro) {
  if (lista.length < 2) return lista.slice();
  const n = lista.length, scelte = [];
  for (let i = 0; i < Math.min(3, n); i++) scelte.push(lista[(giro + i) % n]);
  const decisa = scelte.findIndex(s => s.indole !== 'timido');
  if (decisa > 0) scelte.unshift(scelte.splice(decisa, 1)[0]);
  return [scelte[0], ...scelte];
}

// ---------------------------------------------------------------- pezzi della configurazione
function creaFasce(amb, K, d, densita, giro, folla = 1) {
  const pesci = pesciRegistrati(), fasce = [];
  for (let k = 0; k < K; k++) {
    const min = POTENZA_BASE * Math.pow(PASSO_TAGLIA, k);
    const specie = specieDellaFascia(candidati(pesci, amb.id, k + 1), giro);
    fasce.push({
      k, taglia: k + 1, min, max: Math.round(min * LARGHEZZA_FASCIA), r: B.cast.raggi[k],
      quanti: specie.length ? Math.round(QUANTI[k] * densita * folla) : 0,
      // con la difficoltà i pesci grossi si fanno più svelti e ci vedono più lontano; i piccoli meno, perché
      // l'inizio di ogni livello resti abbordabile (nella versione precedente: + d × 3 e + d × 4 per tutti)
      vel: 135 + k * 10 + d * (2 + 0.5 * k), senso: 160 + k * 30 + d * (2.5 + 1.25 * k),
      specie,
    });
  }
  return fasce;
}

/* L'obiettivo del livello: il gigante dell'ambiente (ultimo livello dell'ambiente) oppure il capobranco, un esemplare
   enorme con la corona di una specie di taglia 5 (di preferenza una che non sia timida). */
function creaObiettivo(amb, K, d, posto, giro) {
  const potenza = Math.round(POTENZA_BASE * Math.pow(PASSO_TAGLIA, K) * 2.5 / 1000) * 1000;
  const comune = { k: K, potenza, vel: 126 + d * 4, senso: 470 };
  if (posto === PER_AMBIENTE) {
    const giganti = B.specie.diTipo('gigante').sort((a, b) => postoNelCast(a.id) - postoNelCast(b.id));
    const def = giganti.find(g => g.id === amb.gigante) || giganti[giro % Math.max(1, giganti.length)];
    // il gigante parte un po' meno forte del capobranco, perché a ogni morso cresce: così il livello non dura il doppio
    if (def) return Object.assign(comune, { tipo: 'gigante', def, nome: def.nome, r: B.cast.raggioGigante, morsi: MORSI_GIGANTE,
      potenza: Math.round(potenza * POTENZA_GIGANTE / 1000) * 1000, attacchi: (def.attacchi || ['carica']).slice() });
  }
  const grossi = candidati(pesciRegistrati(), amb.id, 5);
  const decisi = grossi.filter(s => s.indole !== 'timido');
  const scelta = decisi.length ? decisi : grossi;
  const def = scelta.length ? scelta[giro % scelta.length] : null;
  // il capobranco carica un po' meno spesso di un gigante; al primo livello molto meno, e si accorge dell'eroe più tardi
  return Object.assign(comune, {
    tipo: 'capobranco', def, nome: def ? def.nome + ' capobranco' : 'Capobranco',
    r: RAGGIO_CAPO + RAGGIO_CAPO_PASSO * Math.min(posto - 1, 3), morsi: 1, attacchi: ['carica'],
    pausa: d < 1 ? [8.5, 11.5] : [4.5, 6.5], degna: d < 1 ? 12 : 40,
  });
}

function raggioPericolo(def) { return def.raggio || RAGGI_PERICOLO[def.id] || RAGGIO_PERICOLO; }

/* I pericoli dell'ambiente, fra quelli registrati: il primo dell'elenco è il più numeroso. */
function creaPericoli(amb, quanti, sciame) {
  const def = (amb.pericoli || []).map(id => B.specie.prendi(id)).filter(s => s && s.tipo === 'pericolo');
  if (!def.length || quanti <= 0) return [];
  const parti = def.length === 1 ? [quanti] : [Math.ceil(quanti * 0.6), Math.floor(quanti * 0.4)];
  const gruppi = def.slice(0, 2).map((s, i) => {
    const comportamento = s.comportamento || 'fermo';
    return { def: s, comportamento, r: raggioPericolo(s), quanti: Math.round(parti[i] * (sciame && comportamento === 'deriva' ? SCIAME : 1)) };
  });
  const totale = gruppi.reduce((q, g) => q + g.quanti, 0);
  if (totale > PERICOLI_MAX) for (const g of gruppi) g.quanti = Math.round(g.quanti * PERICOLI_MAX / totale);
  return gruppi.filter(p => p.quanti > 0);
}

function creaBanchi(amb, densita, tanti) {
  const specie = (amb.banchi || []).map(id => B.specie.prendi(id)).filter(s => s && s.tipo === 'banco');
  const dorato = B.specie.prendi('dorato');
  return {
    specie, perBanco: PESCI_PER_BANCO,
    quanti: specie.length ? Math.min(BANCHI_MAX, Math.round(BANCHI_BASE * densita * (tanti ? 1.4 : 1))) : 0,
    dorato: dorato && dorato.tipo === 'banco' ? dorato : null,
  };
}

const densitaDi = amb => limita(amb.mondo.w * amb.mondo.h / AREA_BASE, 0.9, 1.35);

// ---------------------------------------------------------------- B.livelli
/* Tutto ciò che serve per creare il livello n dell'avventura (1..40). Usa solo ciò che è registrato adesso. */
function config(n) {
  n = limita(Math.round(n) || 1, 1, TOTALE);
  const ordine = ordineDi(n), posto = n - (ordine - 1) * PER_AMBIENTE, giro = posto - 1;
  const amb = ambienteDiOrdine(ordine), d = difficolta(n), K = n === 1 ? 4 : 5, densita = densitaDi(amb);
  const nomePart = (CALENDARIO[((amb.ordine || ordine) - 1) % CALENDARIO.length] || [])[giro] || null;
  const particolarita = nomePart ? PARTICOLARITA[nomePart] : null;
  const tipo = particolarita ? particolarita.tipo : '';
  const obiettivo = creaObiettivo(amb, K, d, posto, giro);
  // pericoli: nessuno al primo livello, 5 al secondo, 7 dal quarto, poi uno in più ogni dodici livelli (fino a 10)
  const quantiPericoli = n === 1 ? 0 : Math.round((Math.min(3 + n, 7) + Math.min(3, Math.floor((n - 1) / 12))) * densita);
  return {
    n, modalita: 'avventura', ordine, posto, ambiente: amb, K, difficolta: d, seme: n,
    fasce: creaFasce(amb, K, d, densita, giro, n <= FOLLA_PRIMI.length ? FOLLA_PRIMI[Math.max(1, n) - 1] : AFFOLLAMENTO[amb.id] || 1),
    obiettivo,
    banchi: creaBanchi(amb, densita, tipo === 'branchi'),
    pericoli: creaPericoli(amb, quantiPericoli, tipo === 'sciame'),
    pericoliMax: 0, pericoloOgni: 0,
    particolarita,
    valorePesciolino: VALORE_PESCIOLINO,
    conchiglie: Math.round(9 * amb.mondo.w / 2600),
    tempoStella: K === 4 ? 200 : obiettivo.tipo === 'gigante' ? 420 : 300,
  };
}

/* La sopravvivenza: stesso ambiente e stesse specie, nessun obiettivo; il mondo sposta le fasce verso l'alto quando
   l'eroe cresce (vedi "ottava" in 50-mondo.js) e aggiunge un pericolo ogni tanto.
   idAmbiente è facoltativo: senza, si pesca a caso fra gli ambienti aperti. */
function configSopravvivenza(idAmbiente) {
  const posto = APERTI.findIndex(a => a.id === idAmbiente);
  const amb = ambienteDiOrdine(posto >= 0 ? posto + 1 : 1 + Math.floor(Math.random() * Math.max(1, APERTI.length)));
  const d = 3, K = 5, densita = densitaDi(amb), giro = Math.floor(Math.random() * 5);
  return {
    n: 0, modalita: 'sopravvivenza', ordine: amb.ordine || 1, posto: 0, ambiente: amb, K, difficolta: d, seme: 1000 + (amb.ordine || 1),
    fasce: creaFasce(amb, K, d, densita, giro),
    obiettivo: null,
    banchi: creaBanchi(amb, densita, false),
    pericoli: creaPericoli(amb, Math.round(3 * densita), false),
    pericoliMax: 14, pericoloOgni: 40,
    particolarita: null,
    valorePesciolino: VALORE_PESCIOLINO,
    conchiglie: Math.round(9 * amb.mondo.w / 2600),
    tempoStella: 0,
    // a ogni salto di ottava: potenze × PASSO_TAGLIA, pesci più svelti e con la vista più lunga (le grandezze restano)
    ottava: { potenza: PASSO_TAGLIA, raggio: 0, vel: 8, senso: 10 },
  };
}

/* Il primo livello di un ambiente (per la mappa e per l'acquario dietro al menu); 0 se l'ambiente non è aperto. */
function primoLivelloDi(idAmbiente) { const i = APERTI.findIndex(a => a.id === idAmbiente); return i < 0 ? 0 : i * PER_AMBIENTE + 1; }

B.livelli = {
  totale: TOTALE,
  perAmbiente: PER_AMBIENTE,
  aperti: APERTI.map(a => a.id),
  primoLivelloDi,
  ambienteDi,
  config,
  configSopravvivenza,
  difficolta,
  raggioPericolo,
  PARTICOLARITA,
};
})();

//# sourceURL=boccone/js/51-livelli.js
</script>
<script>
/* Boccone — i giganti (B.giganti): come si comportano il gigante dell'ultimo livello di ogni ambiente e il capobranco
   degli altri livelli, e i loro attacchi per nome.
   Il gigante è un abitante del mondo come gli altri (sta in M.predatori): qui c'è solo ciò che lo rende speciale.
   Il mondo (50-mondo.js) chiama prepara() alla nascita, pensa() a ogni fotogramma quando non è stordito né in avviso né
   in carica, colpisce() quando finisce l'avviso, e morso() quando l'eroe, diventato più forte, lo tocca.
   Vedi ARCHITETTURA.md §8. */
(() => {
'use strict';
const B = window.B;
const { caso } = B.util;

// ---------------------------------------------------------------- taratura
const PAUSA_ATTACCHI = [4, 6];       // secondi fra un attacco e l'altro dei giganti
const CARICA_GIGANTE = 2.9, CARICA_CAPO = 2.7;   // quante volte la sua velocità, durante lo scatto della carica
const FURIA_PAUSA = 0.22;            // a ogni morso la pausa si accorcia di questa parte
const FURIA_VEL = 0.1;               // … e nuota più svelto di questa parte
const FURIA_AVVISO = 0.12;           // … e gli avvisi si accorciano di questa parte
const FURIA_POTENZA = 1.15;          // … e diventa più forte: l'eroe deve crescere ancora un po' prima di morderlo di nuovo
const NON_TI_DEGNA = 40;             // si accorge dell'eroe solo quando la potenza di lui × 40 arriva alla sua
const STORDITO_DOPO_MORSO = 1.6;
const INTOCCABILE_DOPO_MORSO = 2.4;  // secondi in cui non si può mordere di nuovo (e non fa male)
const SPINTA_MORSO = 520;            // quanto viene respinto
const ARRETRA = 0.6;                 // quando l'eroe è più forte indietreggia piano: si lascia raggiungere

const RISUCCHIO = { raggio: 640, forza: 0.74, durata: 2.6 };          // forza: parte della velocità dell'eroe
const ONDA = { vel: 560, tentacoli: { rMax: 440, rMale: 300 }, onda: { rMax: 600, rMale: 330 } };
const SPARO = { vel: 225, r: 22, vita: 4.5, ventaglio: 0.3 };
const RAFFICA = { vel: 250, r: 18, vita: 3.6, ogni: 0.24, colpi: 5 };
const BUIO = { durata: 6, vel: 1.15 };

// ---------------------------------------------------------------- attacchi
/* Un attacco è { portata, inizia(e, s, M), colpisce?(e, M), aggiorna?(e, s, m, dt, M) }.
     portata   distanza dall'eroe (da centro a centro) entro cui può partire
     inizia    lo fa cominciare: mette l'avviso (e.stato diventa 'avviso' ed e.carica sale da 0 a 1; durante l'avviso
               il gigante sta fermo e prende la mira, ci pensa il mondo)
     colpisce  che cosa succede quando l'avviso finisce. Se manca, il gigante parte in carica (scatto in linea retta).
     aggiorna  facoltativo, per gli attacchi che durano dopo il colpo: decide la mossa m a ogni fotogramma e risponde
               true finché l'attacco non è finito. e.attT sono i secondi passati dal colpo, e.attN un contatore libero.
   Gli attrezzi del mondo (suoni, onde, proiettili, nuvole, risucchio, buio, branco…) sono in B.partita.attrezzi.
   Per aggiungere un attacco: una voce qui (o in B.giganti.attacchi) e il nome nel campo "attacchi" del cast. */
const at = () => B.partita.attrezzi;
const avviso = (e, secondi) => { at().preparaAvviso(e, secondi * Math.max(0.5, 1 - FURIA_AVVISO * e.furia)); at().suono('avviso'); };
const carica = (e, secondi, scatto, molt) => { at().preparaCarica(e, secondi * Math.max(0.5, 1 - FURIA_AVVISO * e.furia), scatto, molt + 0.15 * e.furia); at().suono('avviso'); };
const boccaX = e => e.x + Math.cos(e.ang) * e.r * 0.8, boccaY = e => e.y + Math.sin(e.ang) * e.r * 0.8;

function spara(e, ang, c, tipo) { at().proiettile(boccaX(e), boccaY(e), ang, c.vel, c.r, c.vita, e, tipo); }
function scuoti(e, c) { at().onda(e.x, e.y, e.r * 0.8, c.rMax + 30 * e.furia, ONDA.vel, c.rMale + 15 * e.furia, e, 'onda'); at().suono('scoppio'); at().vibra(40); }

const ATTACCHI = {
  /* Prende la mira e parte dritto come una freccia. */
  carica: { portata: 520, inizia(e) { carica(e, 0.75, 0.85, e.gigante ? CARICA_GIGANTE : CARICA_CAPO); } },

  /* Uno scatto corto e fulmineo, da vicino. */
  morso: { portata: 360, inizia(e) { carica(e, 0.5, 0.5, 3.3); } },

  /* Una carica lunga che lascia dietro una scia torbida. */
  scia: { portata: 600, inizia(e) { carica(e, 0.8, 1.05, 2.6); e.scia = true; e.sciaT = 0; } },

  /* Spalanca la bocca e aspira: l'eroe e i pesciolini vengono tirati verso di lui per qualche secondo. */
  risucchio: {
    portata: 600,
    inizia(e) { avviso(e, 0.7); },
    colpisce(e) { e.attDurata = RISUCCHIO.durata + 0.3 * e.furia; at().suono('carica'); },
    aggiorna(e, s, m) {
      if (e.attT >= e.attDurata) return false;
      m.vel = 0; m.verso = Math.atan2(s.dy, s.dx); m.gira = 1.4; m.insegue = true; m.bocca = 1;
      at().tira(boccaX(e), boccaY(e), RISUCCHIO.raggio, Math.min(0.9, RISUCCHIO.forza + 0.05 * e.furia));
      return true;
    },
  },

  /* Grandi nuvole di inchiostro addosso all'eroe e lungo la strada: poi attacca di nuovo, presto. */
  inchiostro: {
    portata: 620,
    inizia(e) { avviso(e, 0.6); },
    colpisce(e, M) {
      const h = M.eroe, quante = 3 + Math.min(2, e.furia);
      for (let i = 0; i < quante; i++) {
        const k = i / (quante - 1), r = caso(210, 290);
        at().nuvola(e.x + (h.x + h.vx * 0.5 - e.x) * (1.15 - k * 0.75) + caso(-90, 90), e.y + (h.y + h.vy * 0.5 - e.y) * (1.15 - k * 0.75) + caso(-90, 90), r, caso(5.5, 7), 'inchiostro');
      }
      at().suono('inchiostro');
      e.prossimoAttacco = Math.min(e.prossimoAttacco, 1.8);
    },
  },

  /* Frusta l'acqua tutt'attorno: un'onda d'urto corta che respinge, e da vicino fa male. */
  tentacoli: { portata: 420, inizia(e) { avviso(e, 0.7); }, colpisce(e) { scuoti(e, ONDA.tentacoli); } },

  /* Un'onda d'urto larga; da infuriato ne arriva subito una seconda. */
  onda: {
    portata: 540,
    inizia(e) { avviso(e, 0.85); },
    colpisce(e) { scuoti(e, ONDA.onda); e.attN = e.furia > 0 ? 1 : 0; },
    aggiorna(e, s, m) {
      if (e.attN <= 0) return false;
      m.vel = 0; m.insegue = true;
      if (e.attT >= 0.6) { e.attN = 0; scuoti(e, ONDA.onda); }
      return true;
    },
  },

  /* Un ventaglio di proiettili lenti. */
  sparo: {
    portata: 780,
    inizia(e) { avviso(e, 0.6); },
    colpisce(e, M) {
      const h = M.eroe, verso = Math.atan2(h.y - e.y, h.x - e.x), quanti = 3 + Math.min(2, e.furia);
      for (let i = 0; i < quanti; i++) spara(e, verso + (i - (quanti - 1) / 2) * SPARO.ventaglio, SPARO, 'sparo');
      at().suono('scatto');
    },
  },

  /* Una fila di proiettili, uno dopo l'altro, ognuno puntato dove sta l'eroe in quel momento. */
  raffica: {
    portata: 820,
    inizia(e) { avviso(e, 0.6); },
    colpisce(e) { e.attN = RAFFICA.colpi + e.furia; e.attDurata = 0; },
    aggiorna(e, s, m) {
      if (e.attN <= 0) return false;
      m.vel = e.vel * 0.35; m.verso = Math.atan2(s.dy, s.dx); m.insegue = true; m.bocca = 0.9;
      if (e.attT >= e.attDurata) {
        e.attDurata += RAFFICA.ogni; e.attN--;
        spara(e, Math.atan2(s.dy, s.dx) + caso(-0.07, 0.07), RAFFICA, 'raffica');
        at().suono('scatto');
      }
      return true;
    },
  },

  /* Chiama un branco in aiuto. */
  evoca: {
    portata: 720,
    inizia(e) { avviso(e, 0.7); },
    colpisce(e) {
      if (at().evoca(e, 3 + Math.min(1, e.furia)) > 0) { at().testo(e.x, e.y - e.r, 'Arriva il branco!', '#ffe066', true); at().suono('avviso'); }
      else e.prossimoAttacco = Math.min(e.prossimoAttacco, 1.5);         // il branco c'è già: passa all'attacco dopo
    },
  },

  /* Spegne la luce: per qualche secondo si vede pochissimo (M.buio sale), e lui ne approfitta per avvicinarsi. */
  buio: {
    portata: 820,
    inizia(e) { avviso(e, 0.6); },
    colpisce(e) { e.attDurata = BUIO.durata + e.furia; at().oscura(e.attDurata); at().suono('inchiostro'); },
    aggiorna(e, s, m) {
      if (e.attT >= e.attDurata || !s.forte) return false;
      m.verso = Math.atan2(s.dy, s.dx); m.vel = e.vel * BUIO.vel; m.insegue = true;
      return true;
    },
  },
};
/* Un nome che non c'è (ancora) ricade sulla carica. */
const attacco = nome => ATTACCHI[nome] || ATTACCHI.carica;

function pausa(e) { return caso(e.pausa[0], e.pausa[1]) * Math.max(0.35, 1 - FURIA_PAUSA * e.furia); }
function smette(e) { e.attacco = null; e.inAttacco = null; e.attaccoNome = ''; e.scia = false; }

// ---------------------------------------------------------------- vita del gigante
/* Aggiunge all'abitante i campi del gigante (o del capobranco). ob è l'obiettivo della configurazione del livello. */
function prepara(e, ob) {
  e.morsi = ob.morsi; e.morsiTotali = ob.morsi; e.vita = 1; e.furia = 0;
  e.attacchi = ob.attacchi && ob.attacchi.length ? ob.attacchi : ['carica'];
  e.pausa = ob.pausa || PAUSA_ATTACCHI; e.degna = ob.degna || NON_TI_DEGNA;
  e.indiceAttacco = 0; e.prossimoAttacco = caso(3, 5);
  e.velCalmo = e.vel; e.intoccabile = 0; e.sconfitto = 0; e.attT = 0; e.attN = 0; e.attDurata = 0;
  smette(e);
}

/* Decide la mossa m del gigante per questo fotogramma. s sono i sensi calcolati dal mondo (distanza dall'eroe, se è
   più forte, se gli interessa). Finché l'eroe è più debole lo insegue e, quando è a tiro, lancia i suoi attacchi a turno. */
function pensa(e, s, m, dt, M) {
  if (e.attacco) {                                  // un attacco che dura si gestisce da solo
    e.attT += dt;
    if (s.inGioco && e.attacco.aggiorna(e, s, m, dt, M)) return;
    smette(e);
  }
  if (!s.vicino) return;                            // lontano: gira per conto suo
  if (!s.forte) {                                   // l'eroe è più forte: indietreggia
    m.verso = Math.atan2(-s.dy, -s.dx); m.vel = e.vel * ARRETRA; m.fugge = true;
    return;
  }
  if (s.ignora) return;                             // riposa, o l'eroe è ancora troppo piccolo per interessargli
  m.verso = Math.atan2(s.dy, s.dx); m.vel = e.vel; m.insegue = true;
  e.prossimoAttacco -= dt;
  if (e.prossimoAttacco > 0) return;
  const nome = e.attacchi[e.indiceAttacco % e.attacchi.length], a = attacco(nome);
  if (s.d > a.portata + e.r * 0.5) return;          // aspetta di essere a tiro
  e.indiceAttacco++; e.prossimoAttacco = pausa(e);
  e.inAttacco = a; e.attaccoNome = ATTACCHI[nome] ? nome : 'carica';
  a.inizia(e, s, M);
}

/* Finito l'avviso: se l'attacco in corso ha un colpo suo lo fa e risponde true; altrimenti false (il mondo fa partire
   la carica). */
function colpisce(e, M) {
  const a = e.inAttacco;
  if (!a || !a.colpisce) { e.inAttacco = null; return false; }
  e.attT = 0; e.attN = 0;
  a.colpisce(e, M);
  e.attacco = a.aggiorna ? a : null;
  if (!e.attacco) { e.inAttacco = null; e.attaccoNome = ''; }
  return true;
}

/* Un morso dell'eroe. Risponde quanti morsi mancano: a zero il gigante è sconfitto.
   Altrimenti resta stordito, viene respinto, perde una parte della vita e si infuria: più svelto, attacchi più
   frequenti e più forte di prima (così l'eroe deve crescere ancora un po' prima del morso successivo). */
function morso(e, M) {
  e.morsi = Math.max(0, e.morsi - 1);
  e.vita = e.morsi / e.morsiTotali;
  e.avviso = 0; e.sprint = 0; e.carica = 0; smette(e);
  if (e.morsi === 0) { e.stato = 'sconfitto'; e.sconfitto = 1.3; e.stordito = 9; return 0; }
  e.furia++;
  e.p = Math.round(e.p * FURIA_POTENZA / 1000) * 1000; e.soglia = e.p;
  e.vel = e.velCalmo * (1 + FURIA_VEL * e.furia);
  e.stordito = STORDITO_DOPO_MORSO; e.intoccabile = INTOCCABILE_DOPO_MORSO; e.prossimoAttacco = 1;
  const h = M.eroe, a = h ? Math.atan2(e.y - h.y, e.x - h.x) : 0;
  e.kx = Math.cos(a) * SPINTA_MORSO; e.ky = Math.sin(a) * SPINTA_MORSO;
  return e.morsi;
}

B.giganti = { attacchi: ATTACCHI, attacco, prepara, pensa, colpisce, morso };
})();

<script>
/* Boccone — suoni e musica (B.audio), tutto sintetizzato con WebAudio: nessun file.
   B.audio.avvia()                 da chiamare al primo tocco (i telefoni non fanno suonare nulla prima)
   B.audio.effetto(nome, opzioni)  gnam, gnamGrosso, bolla, perla, cuore, scudo, colpo, sconfitta, vittoria, frenesia, cresciuto,
                                   scatto, conchiglia, avviso, carica, morso, inchiostro, scossa, scoppio; per le schermate:
                                   tasto, acquisto, errore, traguardo, regalo, stella
   B.audio.musica(id)              id di un ambiente, 'menu' oppure null (silenzio): ogni ambiente ha la sua scala e il suo passo
   Rispetta le impostazioni "suoni" e "musica". */
(() => {
'use strict';
const B = window.B;
const { limita, intero, scegli } = B.util;

let ac = null, uscitaEffetti = null, uscitaMusica = null, fruscio = null, timer = null;
const acceso = chiave => !B.progressi || !B.progressi.impostazione || B.progressi.impostazione(chiave) !== false;
const pronto = () => !!ac && ac.state === 'running';

function avvia() {
  if (ac) { if (ac.state === 'suspended' && !document.hidden) ac.resume().catch(() => {}); return; }
  try {
    const Classe = window.AudioContext || window.webkitAudioContext;
    if (!Classe) return;
    ac = new Classe();
    uscitaEffetti = ac.createGain(); uscitaEffetti.gain.value = 1; uscitaEffetti.connect(ac.destination);
    uscitaMusica = ac.createGain(); uscitaMusica.gain.value = 1; uscitaMusica.connect(ac.destination);
    if (!timer) timer = setInterval(suonaMusica, 110);
  } catch (e) { ac = null; }
}

/* Una nota che scivola da f1 a f2. */
function tono(f1, f2, durata, tipo, volume, ritardo, uscita) {
  if (!pronto()) return;
  try {
    const osc = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (ritardo || 0);
    osc.type = tipo || 'sine'; osc.frequency.setValueAtTime(f1, t); osc.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + durata);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(volume || .07, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + durata);
    osc.connect(g); g.connect(uscita || uscitaEffetti); osc.start(t); osc.stop(t + durata + .03);
  } catch (e) {}
}
/* Uno sbuffo di rumore filtrato (scoppi, inchiostro, morsi). */
function sbuffo(durata, volume, f1, f2, ritardo) {
  if (!pronto()) return;
  try {
    if (!fruscio) {
      fruscio = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = fruscio.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime + (ritardo || 0);
    s.buffer = fruscio; s.loop = true;
    f.type = 'lowpass'; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + durata);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(volume, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + durata);
    s.connect(f); f.connect(g); g.connect(uscitaEffetti); s.start(t); s.stop(t + durata + .05);
  } catch (e) {}
}

let ultimoGnam = 0, notaGnam = 0;
const EFFETTI = {
  gnam() {
    const ora = performance.now();
    if (ora - ultimoGnam < 50) return;
    notaGnam = ora - ultimoGnam < 400 ? Math.min(notaGnam + 1, 14) : 0; ultimoGnam = ora;
    tono(520 * Math.pow(1.06, notaGnam), 880 * Math.pow(1.06, notaGnam), .06, 'sine', .04);
  },
  gnamGrosso() { tono(170, 540, .17, 'triangle', .13); tono(95, 55, .22, 'sine', .11); },
  bolla() { tono(660, 1320, .22, 'triangle', .09); },
  perla() { tono(880, 1760, .22, 'sine', .07); tono(1320, 2640, .2, 'sine', .04, .08); },
  cuore() { tono(523, 784, .18, 'triangle', .09); tono(784, 1046, .26, 'triangle', .09, .12); },
  scudo() { tono(700, 200, .25, 'square', .06); },
  colpo() { tono(320, 60, .4, 'sawtooth', .09); sbuffo(.2, .08, 900, 200); },
  sconfitta() { tono(392, 330, .26, 'triangle', .1); tono(330, 262, .26, 'triangle', .1, .22); tono(262, 110, .7, 'triangle', .1, .44); },
  vittoria() { tono(392, 784, .18, 'triangle', .1); tono(523, 1046, .22, 'triangle', .1, .16); tono(659, 1318, .4, 'triangle', .1, .34); tono(784, 1568, .6, 'sine', .07, .56); },
  frenesia() { tono(440, 1760, .4, 'triangle', .1); },
  cresciuto() { tono(523, 1046, .25, 'triangle', .09); tono(784, 1568, .22, 'triangle', .06, .14); },
  scatto() { tono(300, 900, .2, 'sawtooth', .04); },
  conchiglia() { tono(880, 1760, .25, 'sine', .07); tono(1175, 2350, .22, 'sine', .05, .1); },
  avviso() { tono(90, 180, .6, 'square', .05); },
  carica() { tono(140, 60, .5, 'sawtooth', .07); },
  morso() { tono(240, 70, .25, 'sawtooth', .1); sbuffo(.16, .1, 2400, 500); },
  inchiostro() { sbuffo(.55, .12, 500, 120); tono(180, 60, .5, 'sine', .07); },
  scossa() { for (let i = 0; i < 3; i++) tono(1300 - i * 150, 320, .07, 'square', .045, i * .07); },
  scoppio() { sbuffo(.65, .22, 1400, 90); tono(120, 35, .5, 'sine', .14); },
  // schermate
  tasto() { tono(520, 700, .06, 'sine', .035); },
  acquisto() { tono(660, 1320, .2, 'triangle', .09); },
  errore() { tono(200, 150, .15, 'square', .04); },
  traguardo() { tono(784, 1568, .16, 'triangle', .08); tono(1046, 2093, .3, 'triangle', .08, .13); },
  regalo() { tono(523, 1046, .14, 'triangle', .08); tono(659, 1318, .14, 'triangle', .08, .11); tono(784, 1568, .3, 'triangle', .08, .22); },
  stella() { tono(988, 1976, .2, 'sine', .07); },
};
const ultimi = Object.create(null);

function effetto(nome) {
  if (!pronto() || !acceso('suoni')) return;
  const fn = EFFETTI[nome];
  if (!fn) return;
  const ora = performance.now();
  if (nome !== 'gnam' && ora - (ultimi[nome] || 0) < 45) return;      // lo stesso suono non si accavalla
  ultimi[nome] = ora;
  fn();
}

// ---------------------------------------------------------------- musica
/* scala: le note della melodia; passo: secondi fra una nota e l'altra; ritmo: su 8 passi, quali suonano;
   bassi: le note lunghe d'accompagnamento (una ogni "giro" passi); onda e ottava della melodia. */
const MUSICHE = {
  menu:        { scala: [196, 246.9, 293.7, 329.6, 392, 493.9], passo: .42, ritmo: [1, 0, 1, 0, 1, 0, 0, 0], bassi: [98, 123.5, 147], giro: 8, onda: 'sine', ottava: 2, volume: .013 },
  laguna:      { scala: [196, 220, 261.6, 293.7, 329.6, 392, 440, 523.3], passo: .3, ritmo: [1, 0, 1, 0, 1, 0, 1, 0], bassi: [98, 110, 130.8], giro: 8, onda: 'sine', ottava: 2, volume: .016 },
  alghe:       { scala: [146.8, 174.6, 196, 220, 261.6, 293.7, 349.2, 392], passo: .34, ritmo: [1, 0, 0, 1, 0, 1, 0, 0], bassi: [73.4, 98, 87.3], giro: 8, onda: 'triangle', ottava: 2, volume: .014 },
  relitto:     { scala: [220, 246.9, 261.6, 293.7, 329.6, 349.2, 392, 440], passo: .36, ritmo: [1, 0, 0, 0, 1, 0, 1, 0], bassi: [110, 82.4, 98], giro: 8, onda: 'triangle', ottava: 1, volume: .02 },
  mare_aperto: { scala: [196, 220, 246.9, 293.7, 329.6, 392, 440, 493.9], passo: .26, ritmo: [1, 1, 0, 1, 0, 1, 1, 0], bassi: [98, 146.8, 123.5], giro: 8, onda: 'sine', ottava: 2, volume: .015 },
  ghiacci:     { scala: [261.6, 293.7, 329.6, 370, 415.3, 466.2, 523.3, 587.3], passo: .4, ritmo: [1, 0, 0, 1, 0, 0, 1, 0], bassi: [130.8, 164.8], giro: 12, onda: 'sine', ottava: 4, volume: .01 },
  rovine:      { scala: [164.8, 174.6, 207.7, 220, 246.9, 261.6, 293.7, 329.6], passo: .32, ritmo: [1, 0, 1, 1, 0, 0, 1, 0], bassi: [82.4, 110, 87.3], giro: 8, onda: 'triangle', ottava: 2, volume: .014 },
  vulcano:     { scala: [110, 130.8, 146.8, 155.6, 164.8, 196, 220, 261.6], passo: .24, ritmo: [1, 0, 1, 0, 0, 1, 0, 1], bassi: [55, 65.4, 73.4], giro: 8, onda: 'triangle', ottava: 2, volume: .017 },
  abisso:      { scala: [98, 116.5, 130.8, 146.8, 174.6, 196, 233.1, 261.6], passo: .5, ritmo: [1, 0, 0, 0, 1, 0, 0, 0], bassi: [49, 58.3], giro: 8, onda: 'sine', ottava: 2, volume: .02 },
};
const brano = { id: null, def: null, prossima: 0, passo: 0, nota: 3 };

function musica(id) {
  const def = id ? MUSICHE[id] || MUSICHE.laguna : null;
  if (brano.def === def) return;
  brano.id = id || null; brano.def = def; brano.passo = 0; brano.nota = 3; brano.prossima = 0;
}
function suonaMusica() {
  const d = brano.def;
  if (!d || !pronto() || !acceso('musica') || document.hidden) return;
  const stato = B.partita ? B.partita.stato : 'ferma';
  if (stato === 'pausa') return;
  const ora = ac.currentTime, veloce = stato === 'gioco' && B.partita.dati.frenesiaT > 0;
  if (brano.prossima < ora) brano.prossima = ora + .05;
  while (brano.prossima < ora + .25) {
    const rit = brano.prossima - ora, p = brano.passo;
    if (d.ritmo[p % d.ritmo.length] || veloce) {
      brano.nota = limita(brano.nota + intero(-2, 2), 0, d.scala.length - 1);
      const f = d.scala[brano.nota] * d.ottava;
      tono(f, f, d.passo * 1.7, d.onda, d.volume, rit, uscitaMusica);
    }
    if (p % d.giro === 0) tono(scegli(d.bassi), d.bassi[0] * .98, d.passo * 6, 'triangle', d.volume * 1.8, rit, uscitaMusica);
    brano.passo++; brano.prossima += veloce ? d.passo * .66 : d.passo;
  }
}

document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  try { const esito = document.hidden ? ac.suspend() : ac.resume(); if (esito && esito.catch) esito.catch(() => {}); } catch (e) {}
});

B.audio = { avvia, effetto, musica, get attivo() { return pronto(); }, get brano() { return brano.id; } };
})();

<script>
/* Boccone — interfaccia: B.schermate (il gestore delle schermate) e B.interfaccia (i pezzi comuni: bottoni, gettone
   delle perle, avvisi a comparsa, modelli animati, cruscotto di gioco, annunci, consigli della prima partita).
   Le schermate vere e proprie sono in 71-schermate.js; i collegamenti con gli eventi in 99-avvio.js. */
(() => {
'use strict';
const B = window.B, U = B.util;
const $ = id => document.getElementById(id);
const numero = n => (B.disegno ? B.disegno.compatto(n) : U.numero(n));
const suono = nome => { if (B.audio) { B.audio.avvia(); B.audio.effetto(nome); } };

// ---------------------------------------------------------------- pezzi
function el(tag, classe, testo) {
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (testo !== undefined && testo !== null) e.textContent = testo;
  return e;
}
/* Un bottone: testo, classe, che cosa fa, e (facoltativa) una riga piccola sotto. */
function bottone(testo, classe, azione, sotto) {
  const b = el('button', classe);
  b.type = 'button';
  b.append(el('span', 'scritta', testo));
  if (sotto !== undefined) b.append(el('small', '', sotto));
  b.addEventListener('click', () => { if (b.disabled) return; suono('tasto'); azione(b); });
  return b;
}
function scrivi(b, testo, sotto) {
  const s = b.querySelector('.scritta'), p = b.querySelector('small');
  if (s && testo !== undefined) s.textContent = testo;
  if (p && sotto !== undefined) p.textContent = sotto;
}
const stelline = n => '★'.repeat(n) + '<i>' + '★'.repeat(Math.max(0, 3 - n)) + '</i>';
const minuti = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

/* Il gettone con le perle possedute: si aggiorna da solo. */
const gettoni = [];
function gettonePerle() {
  const g = el('span', 'borsa'), n = el('span', '', numero(B.progressi.perle()));
  g.append(el('i', 'perla'), n);
  gettoni.push(n);
  return g;
}
function aggiornaGettoni() { const s = numero(B.progressi.perle()); for (const n of gettoni) if (n.textContent !== s) n.textContent = s; }

/* La testata di una schermata: freccia per tornare indietro, titolo e (se serve) le perle. */
function testata(titolo, opzioni) {
  const t = el('div', 'testata'), o = opzioni || {};
  const dietro = bottone('‹', 'tondo', () => (o.indietro ? o.indietro() : B.schermate.indietro()));

      const rec = P.recordSopravvivenza(), nuovo = d.tempo >= rec.tempo - 0.01 && d.tempo > 5;
      col.append(el('h2', 'titolo', nuovo ? 'Nuovo record!' : 'Fine della corsa!'), el('p', '', 'Hai resistito'), el('div', 'numero', I.minuti(d.tempo)),
        el('p', 'piccolo', 'Potenza raggiunta: ' + I.numero(d.potenza) + (nuovo ? '' : ' · Il tuo record: ' + I.minuti(rec.tempo))));
    } else col.append(el('h2', 'titolo', 'Ti hanno mangiato!'), el('p', '', 'Eri arrivato a'), el('div', 'numero', I.numero(d.potenza)));
    const p = el('p'); p.append(perle(d.perle));
    col.append(p, el('p', 'piccolo', CONSIGLI[Math.floor(Math.random() * CONSIGLI.length)]), bottone('Riprova', 'grande', () => I.gioca()));
    fila.append(bottone('Negozio', 'medio', () => S.mostra('negozio')), bottone('Inizio', 'medio', () => I.esci('casa')));
    col.append(fila);
  }
  S.registra('risultato', { crea(r) { col = colonna(r, 'centro'); }, mostra: disegna });
})();
})();

//# sourceURL=boccone/js/71-schermate.js
</script>
<script>
/* Boccone — avvio: il ciclo principale, i collegamenti fra i moduli (eventi → suoni, annunci, vibrazione, schermate),
   la pausa quando la pagina va in secondo piano e gli agganci per le prove (B.prova). */
(() => {
'use strict';
const B = window.B, I = B.interfaccia, P = B.progressi, L = B.livelli;
let errori = 0, fotogrammi = 0, timerFine = 0, cruscotto = false;
function segnala(dove, e) { errori++; if (errori <= 5) console.error('[Boccone] ' + dove, e); }

// ---------------------------------------------------------------- agganci di prova
/* B.prova.pilota(M) → { x, y } sostituisce i comandi (lo legge il mondo); B.prova.effetti si somma agli effetti dei
   potenziamenti; passo(dt) fa avanzare il mondo senza aspettare lo schermo; stato() riassume la situazione. */
const prova = B.prova = Object.assign({ pilota: null, effetti: null }, B.prova || {});
prova.passo = dt => B.partita.aggiorna(dt);
prova.stato = () => {
  const M = B.partita.mondo, h = M && M.eroe;
  return { stato: B.partita.stato, schermata: B.schermate.corrente(), livello: M ? M.livello : 0, modalita: M ? M.modalita : '', ambiente: M ? M.ambiente.id : '',
    potenza: h ? h.p : 0, cuori: M ? M.cuori : 0, perle: P.perle(), perlePartita: M ? M.perle : 0, tempo: M ? M.tempo : 0, fascia: M ? M.fascia : 0,
    qualita: B.vista.qualita, dpr: B.vista.dpr, figurine: B.figurine.stato(), fotogrammi, errori, musica: B.audio.brano };
};

// ---------------------------------------------------------------- collegamenti
function mostraCruscotto(si) { cruscotto = si; I.cruscotto.mostra(si); }

B.eventi.su('annuncio', d => I.annuncio(d.titolo, d.sotto, d.durata));
B.eventi.su('vibra', d => {
  if (P.impostazione('vibrazione') === false) return;
  try { if (navigator.vibrate) navigator.vibrate(d.ms); } catch (e) {}
});
B.eventi.su('partita:inizio', d => {
  clearTimeout(timerFine);
  I.ultima.livello = d.livello || 1; I.ultima.modalita = d.modalita;
  if (B.schermate.corrente()) B.schermate.chiudi();
  mostraCruscotto(true); I.avviaConsigli();
  B.audio.musica(d.ambiente);
});
B.eventi.su('partita:fine', d => {
  clearTimeout(timerFine);
  if (d.esito === 'abbandonato') { B.audio.musica('menu'); return; }
  // un attimo per vedere la festa (o la fine), poi il risultato
  timerFine = setTimeout(() => {
    if (B.partita.stato !== 'vinto' && B.partita.stato !== 'perso') return;
    mostraCruscotto(false); I.consiglio('');
    B.schermate.mostra('risultato', d);
    B.audio.musica('menu');
    if (d.esito === 'vinto') for (let i = 0; i < d.stelle; i++) setTimeout(() => B.audio.effetto('stella'), 150 + i * 250);
  }, d.esito === 'vinto' ? 1700 : 1300);
});
B.eventi.su('schermata', d => { if (d.id === 'casa') { mostraCruscotto(false); B.audio.musica('menu'); } });
B.eventi.su('traguardo', d => {
  I.avviso('Traguardo: ' + d.nome, { segno: '★', sotto: 'Premio di ' + d.premio + ' perle da ritirare', durata: 3.4 });
  B.audio.effetto('traguardo');
});
B.eventi.su('scoperta', d => {
  if (d.tipo !== 'pesce' && d.tipo !== 'gigante') return;
  I.avviso('Nuova specie: ' + d.nome, { classe: 'scoperta', segno: '+', sotto: 'La ritrovi nell\'acquario', durata: 2.4, leggero: true });
});
B.eventi.su('perle', () => I.aggiornaGettoni());
B.eventi.su('progressi', () => { if (B.partita.stato !== 'gioco') B.schermate.aggiorna(); });
B.eventi.su('impostazioni', d => { if (d && d.chiave === 'mano') I.cruscotto.mano(); });
B.eventi.su('comando', d => {
  if (!d || d.tipo !== 'pausa') return;
  if (B.partita.stato === 'gioco') I.pausa();
  else if (B.partita.stato === 'pausa' && B.schermate.corrente() === 'pausa') I.riprendi();
});

// La pagina va in secondo piano (telefonata, cambio di app): pausa.
document.addEventListener('visibilitychange', () => { if (document.hidden) I.pausa(); });
window.addEventListener('pagehide', () => I.pausa());
// I telefoni fanno suonare qualcosa solo dopo il primo tocco.
document.addEventListener('pointerdown', () => B.audio.avvia(), { passive: true });
document.addEventListener('keydown', () => B.audio.avvia());

// ---------------------------------------------------------------- ciclo
let prima = 0;
function ciclo(ora) {
  const dt = prima ? Math.min(0.05, Math.max(0, (ora - prima) / 1000)) : 1 / 60;
  prima = ora; fotogrammi++;
  try {
    if (B.partita.stato !== 'pausa') B.partita.aggiorna(dt);
    B.disegno.fotogramma();
    if (cruscotto) I.cruscotto.aggiorna();
    I.anima(dt);
  } catch (e) { segnala('errore nel ciclo', e); }
  requestAnimationFrame(ciclo);
}

// ---------------------------------------------------------------- si parte
try { B.partita.sfondoMenu(L.ambienteDi(P.livelloMax()).id); } catch (e) { segnala('lo sfondo del menu non si è creato', e); }
B.schermate.mostra('casa');
B.audio.musica('menu');
requestAnimationFrame(ciclo);
window.__pronto = true;
})();

//# sourceURL=boccone/js/99-avvio.js
</script>

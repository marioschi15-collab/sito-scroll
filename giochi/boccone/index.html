<script>
/* Boccone — specie: PESCE PAPPAGALLO (taglia 2, cacciatore). Robusto, fronte ripida, becco da pappagallo (il tratto
   esagerato), squame grandi turchesi orlate di rosa, coda a mezzaluna. Il becco si disegna PRIMA del corpo, che ne copre
   la radice come la testa di un uccello; le squame sono una funzione locale (P.squame non fa l'orlo colorato). */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, max } = Math;

// ---- tinte (una volta sola) e sagoma: corpo pieno, testa grossa dalla fronte ripida
const T = { corpo: P.tinta('#1cc4b6'), ventre: P.tinta('#c4f7d4', '#3fb8a8'), pinna: P.tinta('#ff6aa6', '#d21f7c'), pett: P.tinta('#ffd84a', '#ff7a1a'), becco: P.tinta('#fff3cf', '#e8925c') };
const ROSA = '#ff5fa2', ORLO = '#49dcff';
const SU = P.sagoma([[0, .14], [.12, .32], [.35, .6], [.6, .72], [.8, .7], [.93, .58], [1, .42]]);
const GIU = P.sagoma([[0, .14], [.12, .3], [.35, .54], [.6, .62], [.8, .6], [.93, .5], [1, .4]]);
const ONDA = { amp: .1, onde: .5, testa: .14 };
/* Squame grandi a tegola orlate di rosa: quattro file sfalsate di archi aperti verso il muso, in due colpi (orlo rosa e,
   subito dentro, un filo di luce). Costano poco: due tratti in tutto. */
const squame = (c, s) => {
  const q = {};
  for (let passata = 0; passata < 2; passata++) {
    const k = passata ? .7 : 1;
    c.beginPath();
    for (let r = 0; r < 4; r++) for (let i = 0; i < 6; i++) {
      const u = .15 + (i + (r % 2) * .5) * .105, R = .1 * (SU(u) + GIU(u)) * k;
      P.suSpina(s, u, -.66 + r * .36, q); const a = q.ang + PI;
      c.moveTo(q.x + cos(a - 1.15) * R, q.y + sin(a - 1.15) * R); c.arc(q.x, q.y, R, a - 1.15, a + 1.15);
    }
    c.lineCap = 'round'; c.strokeStyle = passata ? P.alfa(T.corpo.luce, .55) : ROSA; c.lineWidth = passata ? .018 : .034; c.stroke();
  }
};
/* Il becco: due piastre color avorio (le sagome sono nelle misure del muso: origine alla cerniera, x in avanti). Quella
   di sopra finisce a uncino e copre la punta di quella di sotto, che si abbassa quando la bocca si apre. */
const BECCO_SU = [0, -.28, .22, -.3, .44, -.2, .56, -.03, .575, .14, .5, .25, .43, .12, .28, .07, 0, .08];
const BECCO_GIU = [0, .08, .3, .09, .42, .12, .47, .07, .46, .2, .36, .29, .2, .31, 0, .28];
const piastra = (c, p, t, colore) => {
  P.profilo(c, p); c.lineJoin = 'round'; c.strokeStyle = t.bordo; c.lineWidth = P.BORDO * 1.8; c.stroke(); c.fillStyle = colore; c.fill();
};
const becco = (c, x, y, ang, apri, t, fine) => {
  c.save(); c.translate(x, y); c.rotate(ang);
  const g = c.createLinearGradient(0, -.3, .1, .36); g.addColorStop(0, t.luce); g.addColorStop(.45, t.base); g.addColorStop(1, t.ombra);
  if (apri > .03) {                                                 // la gola, fra le due piastre
    const a = apri * .8;
    c.beginPath(); c.moveTo(-.1, .08); c.lineTo(.46, .06); c.lineTo(.46 * cos(a), .08 + .46 * sin(a)); c.closePath(); c.fillStyle = '#7d1037'; c.fill();
  }
  c.save(); c.translate(0, .08); c.rotate(apri * .8); c.translate(0, -.08); piastra(c, BECCO_GIU, t, g); c.restore();
  c.rotate(-apri * .12); piastra(c, BECCO_SU, t, g);
  if (fine) {                                                       // le giunture dei denti saldati e un riflesso
    c.beginPath(); c.moveTo(.3, -.2); c.quadraticCurveTo(.36, -.04, .33, .08); c.moveTo(.44, -.12); c.quadraticCurveTo(.48, 0, .47, .13);
    c.lineCap = 'round'; c.strokeStyle = P.alfa(t.scura, .5); c.lineWidth = .022; c.stroke();
  }
  c.beginPath(); c.ellipse(.36, -.17, .1, .03, .45, 0, TAU); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill();
  c.restore();
};

B.specie.registra({
  id: 'pesce_pappagallo',
  descrizione: 'Con il becco durissimo rosicchia il corallo per mangiare le alghe che ci crescono sopra, e quello che avanza lo restituisce in sabbia finissima: molte spiagge bianche dei tropici sono in buona parte opera sua.',
  forma: { lx: 1.05, ly: .7 },
  ingombro: { x0: -1.83, y0: -1.08, x1: 1.52, y1: 1.02 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};
    c.save();
    const s = P.spinaPesce(14, -.95, .74, fase, ONDA, SU, GIU, { testa: .22 }), luce = [.3, -.5, 1.8], alza = m ? .25 : 0;

    // ---- 1. dietro al corpo: coda a mezzaluna, dorsale lunga, anale, ventrale, e il becco
    P.suSpina(s, 0, 0, q);
    P.coda(c, { x: q.x + .06, y: q.y, ang: q.ang + PI + sin(F - 1.1) * .34, tipo: 'luna', lung: .62, alt: .64, radice: .13, fase: F - 1.9, onda: .18, tinta: T.pinna, orlo: ORLO });
    const d0 = P.suSpina(s, .74, -.92), d1 = P.suSpina(s, .1, -.85), a0 = P.suSpina(s, .44, .9), a1 = P.suSpina(s, .1, .85);
    P.pinna(c, { x0: d0.x, y0: d0.y, x1: d1.x, y1: d1.y, a0: -(PI / 2 + .45 - alza), a1: -(PI - .5 - alza * .5), lung: m ? .44 : .36, profilo: [.7, .9, 1, 1, .95, .8], n: 10, smerlo: .3,
      onda: .07, fase: F * 2, passo: .5, tinta: T.pinna, orlo: ORLO });
    P.pinna(c, { x0: a0.x, y0: a0.y, x1: a1.x, y1: a1.y, a0: PI / 2 + .6, a1: PI - .45, lung: .32, profilo: [.75, 1, .95, .8], n: 6, smerlo: .3, onda: .07, fase: F * 2 - 1, passo: .5, tinta: T.pinna, orlo: ORLO });
    const pv = P.suSpina(s, .62, .95);
    P.pinna(c, { x0: pv.x + .06, y0: pv.y - .05, x1: pv.x - .1, y1: pv.y - .05, a0: PI * .58 + sin(F - .5) * .1, a1: PI * .8 + sin(F - .5) * .1, lung: .4, profilo: [1, .6], n: 3, piega: .12, tinta: T.pinna, righe: false });
    const n = P.suSpina(s, 1, 0), apri = m ? max(b, .45) : b * .45;
    becco(c, n.x + .1, n.y + .04, n.ang, apri, T.becco, P.fine(o));

    // ---- 2. il corpo: ventre chiaro, muso e guancia rosa, squame orlate di rosa
    P.volume(c, s, T.corpo, { luce, dentro(cc) {
      P.fianco(cc, s, u => .5 - .15 * sin(u * PI), 1.4, T.ventre.base);
      P.banda(cc, s, v => .95 - .04 * v, 1.4, ROSA, 4);
      P.fianco(cc, s, -.02, .12, ROSA, .68, 1, 5);
      if (P.fine(o)) squame(cc, s);
    } });
    const g1 = P.suSpina(s, .76, -.5), g2 = P.suSpina(s, .71, 0), g3 = P.suSpina(s, .76, .55);
    P.solco(c, [g1.x, g1.y, g2.x, g2.y, g3.x, g3.y], T.corpo, .04);                                // opercolo
    P.riflesso(c, .28, -.5, .42, -.15, .13);

    // ---- 3. sul fianco: la pettorale gialla che rema, con la sua ombra
    const pp = P.suSpina(s, .66, .25), rema = sin(F * 2 + .4), ap = PI * .92 + rema * .45;   // il pappagallo nuota «volando» con le pettorali
    P.ombra(c, pp.x - .14, pp.y + .05, .26, .17, -.3, .25);
    P.pinna(c, { x0: pp.x + .03, y0: pp.y - .1, x1: pp.x - .02, y1: pp.y + .1, a0: ap + .3 + rema * .15, a1: ap - .6 - rema * .1, lung: .5, profilo: [1, .95, .78, .55, .34], n: 5, onda: .1, fase: F * 2, passo: .7, tinta: T.pett, orlo: '#ff9d2a', primo: true });

    // ---- 4. la faccia. Calmo: occhio ambrato. A caccia: occhio rosso tagliato e sopracciglio (il becco aperto è già disegnato)
    const e = P.suSpina(s, .88, -.38);
    P.occhio(c, e.x, e.y, .22, Object.assign({ iride: m ? '#ff3a1e' : '#ffa51c', pelle: T.corpo, guarda: { x: .5, y: .1 } }, m ? P.SGUARDI.cattivo : P.SGUARDI.normale));
    if (m) P.sopracciglio(c, e.x + .05, e.y - .21, .46, .5, T.corpo.bordo, .12);
    c.restore();
  },
});
})();

<script>
/* Boccone — specie: PESCE SCATOLA (taglia 2, pigro, corazza). Un cubetto giallo a pois blu notte: la corazza è rigida, quindi
   il corpo non ondeggia ma dondola tutto intero, e a spingerlo sono le pinnette minuscole che frullano e la codina su un
   gambo. Faccia in discesa, boccuccia a bacio in basso, due cornetti sopra gli occhi. Il tratto esagerato è la forma a dado. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, max } = Math;

// ---- tinte (una volta sola) e sagoma: una scatola dagli spigoli tondi, col muso in discesa e la bocca in basso

const POIS = '#2e2a86', SOPRA = P.alfa('#fff6a8', .55), SOTTO = P.alfa('#ff8a1e', .5), ORLO = '#ffe98a';
const SU = P.sagoma([[0, .42], [.07, .62], [.2, .7], [.6, .72], [.78, .64], [.9, .34], [1, .03]]);
const GIU = P.sagoma([[0, .4], [.07, .6], [.2, .68], [.65, .68], [.84, .66], [.94, .56], [1, .4]]);
/* I dentini in vista fra le labbra aperte (P.labbra li lascia dietro le labbra): stessi x, y, ang, r, apri delle labbra. */
const dentini = (c, x, y, ang, r, apri) => {
  c.save(); c.translate(x, y); c.rotate(ang - apri * .5);
  P.denti(c, -.12 * r, .03 * r, .52 * r, -.1 * r, 3, r * (.12 + .22 * apri), -1, { tipo: 'piatto', spess: .012 });
  c.rotate(apri * 1.35);
  P.denti(c, -.12 * r, -.03 * r, .48 * r, .09 * r, 3, r * (.08 + .18 * apri), 1, { tipo: 'piatto', spess: .012 });
  c.restore();
};

B.specie.registra({
  id: 'pesce_scatola',
  descrizione: 'Sotto la pelle ha una vera scatola d\'osso, fatta di piastrine a sei lati saldate fra loro: non può piegarsi, e nuota remando con le pinnette come un piccolo elicottero.',
  forma: { lx: .9, ly: .72 },

    const s = P.spinaPesce(12, -.8, .8, 0, null, SU, GIU, { testa: .14, coda: .1 }), luce = [.3, -.5, 2], apre = m ? 1.25 : 1;

    // ---- 1. dietro al corpo: codina a ventaglio sul suo gambo, dorsale e anale minuscole che frullano, i due cornetti

    P.corno(c, gx, gy, PI + scod * .5, .42, .34, T.corpo, { punta: T.corpo.base, gonfio: 1 });     // il gambo della coda
    P.pinna(c, { x0: -.3, y0: -.64, x1: -.56, y1: -.6, a0: -PI / 2 - .25, a1: -PI + .45, lung: .3 * apre, profilo: [.8, 1, .95, .7], n: 5, smerlo: .4, onda: .22, fase: F * 3, passo: .9, tinta: T.pinna, orlo: ORLO });
    P.pinna(c, { x0: -.3, y0: .6, x1: -.56, y1: .56, a0: PI / 2 + .25, a1: PI - .45, lung: .28 * apre, profilo: [.8, 1, .95, .7], n: 5, smerlo: .4, onda: .22, fase: F * 3 + 1.6, passo: .9, tinta: T.pinna, orlo: ORLO });
    const e = P.suSpina(s, .76, -.36), punta = m ? '#fff2a0' : T.pinna.luce;
    P.corno(c, e.x + .2, e.y - .2, -PI / 2 + (m ? .95 : .8), m ? .46 : .36, .2, T.pinna, { curva: -.25, punta });   // cornetto lontano
    P.corno(c, e.x + .06, e.y - .22, -PI / 2 + (m ? .6 : .42), m ? .56 : .44, .23, T.pinna, { curva: -.25, punta });

    // ---- 2. la scatola: faccia di sopra chiara, faccia di sotto calda, pois blu notte, spigoli incisi
    P.volume(c, s, T.corpo, { luce, ombra: .1, dentro(cc) {

    } });

    P.solco(c, P.puntiSuSpina(s, 5, .07, .86, .66), T.corpo, .035);

    if (!m) P.guancia(c, e.x + .12, e.y + .36, .15);

    if (m) P.sopracciglio(c, e.x + .06, e.y - .25, .56, .5, T.corpo.bordo, .13);

<script>
/* Boccone — gigante: LA PIOVRA, la regina della foresta di alghe. Un polpo colossale rosso corallo: testa a sacco che
   respira, occhione dorato con la pupilla a sbarra sopra il suo bozzo, cornetti di pelle al posto delle sopracciglia, becco
   in mezzo alle braccia, corona. Le otto braccia sono vive e girano a girandola: quattro lontane (scure) e quattro vicine
   con la pancia chiara e la fila di ventose a perline; ognuna si arriccia per conto suo.
   Tutti gli stati letti con P.statoGigante. Il segnale da ricordare: macchie ad anello spente = tranquilla; macchie e
   ventose che si ACCENDONO DI GIALLO (con il sacco che si gonfia e le braccia che si avvolgono come molle) = sta per colpire.
   Quando parte spalanca le braccia a tenaglia e apre il becco. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, round } = Math;
const lerp = (a, b, k) => a + (b - a) * k;

// ---- tinte (una volta sola). La pelle ha sette gradini, dal corallo al rosso rovente: i polpi cambiano colore davvero.
function tavolozza(base, ombra, livello, spenta) {
  const pelle = P.tinta(base, ombra), fondo = P.mescola(base, '#5a1466', .46), acceso = livello > 1, k = acceso ? (livello - 2) / 4 : 0;
  return {
    pelle, lontano: P.tinta(fondo), sotto: P.mescola(base, '#fff0dc', .64), velo: P.alfa(P.mescola(base, '#fff0dc', .7), .72), nei: P.alfa(pelle.bordo, .38),
    ventosa: spenta ? '#ebe2ee' : acceso ? P.mescola('#ffe14a', '#fffbd0', k) : '#fff0e2',
    ventosaLontana: P.mescola(spenta ? '#ebe2ee' : acceso ? '#ffd23c' : '#fff0e2', fondo, acceso ? .25 : .42),
    cuoreVentosa: spenta ? '#b9a3c4' : acceso ? '#ff8a1e' : '#f58a8e',
    anello: spenta ? P.alfa('#7d6a9c', .45) : acceso ? P.mescola('#ffb21e', '#ffee3c', k) : livello ? '#c42a52' : P.alfa('#a8204e', .5),
    cuore: spenta ? '#d9cfe0' : acceso ? P.mescola('#ffe9a0', '#ffffff', k) : livello ? '#ffc0a0' : '#ffb59c',
  };
}
const VIVE = [];
for (let i = 0; i <= 6; i++) VIVE.push(tavolozza(P.mescola('#ff6b4a', '#ff2444', i / 6), P.mescola('#9a1a5e', '#6e0a52', i / 6), i, false));
const STORDITA = tavolozza('#f58a78', '#8a3a80', 0, false), SPENTA = tavolozza('#c9aabb', '#6f5f92', 0, true);
const BECCO = P.tinta('#ffc21f', '#f0641e'), LABBRO = P.tinta('#ffb7a8', '#d8486a'), SIFONE = P.tinta('#ffc9b4', '#d8486a');
const ROSSO = '#ff3348', GIALLO = '#ffd21e';
const CALMO = { palpebra: .3, sotto: .1 };                             // l'occhio socchiuso della regina che non ha fretta

/* Il sacco: un pallone inclinato all'indietro, più stretto al collo dove sparisce sotto la testa. Va dalla punta (in alto
   a sinistra) al collo. */
const SU = P.sagoma([[0, .42], [.08, .47], [.25, .61], [.45, .68], [.7, .61], [.88, .48], [1, .38]]);
const GIU = P.sagoma([[0, .4], [.08, .44], [.25, .52], [.45, .56], [.7, .51], [.88, .43], [1, .36]]);
const NS = 12, X0 = -.92, Y0 = -.86, X1 = .06, Y1 = -.1;                // tratti del sacco, punta e collo
const HX = .17, HY = -.03, CX = .35, CY = .2;                           // centro della testa, centro della corona di braccia
const ASSE = .1, MX = CX + cos(ASSE) * .47, MY = CY + sin(ASSE) * .47;  // direzione e posto del becco (attorno a x = .8)
/* Le braccia: [angolo da calma, angolo a tenaglia aperta, ricciolo da calma, ricciolo aperto, lunghezza, lato delle ventose].
   Si alternano una lontana e una vicina, dall'alto in avanti fino a dietro sotto il sacco. Da calma girano tutte dalla
   stessa parte, a girandola, così non si incrociano; aperte, le tre di sopra si alzano e piegano la punta in giù come
   artigli, le cinque di sotto si distendono: in mezzo resta il becco. */
const LONTANE = [[-.6, -1.25, -2.3, 1, 1.2, 1], [.3, -.7, -2, .8, 1.6, 1], [1.2, 1.45, -2.3, -1.1, 1.5, -1], [2.1, 2.2, -2.2, -1.4, 1.4, -1]];
const VICINE = [[-.15, -1, -3.5, 1.3, 1.5, 1], [.75, 1.1, -2.6, -1, 1.65, -1], [1.65, 1.8, -3.3, -1.3, 1.6, -1], [2.55, 2.6, -3, -1.6, 1.55, -1]];

/* Gli occhielli del sacco: anelli col cuore chiaro, in posti scelti a mano [u, v, raggio, di quanto oltre la punta, nella
   calotta]. Due passate di tinta piatta. */
const OCCHIELLI = [[0, -.5, .1, .2], [0, .08, .085, .27], [0, -.05, .06, .02], [.16, -.66, .075, 0], [.2, .2, .08, 0], [.3, -.3, .12, 0], [.47, .26, .075, 0], [.5, -.68, .1, 0], [.62, -.26, .095, 0],
  [.76, -.66, .075, 0], [.8, -.02, .07, 0]];
function occhielli(cc, s, K, q) {
  for (let giro = 0; giro < 2; giro++) {
    cc.beginPath();
    for (const m of OCCHIELLI) { const r = m[2] * (giro ? .5 : 1); P.suSpina(s, m[0], m[1], q); const x = q.x - cos(q.ang) * m[3], y = q.y - sin(q.ang) * m[3]; cc.moveTo(x + r, y); cc.arc(x, y, r, 0, TAU); }
    cc.fillStyle = giro ? K.cuore : K.anello; cc.fill();
  }
}
/* Un braccio: nastro lucido che si assottiglia e si arriccia; le vicine hanno la pancia chiara dal lato delle ventose e
   qualche neo sul dorso. Le ventose delle vicine sono perline lungo l'orlo (metà dentro e metà fuori), col loro cuore
   rosa: tutte tinte piatte, in tre passate. st = lo stato già calcolato. */
function braccio(c, a, i, K, st, vicino, q) {
  let ang, curva, lung = a[4];
  if (st.giu) { ang = lerp(a[0], 1.2 + (a[0] - .9) * .3, .65) + sin(st.t * 1.1 + i) * .05; curva = a[2] * (st.sconfitto ? 1.25 : .45); lung *= .9; }
  else {
    ang = lerp(a[0], a[1], st.ap) + sin(st.t * .8 + i * 1.3) * .05;
    curva = lerp(a[2], a[3], st.ap) * (1 + st.stringe * .7) + sin(st.t * .6 + i * 2.1) * .2;
    lung *= 1 - st.stringe * .16 + st.scatto * .08;
  }
  const tinta = vicino ? K.pelle : K.lontano, la = a[5], nv = vicino ? 9 : 6;
  const s = P.tentacolo(c, { x: CX - (vicino ? 0 : .05), y: CY - (vicino ? 0 : .04), ang, lung, spess: vicino ? .46 : .4, punta: .06, curva, onda: st.giu ? .1 : .18,
    fase: st.F + i * 1.9, tinta, ombra: 0, lume: vicino ? .055 : 0, n: vicino ? 12 : 10 });
  if (vicino) {
    P.fianco(c, s, la * .26, la * .96, K.sotto, .02, .95, 10);
    if (st.fine) P.macchie(c, s, { n: 5, seme: i + 2, u0: .1, u1: .72, v0: -la * .62, v1: -la * .12, r0: .016, r1: .03, colore: K.nei, lungo: 1.3 });
  }
  for (let passata = vicino ? 0 : 1; passata < (vicino ? 3 : 2); passata++) {       // le lontane: una passata sola, tutta dentro il braccio
    const piu = passata ? 0 : .034, k = passata === 2 ? .42 : vicino ? 1 : .8, v = la * (vicino ? .97 : .66);
    c.beginPath();
    for (let j = 0; j < nv; j++) {
      const u = .1 + .8 * j / (nv - 1), r = (.078 - .046 * u) * k + piu;
      P.suSpina(s, u, v, q); c.moveTo(q.x + r, q.y); c.arc(q.x, q.y, r, 0, TAU);
    }
    c.fillStyle = passata === 2 ? K.cuoreVentosa : passata ? (vicino ? K.ventosa : K.ventosaLontana) : tinta.bordo; c.fill();
  }
}

B.specie.registra({
  id: 'piovra',
  descrizione: 'Il polpo ha tre cuori, il sangue blu e nove cervelli: uno nella testa e uno per ogni braccio. La Piovra cambia colore quando si arrabbia: se le macchie le si accendono di giallo, nuota via!',
  forma: { lx: 1.25, ly: 1.0 },
  ingombro: { x0: -1.72, y0: -1.72, x1: 2.06, y1: 1.95 },
  disegna(c, o) {
    const G = P.statoGigante(o), t = o.t || 0, F = (o.fase || 0) * TAU, q = {};
    const viva = !G.giu, rosso = G.carica ? 6 : G.avviso ? 2 + round(G.lampo * 4) : G.caccia ? 1 : 0;   // quanto è accesa (0..6): nell'avviso parte già da 2
    const K = G.sconfitto ? SPENTA : G.stordito ? STORDITA : VIVE[rosso];
    const st = { t, F, fine: P.fine(o), giu: G.giu, sconfitto: G.sconfitto, stringe: G.avviso ? G.k : 0, scatto: G.carica ? 1 : 0,
      ap: G.carica ? 1 : G.avviso ? .3 - .14 * G.k : G.apri };                                          // quanto si apre la tenaglia delle braccia
    const becco = G.giu ? .12 : G.apri;
    c.save();
    c.translate(G.rincula + G.trema, sin(t * 1.3) * .025 + (G.sconfitto ? .14 : 0));
    c.rotate(G.sconfitto ? .3 : G.stordito ? sin(t * 2.2) * .07 : -st.ap * .05);
    if (rosso > 1) P.bagliore(c, -.2, -.3, 1.7, G.carica ? ROSSO : GIALLO, G.carica ? .3 : .16 + G.lampo * .34);        // l'alone dell'avviso

    // ---- 1. le quattro braccia lontane, scure, dietro a tutto
    for (let i = 0; i < 4; i++) braccio(c, LONTANE[i], i * 2, K, st, false, q);

    // ---- 2. il sacco: respira, si gonfia prima di colpire, si allunga nello scatto, si affloscia quando è giù
    const cade = G.sconfitto ? .7 : G.stordito ? .3 + sin(t * 2.2) * .04 : G.carica ? .3 : 0, lungo = G.carica ? 1.12 : G.sconfitto ? .94 : 1;
    const dondola = viva ? sin(F - 1) * .05 + sin(t * .9) * .03 : 0;
    const gonfia = G.sconfitto ? -.22 : G.carica ? -.12 : G.avviso ? .05 + G.k * .12 + G.lampo * .03 : (viva ? .035 : .015) * sin(t * 1.7);
    const s = P.spina(NS, (u, p) => { const d = 1 - u; p.x = X1 + (X0 - X1) * d * lungo - cade * d * d * .5; p.y = Y1 + (Y0 - Y1) * d + (cade + dondola) * d * d; }, SU, GIU, { coda: .42, testa: .1 });
    for (let i = 0; i <= NS; i++) { const g = 1 + gonfia * sin(PI * i / NS); s.su[i] *= g; s.giu[i] *= g; }
    P.volume(c, s, K.pelle, { luce: [-.1, -1.2, 2], ombra: .13, dentro(cc) {
      P.fianco(cc, s, u => .46 + .08 * sin(u * 11), 1.4, K.velo);
      occhielli(cc, s, K, q);
      P.macchie(cc, s, { n: 12, seme: 8, u0: .05, u1: .9, v0: -.9, v1: .42, r0: .014, r1: .028, colore: K.nei, lungo: 1 });
    } });
    if (st.fine) P.bozzi(c, P.puntiSuSpina(s, 5, .14, .56, u => -.76 - .1 * sin(u * 29)), i => .03 + (i % 3) * .012, K.pelle);
    P.suSpina(s, .56, -.62, q); P.riflesso(c, q.x, q.y, .44, q.ang - .1, .13);

    // ---- 3. sotto la testa: l'ombra del collo, il sifone, la membrana fra le braccia, la bocca col becco
    P.ombra(c, HX - .3, HY - .12, .36, .5, .5, .34);
    c.beginPath(); c.ellipse(HX - .36, HY + .34, .16, .095, .75, 0, TAU); c.strokeStyle = SIFONE.bordo; c.lineWidth = .09; c.stroke(); c.fillStyle = viva ? SIFONE.base : K.sotto; c.fill();
    c.beginPath(); c.ellipse(HX - .44, HY + .41, .05, .07, .75, 0, TAU); c.fillStyle = SIFONE.bordo; c.fill();
    c.beginPath(); c.ellipse(CX + .1, CY + .1, .42, .38, .4, 0, TAU); c.strokeStyle = K.lontano.bordo; c.lineWidth = .1; c.stroke(); c.fillStyle = K.lontano.ombra; c.fill();
    c.beginPath(); c.ellipse(MX, MY, .2 + becco * .04, .23 + becco * .05, ASSE, 0, TAU); c.strokeStyle = LABBRO.bordo; c.lineWidth = .08; c.stroke(); c.fillStyle = viva ? LABBRO.base : K.sotto; c.fill();
    c.beginPath(); c.ellipse(MX + .02, MY + .01, .11 + becco * .06, .13 + becco * .09, ASSE, 0, TAU); c.fillStyle = '#5a0c34'; c.fill();
    P.corno(c, MX - .06, MY + .06, ASSE + .28 + becco * .55, .22, .18, BECCO, { curva: -.7 });
    P.corno(c, MX - .07, MY - .06, ASSE - .1 - becco * .4, .33, .23, BECCO, { curva: .75 });

    // ---- 4. le quattro braccia vicine
    for (let i = 0; i < 4; i++) braccio(c, VICINE[i], i * 2 + 1, K, st, true, q);

    // ---- 5. la testa: cornetti di pelle e bozzo dell'occhio (dietro), poi la palla della testa
    const ex = HX + .09, ey = HY - .17, irto = viva ? G.ira : -.5;
    P.corno(c, ex - .2, ey - .24, -PI / 2 - .55 + irto * .2, .17 + irto * .13, .14, K.pelle, { curva: -.3 });
    P.corno(c, ex + .01, ey - .3, -PI / 2 - .12 + irto * .32, .19 + irto * .16, .15, K.pelle, { curva: -.25 });
    c.beginPath(); c.ellipse(ex - .04, ey - .08, .32, .3, 0, 0, TAU); c.strokeStyle = K.pelle.bordo; c.lineWidth = .1; c.stroke(); c.fillStyle = K.pelle.chiara; c.fill();   // il bozzo dell'occhio: se ne vede solo l'orlo
    P.palla(c, HX, HY, .5, .46, -.15, K.pelle, { luce: [HX + .12, HY - .3, 1], ombra: .09 });
    if (viva) P.guancia(c, HX + .22, HY + .22, .2, '#ff4f8a', .3 + rosso * .05);
    if (st.fine) {
      P.solco(c, [HX - .3, HY - .14, HX - .37, HY + .05, HX - .32, HY + .25], K.pelle, .035);                           // la piega del collo
      P.bozzi(c, [HX - .17, HY + .22, HX - .05, HY + .32, HX + .33, HY + .04], .026, K.pelle);
    }

    // ---- 6. la faccia: occhione (dorato e socchiuso, oppure rosso e tagliato), sopracciglio, corona, stelline
    if (G.ira > .6) P.bagliore(c, ex, ey, .38, ROSSO, G.ira * .4);
    P.occhio(c, ex, ey, .25, Object.assign({ iride: G.ira ? '#ff3a1e' : '#ffd23c', pelle: K.pelle, tipo: 'barra', guarda: P.sguardo(o.sguardo, ex, ey) }, G.calmo ? CALMO : G.occhi));
    if (G.ira) P.sopracciglio(c, ex + .04, ey - .22, .54, .4 + G.ira * .2, K.pelle.bordo, .13);
    else if (G.giu) P.sopracciglio(c, ex, ey - .3, .42, -.35, K.pelle.bordo, .07);
    P.suSpina(s, .62, -1, q);
    P.corona(c, q.x - (G.sconfitto ? .2 : 0), q.y + .05, .23, q.ang - .45 - (G.sconfitto ? .7 : G.stordito ? .4 : 0));
    if (G.stordito) P.stelle(c, .1, -1.35, .5, t, 3, .11);
    c.restore();
  },
});
})();

</script>
<script>
/* Boccone — specie: RAZZA (taglia 4, pigra). Vista di tre quarti dall'alto: un aquilone color sabbia che batte le ali.
   Il disco a rombo è UN pezzo solo (sagoma mia, non P.lama): muso a punta, ala vicina grande e in luce, ala lontana più
   corta e velata di scuro, orli d'uscita che fanno l'onda. Sopra c'è il dorso rialzato, con i due occhi in cima e la fila
   di spine. IL SUO SEGNO: gli occhielli azzurri cerchiati di blu, uno grande per ala, che sembrano occhi finti.
   Coda a frusta con le due pinnette in fondo. Quando l'ala vicina sale la punta si torce e mostra il sotto color crema.
   A caccia alza il muso e le ali, drizza la coda, e sul bordo del muso si apre la bocca con i denti. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, max, min } = Math;
const lerp = (a, b, k) => a + (b - a) * k;

// ---- tinte: sabbia dorata con le ombre arancio-mattone (mai grigie), sotto color crema, occhielli azzurri
const T = { ala: P.tinta('#e9ad4e', '#a8402e'), lontana: P.tinta('#c8863e', '#6e2a4a'), sotto: P.tinta('#fff3dc', '#e8946a'), coda: P.tinta('#cf8e44', '#7a3044') };
T.dorso = Object.assign({}, P.tinta('#f0bc62', '#b4482c'), { bordo: P.mescola(T.ala.base, T.ala.bordo, .62) });     // il dorso è un rilievo, non un pezzo a parte: bordo più tenue
const BLU = '#28308f', AZZURRO = '#35b8ff', CELESTE = '#d2f6ff', NEI = P.alfa('#8a3a28', .34), CHIARO = P.alfa('#fff0c4', .42), VELO = P.alfa('#7a2c48', .34), PIEGA = P.alfa(T.ala.scura, .32);
/* Il dorso: un fuso corto, più largo alla testa (dove stanno gli occhi), che sfuma nella coda. */
const SU = P.sagoma([[0, .06], [.25, .14], [.55, .2], [.78, .25], [.92, .21], [1, .12]]);
const GIU = P.sagoma([[0, .06], [.25, .13], [.55, .18], [.78, .22], [.92, .19], [1, .11]]);
/* Occhielli e nei di un'ala: [lungo la linea di mezzo 0 (muso) .. 1 (coda), verso la punta 0..1, raggio]. Il primo è quello grande. */
const OCCHIELLI = [[.52, .5, .13], [.3, .26, .05], [.78, .36, .05], [.44, .8, .042]];
const PUNTINI = [[.2, .5, .03], [.34, .64, .024], [.62, .7, .028], [.7, .52, .022], [.86, .22, .024], [.4, .34, .022], [.62, .3, .026], [.5, .92, .02], [.16, .22, .02]];
const MX = 1.05, RX = -.72, RY = -.02, PINNETTE = [.45, .7];              // punta del muso, attacco della coda, dove stanno le due pinnette della coda

/* Un tratto dell'orlo del disco: dal punto in cui si è (fx, fy) alla punta dell'ala (px, py), che arrotonda, e poi fino
   a (tx, ty). a1, a2 = di quanto si gonfia in fuori il primo lato (vicino alla partenza, vicino alla punta); b1, b2 = lo
   stesso per il secondo lato. Valori negativi lo incavano. */
function orlo(cc, fx, fy, px, py, tx, ty, a1, a2, b1, b2) {
  let ax = -(py - fy), ay = px - fx; if (ax * (tx - fx) + ay * (ty - fy) > 0) { ax = -ax; ay = -ay; }
  let bx = -(ty - py), by = tx - px; if (bx * (fx - px) + by * (fy - py) > 0) { bx = -bx; by = -by; }
  cc.bezierCurveTo(lerp(fx, px, .33) + ax * a1, lerp(fy, py, .33) + ay * a1, lerp(fx, px, .7) + ax * a2, lerp(fy, py, .7) + ay * a2, lerp(px, fx, .12), lerp(py, fy, .12));
  cc.quadraticCurveTo(px, py, lerp(px, tx, .12), lerp(py, ty, .12));
  cc.bezierCurveTo(lerp(px, tx, .36) + bx * b1, lerp(py, ty, .36) + by * b1, lerp(px, tx, .72) + bx * b2, lerp(py, ty, .72) + by * b2, tx, ty);
}
/* Occhielli, nei e pieghe di un'ala che ha il muso in (sx, sy) e la punta in (px, py). Tinte piatte, poche passate. */
function motivi(cc, sx, sy, px, py, q) {
  const su = (a, b) => { q.x = lerp(lerp(sx, RX, a), px, b); q.y = lerp(lerp(sy, RY, a), py, b); };
  cc.beginPath(); for (const m of PUNTINI) { su(m[0], m[1]); cc.moveTo(q.x + m[2], q.y); cc.arc(q.x, q.y, m[2], 0, TAU); } cc.fillStyle = NEI; cc.fill();
  for (let giro = 0; giro < 3; giro++) {
    const k = [1.34, 1, .44][giro];
    cc.beginPath(); for (const m of OCCHIELLI) { su(m[0], m[1]); cc.moveTo(q.x + m[2] * k, q.y); cc.ellipse(q.x, q.y, m[2] * k, m[2] * k * .82, 0, 0, TAU); }
    cc.fillStyle = [BLU, AZZURRO, CELESTE][giro]; cc.fill();
  }
  cc.beginPath(); su(.3, .12); cc.moveTo(q.x, q.y); su(.62, .78); cc.lineTo(q.x, q.y); su(.62, .1); cc.moveTo(q.x, q.y); su(.86, .6); cc.lineTo(q.x, q.y);
  cc.strokeStyle = PIEGA; cc.lineWidth = .03; cc.lineCap = 'round'; cc.stroke();                                         // due pieghe leggere verso l'orlo
}

B.specie.registra({
  id: 'razza',
  descrizione: 'Parente piatta degli squali: non ha nemmeno un osso, solo cartilagine come il tuo naso. Sta nascosta sotto la sabbia con fuori soltanto gli occhi, e i due occhielli azzurri sul dorso servono a sembrare la faccia di un pesce molto più grosso.',
  forma: { lx: 1.0, ly: .85 },
  ingombro: { x0: -2.17, y0: -1.12, x1: 1.17, y1: 1.23 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};
    c.save();
    c.rotate(sin(F) * .025);
    const tv = sin(F) + (m ? .5 : 0), tl = sin(F - .8) + (m ? .5 : 0);              // quanto sono alzate le ali (vicina, lontana): la lontana è in ritardo
    const my = m ? -.07 : 0, vx = -.1 + tv * .05, vy = .98 - tv * .2, lx = -.03 - tl * .05, ly = -.76 - tl * .2;       // muso, punta vicina, punta lontana
    const rv = sin(F * 2 - .4) * .05, rl = sin(F * 2 - 1.2) * .05;                  // l'onda degli orli d'uscita

    // ---- 1. dietro al disco: coda a frusta con le pinnette, pinne del bacino
    const w = k => (m ? -.1 * k - .05 * k * k : 0) + (.03 + .05 * k) * sin(F - 1.2 - k * 1.1);     // la frusta ondeggia in ritardo; a caccia si alza
    const cq = [RX + .1, RY, -1.15, RY + w(1), -1.6, RY + w(2), -2.02, RY + w(3)];
    for (const k of PINNETTE) P.corno(c, lerp(cq[4], cq[6], k), lerp(cq[5], cq[7], k) - .01, -PI / 2 - .7, .13, .11, T.coda, { curva: -.4, lume: false });
    P.filo(c, cq, .13, .028, T.coda, .04);
    P.lama(c, { x0: RX + .22, y0: RY - .12, x1: RX, y1: RY - .03, px: RX - .2, py: RY - .26, tinta: T.lontana, davanti: .2, dietro: -.1, tondo: .3 });
    P.lama(c, { x0: RX + .24, y0: RY + .14, x1: RX, y1: RY + .03, px: RX - .26, py: RY + .32 + sin(F * 2) * .02, tinta: T.ala, davanti: .2, dietro: -.1, tondo: .3 });

    // ---- 2. il disco: un pezzo solo, con la metà lontana velata, il muso chiaro, occhielli, nei e pieghe
    P.volume(c, cc => { cc.beginPath(); cc.moveTo(MX, my); orlo(cc, MX, my, vx, vy, RX, RY, -.03, .11, .2 + rv, .15 - rv); orlo(cc, RX, RY, lx, ly, MX, my, .15 - rl, .2 + rl, .11, -.03); cc.closePath(); },
      T.ala, { luce: [.4, .25, 1.6], ombra: .07, dentro(cc) {
        cc.beginPath(); cc.moveTo(MX + .1, my); cc.lineTo(RX - .1, RY); cc.lineTo(RX - .1, -2); cc.lineTo(MX + .1, -2); cc.closePath(); cc.fillStyle = VELO; cc.fill();
        cc.beginPath(); cc.moveTo(MX + .1, my); cc.lineTo(lerp(MX, lx, .34), lerp(my, ly, .34)); cc.lineTo(.6, my * .5); cc.lineTo(lerp(MX, vx, .34), lerp(my, vy, .34)); cc.closePath(); cc.fillStyle = CHIARO; cc.fill();
        motivi(cc, MX, my, lx, ly, q); motivi(cc, MX, my, vx, vy, q);
        if (tv > .1) {                                                 // l'ala vicina sale: la punta si torce e mostra il sotto color crema
          const k = .12 + .16 * min(1, tv - .1), ax = lerp(vx, MX, k), ay = lerp(vy, my, k), bx = lerp(vx, RX, k * .85), by = lerp(vy, RY, k * .85), ox = vx - (MX + RX) / 2, oy = vy - (my + RY) / 2;
          cc.beginPath(); cc.moveTo(ax, ay); cc.quadraticCurveTo((ax + bx) / 2 - ox * .05, (ay + by) / 2 - oy * .05, bx, by); cc.lineTo(bx + ox, by + oy); cc.lineTo(ax + ox, ay + oy); cc.closePath();
          cc.fillStyle = T.sotto.base; cc.fill(); cc.strokeStyle = P.alfa(T.ala.bordo, .85); cc.lineWidth = .045; cc.stroke();
        }
      } });

    // ---- 3. il dorso rialzato: la sua ombra sull'ala, il fuso, le spine in fila, il riflesso
    const s = P.spinaPesce(10, -.64, .6, 0, null, SU, GIU, { testa: .13, coda: .05, arco: m ? .05 : 0, y: -.03 });
    P.ombra(c, .0, .17, .72, .17, .03, .3);
    P.volume(c, s, T.dorso, { luce: [.3, -.3, 1.3], ombra: .06, bordo: .035, dentro(cc) {
      P.macchie(cc, s, { n: 8, seme: 5, u0: .1, u1: .8, v0: -.75, v1: .75, r0: .02, r1: .038, colore: NEI, lungo: 1.2 });
    } });
    if (P.fine(o)) P.bozzi(c, P.puntiSuSpina(s, 6, .08, .62, -.1), i => .022 + (i % 2) * .008, T.dorso);

<script>
/* Boccone — pericolo: RICCIO DI MARE. Una palla viola-notte di aculei lunghi dalla punta chiara: una corona di aculei
   lunghi dietro, la palla lucida del corpo, una corona di aculei corti davanti, e in mezzo due occhi che spiano.
   Dipende solo da o.fase (gli aculei che dondolano) e da o.attivo (quanto sei vicino): a riposo sonnecchia; a metà
   spalanca gli occhi; da vicino rizza gli aculei (più lunghi, fermi, con le punte che si accendono di rosso) e fa la
   faccia cattiva. Gli aculei si disegnano tutti insieme, in un tracciato solo. 1 unità = il raggio che fa male. */
(() => {
'use strict';
const B = window.B, P = B.pittura, R = B.util.rumore, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, max, min, round } = Math;

// ---- tinte: il «nero» è un viola-blu medio, il buio lo fanno bordi e ombre; punte lilla che da vicino diventano rosse
const T = { corpo: P.tinta('#7648d8', '#1e0c5c'), dietro: P.tinta('#4a34a6', '#160a4a'), davanti: P.tinta('#6248c8', '#1a0c52') };
const PUNTE = ['#ecdfff', '#ffc48a', '#ff5a36'], LUCE = ['#d9c2ff', '#ffb070', '#ff5a36'], PERLE = '#5ad8ff';
const DIETRO = [], DAVANTI = [];                                      // gli aculei: direzione, lunghezza, sfasamento del dondolio
for (let i = 0; i < 26; i++) DIETRO.push({ a: (i + .5 * R(i, 3)) / 26 * TAU, l: .86 + .14 * R(i, 5), f: i * 2.1 });
for (let i = 0; i < 12; i++) DAVANTI.push({ a: (i + .25 + .4 * R(i, 7)) / 12 * TAU, l: .8 + .2 * R(i, 9), f: i * 1.3 + 1 });
const SONNO = { iride: '#ffd23c', pelle: T.corpo, guarda: { x: 0, y: .3 }, palpebra: .6 }, SVEGLIO = { iride: '#ffd23c', pelle: T.corpo, guarda: { x: 0, y: -.1 }, pupilla: .7, grande: 1.08 };
const CATTIVO_SX = { iride: '#ff3a1e', pelle: T.corpo, tipo: 'fessura', guarda: { x: .35, y: .1 }, palpebra: .34, taglio: .46, pupilla: .72, sotto: .1 };
const CATTIVO_DX = Object.assign({}, CATTIVO_SX, { guarda: { x: -.35, y: .1 }, taglio: -.46 });
const BRONCIO = { curva: -.7, tinta: T.corpo, spess: .05 }, STUPORE = { apri: .8, alt: .09, curva: 0, tinta: T.corpo, lingua: false, spess: .045 };
const TIARA = [-.2, -.24, 0, -.31, .2, -.24], CIME = [];

/* Una corona di aculei in due tracciati soli: i triangoli sottili da r0 in fuori (bordo e sfumatura che schiarisce verso
   la punta), poi le punte chiare sopra il bordo. lungo = lunghezza, molle = quanto dondolano. Se cime è una lista, ci
   scrive dove finiscono le punte. */
const AX = [], AY = [], AL = [];
function aculei(c, lista, r0, lungo, hw, t, punta, F, molle, cime) {
  let m = 0; const n = lista.length;
  c.beginPath();
  for (let i = 0; i < n; i++) {
    const s = lista[i], a = s.a + molle * sin(F + s.f), L = r0 + lungo * s.l * (1 + .5 * molle * sin(F + s.f * 1.7)), ca = cos(a), sa = sin(a);
    AX[i] = ca; AY[i] = sa; AL[i] = L; if (L > m) m = L;
    c.moveTo(ca * r0 - sa * hw, sa * r0 + ca * hw); c.lineTo(ca * L, sa * L); c.lineTo(ca * r0 + sa * hw, sa * r0 - ca * hw); c.closePath();
    if (cime) cime.push(ca * (L - .02), sa * (L - .02));
  }
  const g = c.createRadialGradient(0, 0, r0, 0, 0, m);
  g.addColorStop(0, t.scura); g.addColorStop(.35, t.base); g.addColorStop(1, t.chiara);
  c.lineJoin = 'round'; c.strokeStyle = t.bordo; c.lineWidth = .075; c.stroke(); c.fillStyle = g; c.fill();
  c.beginPath();
  for (let i = 0; i < n; i++) {
    const ca = AX[i], sa = AY[i], L = AL[i], b = L - (L - r0) * .3, w = hw * .5;
    c.moveTo(ca * b - sa * w, sa * b + ca * w); c.lineTo(ca * (L + .015), sa * (L + .015)); c.lineTo(ca * b + sa * w, sa * b - ca * w); c.closePath();
  }

}

B.specie.registra({
  id: 'riccio',
  descrizione: 'Sente le ombre con tutto il corpo: se qualcosa gli passa vicino, punta gli aculei da quella parte. Meglio girargli al largo.',
  forma: { lx: 1, ly: 1 },
  ingombro: { x0: -1.38, y0: -1.38, x1: 1.38, y1: 1.38 },
  disegna(c, o) {
    const F = (o.fase || 0) * TAU, at = max(0, min(1, o.attivo || 0)), liv = round(at * 2), molle = .08 * (1 - .85 * at);

    CIME.length = 0;
    aculei(c, DIETRO, .4, .58 + .3 * at, .065, T.dietro, PUNTE[liv], F, molle, CIME);
    if (liv) P.lucine(c, CIME, .03, LUCE[liv], .35 + .5 * at);

    // ---- 2. il corpo: una palla lucida, con la sua tiara di perline azzurre
    P.palla(c, 0, 0, .5, .47, 0, T.corpo, { luce: [.14, -.22, .95], ombra: .09 });

    aculei(c, DAVANTI, .37, .3 + .14 * at, .06, T.davanti, PUNTE[liv], F, molle);
    if (P.fine(o)) P.lucine(c, TIARA, .026, PERLE, .7);

    if (liv === 2) {
      P.occhio(c, -.17, .03, .15, CATTIVO_SX); P.occhio(c, .17, .03, .15, CATTIVO_DX);
      P.sopracciglio(c, -.16, -.13, .3, .5, T.corpo.bordo, .09); P.sopracciglio(c, .16, -.13, .3, -.5, T.corpo.bordo, .09);
      P.sorriso(c, 0, .27, .08, BRONCIO);
    } else {
      P.occhio(c, -.17, .03, .15, liv ? SVEGLIO : SONNO); P.occhio(c, .17, .03, .15, liv ? SVEGLIO : SONNO);
      P.sorriso(c, 0, liv ? .23 : .26, liv ? .045 : .06, liv ? STUPORE : BRONCIO);
    }
    c.restore();
  },
});
})();

</script>

    // corpo: dorso blu, fianco azzurro, ventre d'argento

    c.beginPath(); c.moveTo(1, .02); c.bezierCurveTo(.7, -.42, -.2, -.4 + ym, -.72, ym * .4 - .05); c.lineTo(-.72, ym * .4 + .07); c.bezierCurveTo(-.2, .4 + ym, .7, .4, 1, .02); c.closePath();

})();

<script>
/* Boccone — specie: SCORFANO (taglia 3, agguato, veleno). Tozzo e bitorzoluto: testone che è mezzo pesce, bocca larghissima
   col broncio (la mandibola P.fauci sporge e ha i lembi di pelle sotto il mento), aculei velenosi sulla schiena con la
   punta chiara, due ciuffetti sopra gli occhi, pettorale a gran ventaglio, livrea rossa a selle scure e chiazze chiare.

B.specie.registra({
  id: 'scorfano',
  descrizione: 'Sta immobile fra gli scogli e sembra un sasso coperto d\'alghe, finché un pesciolino non gli passa davanti alla bocca. Gli aculei sulla schiena pungono e fanno molto male: meglio non toccarlo.',

    const a0 = P.suSpina(s, .74, -.92), a1 = P.suSpina(s, .36, -.88), b0 = P.suSpina(s, .34, -.86), b1 = P.suSpina(s, .14, -.8), an0 = P.suSpina(s, .36, .86), an1 = P.suSpina(s, .16, .8);
    P.pinna(c, { x0: b0.x, y0: b0.y, x1: b1.x, y1: b1.y, a0: -(PI / 2 + .35), a1: -(PI - .45), lung: .36, profilo: [.85, 1, .95, .7], n: 4, smerlo: .4, onda: .08, fase: F * 2 - 1, tinta: T.pinna, orlo: ORLO });
    P.pinna(c, { x0: an0.x, y0: an0.y, x1: an1.x, y1: an1.y, a0: PI / 2 + .45, a1: PI - .4, lung: .3, profilo: [.85, 1, .9, .7], n: 4, smerlo: .4, onda: .08, fase: F * 2 - 2, tinta: T.pinna, orlo: ORLO, righe: false });
    const g = P.pinna(c, { x0: a0.x, y0: a0.y, x1: a1.x, y1: a1.y, a0: -(PI / 2 + .1 - alza), a1: -(PI - .75 - alza), lung: m ? .7 : .56, profilo: [.7, 1, 1.05, 1, .92, .8, .6], n: 7, smerlo: .9,

    const ac = [], cx = (a0.x + a1.x) / 2, cy = (a0.y + a1.y) / 2; let R = .1;                    // gli aculei: dal mezzo del raggio fin oltre la vela
    for (let i = 0; i <= g.n; i++) {

    const sf = c.createRadialGradient(cx, cy, R * .3, cx, cy, R); sf.addColorStop(0, T.spina.ombra); sf.addColorStop(.5, T.spina.base); sf.addColorStop(.8, AVORIO); sf.addColorStop(1, punta);

    P.volume(c, s, T.corpo, { luce, ombra: .1, dentro(cc) {

    } });

<script>
/* Boccone — specie: SEPPIA (taglia 3, timida, lascia l'inchiostro). ESEMPIO DI RIFERIMENTO per i cefalopodi (vedi GUIDA-STILE.md):
   mantello rigido su una spina, gonna di pinna ondulante (P.cresta sopra e sotto), braccia fatte con P.tentacolo, occhio a W.
   Lo stesso schema serve per calamari, polpi, nautilus e per i giganti Piovra e Kraken. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, pow } = Math;

/* Calma è color albicocca; quando si arrabbia arrossisce (le seppie cambiano colore davvero) e le righe si fanno più cupe. */
const CALMA = { pelle: P.tinta('#f5914a', '#b0304a'), riga: '#8a3558', lontano: P.tinta('#c9603a', '#6a1a40'), iride: '#e8f24a' };
const IRA = { pelle: P.tinta('#ff5236', '#8a1040'), riga: '#5a0f38', lontano: P.tinta('#c2302c', '#5a0a38'), iride: '#ffb01e' };
const VENTRE = P.tinta('#ffe6c0', '#e88a5a'), GONNA = P.tinta('#4fe3d3'), PREDA = P.tinta('#ffc4a6', '#d8405a');
const SU = P.sagoma([[0, .1], [.1, .32], [.35, .5], [.6, .54], [.85, .47], [1, .38]]);
const GIU = P.sagoma([[0, .1], [.1, .3], [.35, .46], [.6, .5], [.85, .44], [1, .36]]);
/* Zebratura: sette bande ondulate di traverso al mantello, preparate una volta sola. */
const RIGHE = [];
for (let i = 0; i < 7; i++) { const u0 = .09 + i * .118, f = v => u0 + .028 * sin(v * 4 + i * 1.3) + .035 * v; RIGHE.push([f, v => f(v) + .052]); }
const altGonna = k => .2 * pow(sin(PI * k), .55);
/* Le braccia: [angolo da calma, angolo a caccia, lunghezza, ricciolo]. Quattro vicine (chiare) e tre lontane (scure). */
const VICINE = [[-.2, -.7, .5, -.5], [-.02, -.26, .6, -.2], [.18, .42, .6, .25], [.42, .9, .5, .6]];
const LONTANE = [[-.3, -.5, .52, -.4], [0, .1, .62, .1], [.34, .7, .54, .5]];

B.specie.registra({
  id: 'seppia',
  descrizione: 'Cambia colore in un lampo, come un\'insegna luminosa, e ha la pupilla a forma di W. Se si sente in pericolo sparisce dietro una nuvola di inchiostro.',
  forma: { lx: 1.3, ly: .6 },
  ingombro: { x0: -1.5, y0: -.95, x1: 2.06, y1: .9 },
  disegna(c, o) {
    const F = (o.fase || 0) * TAU, m = !!o.minaccia, b = o.bocca || 0, K = m ? IRA : CALMA, k = m ? 1 : 0;
    c.save();
    c.rotate(sin(F) * .03);                                            // dondola piano: il mantello è rigido, si muovono gonna e braccia
    const s = P.spinaPesce(12, -1.3, .38, 0, null, SU, GIU, { testa: .12, coda: .08 });

    // ---- 1. le braccia (prima le lontane, scure ed economiche), i due tentacoli da preda che scattano a caccia, poi le vicine
    const bx = .78, by = .13;
    for (let i = 0; i < 3; i++) {
      const a = LONTANE[i];
      P.tentacolo(c, { x: bx - .04, y: by - .06, ang: a[0] + (a[1] - a[0]) * k, lung: a[2], spess: .22, punta: .04, curva: a[3], onda: .16, fase: F + i * 1.9 + 1, tinta: K.lontano, ombra: 0, lume: 0, n: 7 });
    }
    if (m) for (const v of [-1, 1]) {
      P.tentacolo(c, { x: bx, y: by, ang: .1 + v * .2, lung: .92 + b * .2, spess: .075, punta: .045, curva: v * -.3, onda: .1, fase: F + v, clava: 1, tinta: PREDA, ombra: 0, lume: .02, n: 8, ventose: 3, lato: v, chiara: '#fff6e0' });
    }
    for (let i = 0; i < 4; i++) {
      const a = VICINE[i];
      P.tentacolo(c, { x: bx, y: by + (i - 1.5) * .06, ang: a[0] + (a[1] - a[0]) * k, lung: a[2], spess: .25, punta: .045, curva: a[3] * (1 + k * .8), onda: .16, fase: F + i * 1.7, tinta: K.pelle, ombra: 0, lume: .04, n: 8,
        ventose: i === 3 ? 4 : 0, lato: 1, chiara: '#ffe9cf' });
    }

    // ---- 2. la testa (copre le radici delle braccia), il sifone, la gonna di pinna sopra e sotto
    P.palla(c, .5, .04, .4, .39, 0, K.pelle, { luce: [.6, -.3, 1], ombra: 0 });      // quasi tutta coperta da mantello e occhio: niente ombra propria
    c.beginPath(); c.ellipse(.3, .43, .15, .09, .35, 0, TAU); c.strokeStyle = VENTRE.bordo; c.lineWidth = .08; c.stroke(); c.fillStyle = VENTRE.ombra; c.fill();     // il sifone: un pezzo piccolo si fa con due tratti
    const velo = P.alfa(GONNA.base, .85);
    P.cresta(c, s, { u0: .02, u1: .97, lato: -1, alt: altGonna, onda: .5, fase: F * 2, onde: 3, passi: 12, tinta: GONNA, colore: velo, orlo: m ? '#ff9ad8' : '#eafffb', dentro: .2 });
    P.cresta(c, s, { u0: .02, u1: .97, lato: 1, alt: altGonna, onda: .5, fase: F * 2 + 2, onde: 3, passi: 12, tinta: GONNA, colore: velo, orlo: m ? '#ff9ad8' : '#eafffb', dentro: .2 });

    // ---- 3. il mantello: zebrato, col ventre chiaro e qualche bozzo
    const luce = [-.2, -.42, 1.5];
    P.volume(c, s, K.pelle, { luce, ombra: .1, dentro(cc) {
      P.fianco(cc, s, u => .5 + .1 * sin(u * 14), 1.4, P.sfumatura(cc, VENTRE, luce));
      P.bande(cc, s, RIGHE, P.alfa(K.riga, .88), 8);
    } });
    if (P.fine(o)) P.bozzi(c, [-.9, -.16, -.56, -.02, -.2, -.06], .032, K.pelle);
    P.riflesso(c, -.34, -.4, .46, -.03, .1);

    // ---- 4. la faccia: occhione con la pupilla a W; a caccia palpebra tagliata e sopracciglio
    P.ombra(c, .5, -.02, .3, .34, 0, .28);
    P.occhio(c, .6, -.08, .22, Object.assign({ tipo: 'w', iride: K.iride, pelle: K.pelle, guarda: { x: .45, y: .15 } }, m ? P.SGUARDI.cattivo : P.SGUARDI.normale));
    if (m) P.sopracciglio(c, .64, -.3, .46, .42, K.pelle.bordo, .11);
    c.restore();
  },
});
})();

<script>
/* Boccone — specie: SQUALO PINNA NERA (taglia 5, pattuglia). Squalo di barriera snello color bronzo, ventre chiaro, e il
   segno che lo fa riconoscere da lontano: le punte delle pinne «intinte nell'inchiostro», orlate di chiaro.
   Tutte le pinne sono lame piene (P.lama); la coda sono due lame; la bocca sta sotto il muso (P.fauci).
   A caccia inarca la schiena, abbassa le pettorali, drizza la dorsale e mostra i denti. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, hypot } = Math;

// ---- tinte: bronzo caldo con ombre prugna (niente grigio), ventre crema, punte blu notte al posto del nero
const T = { corpo: P.tinta('#c0904c', '#4a2a5e'), pinna: P.tinta('#b27e40', '#44265a'), lontana: P.tinta('#8f643c', '#3a2052'), ventre: P.tinta('#fff3da', '#e39a6c') };
T.mento = Object.assign({}, P.tinta('#fff0d4', '#dc8f62'), { bordo: T.corpo.bordo });      // il mento ha il bordo scuro del corpo
const NERO = '#2a2250', ORLO = '#fff6dc', VENTRE = T.ventre.base, LAMA = P.alfa('#ffecc4', .55), DORSO = P.alfa(T.corpo.bordo, .2), NEI = P.alfa(T.corpo.bordo, .6);
/* Un siluro: muso lungo e tondo che sporge oltre la bocca (il ventre si ritira da u = .78), peduncolo sottile. */
const SU = P.sagoma([[0, .08], [.1, .14], [.3, .31], [.5, .41], [.68, .43], [.82, .39], [.92, .28], [1, .14]]);
const GIU = P.sagoma([[0, .08], [.1, .13], [.3, .28], [.5, .37], [.66, .38], [.76, .34], [.82, .22], [.9, .16], [1, .09]]);
const ONDA = { amp: .13, onde: .6, testa: .12, potenza: 1.7 };

/* Una lama con la punta scura orlata di chiaro. quota = quanta lama prende la punta (0..1). */
function pinnaNera(c, o, quota) {
  const r = hypot(o.px - o.x0, o.py - o.y0) * quota;
  o.dentro = cc => {
    cc.beginPath(); cc.arc(o.px, o.py, r + .065, 0, TAU); cc.fillStyle = ORLO; cc.fill();
    cc.beginPath(); cc.arc(o.px, o.py, r, 0, TAU); cc.fillStyle = NERO; cc.fill();
  };
  P.lama(c, o);
}

B.specie.registra({
  id: 'squalo_pinna_nera',
  descrizione: 'Lo riconosci dalle punte delle pinne, che sembrano intinte nell\'inchiostro. Fa la ronda in acqua così bassa che spesso la pinna del dorso spunta fuori.',
  forma: { lx: 1.4, ly: .45 },
  ingombro: { x0: -2.5, y0: -1.17, x1: 1.48, y1: 1.0 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};
    c.save();
    const s = P.spinaPesce(16, -1.4, 1.12, fase, ONDA, SU, GIU, { testa: .24, coda: .03, arco: m ? -.07 : 0 }), luce = [.5, -.5, 2.2];

    // ---- 1. dietro al corpo: pettorale lontana, coda a due lame, seconda dorsale, anale, ventrale, la grande dorsale, la bocca
    const rema = sin(F * 2 + .4), giu = m ? .14 : 0;
    const f0 = P.suSpina(s, .68, .72), f1 = P.suSpina(s, .57, .78);
    P.lama(c, { x0: f0.x, y0: f0.y, x1: f1.x, y1: f1.y, px: f1.x - .2 + giu, py: f1.y + .44 + giu - rema * .03, tinta: T.lontana, punta: NERO, quota: .34 });
    P.suSpina(s, 0, 0, q);
    const ac = q.ang + sin(F - 1.1) * .3, cx = cos(ac), cy = sin(ac);                  // la coda sbatte in ritardo sul corpo
    const X = (a, d) => q.x + cx * a - cy * d, Y = (a, d) => q.y + cy * a + cx * d;    // a = lungo la coda (indietro se negativo), d = di traverso (su se negativo)
    pinnaNera(c, { x0: X(.2, .08), y0: Y(.2, .08), x1: X(-.24, -.03), y1: Y(-.24, -.03), px: X(-.52, .52), py: Y(-.52, .52), tinta: T.pinna, davanti: .1, dietro: .26 }, .44);
    pinnaNera(c, { x0: X(.24, -.08), y0: Y(.24, -.08), x1: X(-.2, .1), y1: Y(-.2, .1), px: X(-.86, -.74), py: Y(-.86, -.74), tinta: T.pinna, davanti: .12, dietro: .24 }, .36);
    const s0 = P.suSpina(s, .23, -.8), s1 = P.suSpina(s, .11, -.8);
    P.lama(c, { x0: s0.x, y0: s0.y, x1: s1.x, y1: s1.y, px: s1.x - .14, py: s1.y - .27, tinta: T.pinna, punta: NERO, quota: .42 });
    const n0 = P.suSpina(s, .21, .8), n1 = P.suSpina(s, .11, .8);
    P.lama(c, { x0: n0.x, y0: n0.y, x1: n1.x, y1: n1.y, px: n1.x - .13, py: n1.y + .23, tinta: T.lontana });
    const v0 = P.suSpina(s, .37, .85), v1 = P.suSpina(s, .26, .85);
    P.lama(c, { x0: v0.x, y0: v0.y, x1: v1.x, y1: v1.y, px: v1.x - .13, py: v1.y + .28, tinta: T.pinna });
    const d0 = P.suSpina(s, .62, -.85), d1 = P.suSpina(s, .4, -.85);
    pinnaNera(c, { x0: d0.x, y0: d0.y, x1: d1.x, y1: d1.y, px: d1.x - .14 + (m ? .1 : 0) + sin(F - .6) * .03, py: d1.y - .72 - (m ? .05 : 0), tinta: T.pinna, davanti: .16, dietro: .26 }, .44);
    const ce = P.suSpina(s, .78, .5), apri = m ? .46 + b * .3 : b * .25;
    const ge = P.fauci(c, { x: ce.x, y: ce.y, ang: ce.ang + .02, lung: .4, apri, alt: .14, su: .25, tinta: T.mento, interno: '#8a1240', lingua: '#ff7d9c' });
    if (apri > .1) P.denti(c, ge.x0 + (ge.x1 - ge.x0) * .15, ge.y0 + (ge.y1 - ge.y0) * .15, ge.x1, ge.y1, 5, .1, 1, { tipo: 'punta', varia: .2 });

    // ---- 2. il corpo: dorso più scuro, ventre chiaro, la lama chiara sul fianco; sopra le branchie e il riflesso
    P.volume(c, s, T.corpo, { luce, ombra: .08, dentro(cc) {
      P.fianco(cc, s, -1.4, -.5, DORSO);
      P.fianco(cc, s, u => .12 + .1 * sin(u * 7 + 1), 1.4, VENTRE);
      P.fianco(cc, s, u => .12 - .3 * sin((u - .14) / .48 * PI), u => .2, LAMA, .14, .62);
      P.macchie(cc, s, { n: 8, seme: 5, u0: .12, u1: .8, v0: -.85, v1: -.3, r0: .018, r1: .034, colore: DORSO, lungo: 1.2 });
    } });
    P.anelli(c, s, .76, .67, 5, T.corpo, { v0: -.42, v1: .32, curva: .012, spess: .03 });
    P.suSpina(s, .74, -.62, q); P.riflesso(c, q.x, q.y, .36, q.ang - .04, .1);

    // ---- 3. sul fianco: la pettorale a falce (a caccia si abbassa)
    const p0 = P.suSpina(s, .67, .42), p1 = P.suSpina(s, .5, .55);
    P.ombra(c, p1.x + .05, p1.y + .14, .36, .15, .45, .28);
    pinnaNera(c, { x0: p0.x, y0: p0.y, x1: p1.x, y1: p1.y, px: p1.x - .4 + giu * 2.2, py: p1.y + .52 + giu + rema * .04, tinta: T.pinna, luce: [p0.x - .1, p0.y - .1, 1.1], davanti: .14, dietro: .26 }, .36);

    // ---- 4. la faccia: denti di sopra, narice, lentiggini del muso, occhio
    if (apri > .1) { const u0 = P.suSpina(s, .82, 1), u1 = P.suSpina(s, .945, 1); P.denti(c, u0.x, u0.y - .01, u1.x, u1.y - .01, 5, .1, -1, { tipo: 'punta', varia: .2, seme: 7 }); }
    if (P.fine(o)) {
      const n = P.suSpina(s, 1, .55);
      c.fillStyle = NEI; c.beginPath(); c.ellipse(n.x + .08, n.y, .035, .02, -.4, 0, TAU);
      for (let i = 0; i < 5; i++) { P.suSpina(s, .97 + i * .008, -.5 + i * .28, q); c.moveTo(q.x + .1 + (i % 2) * .05, q.y); c.arc(q.x + .08 + (i % 2) * .05, q.y, .014, 0, TAU); }
      c.fill();
    }
    const e = P.suSpina(s, .885, -.2);
    P.occhio(c, e.x, e.y, .15, Object.assign({ iride: m ? '#ff3a1e' : '#ffd43c', tipo: m ? 'fessura' : 'tondo', pelle: T.corpo, guarda: { x: .5, y: .15 } }, m ? P.SGUARDI.cattivo : P.SGUARDI.calmo));
    if (m) P.sopracciglio(c, e.x + .03, e.y - .15, .38, e.ang + .45, T.corpo.bordo, .11);
    c.restore();
  },
});
})();

<script>
/* Boccone — specie: SQUALO VOLPE (taglia 5, scattante). Squalo tozzo blu-violetto dal ventre bianco, muso corto, occhioni
   tondi da cucciolo e IL SUO SEGNO: il lobo di sopra della coda lungo quanto il corpo, a falce. La coda non è una lama
   rigida ma un nastro su una spina (P.spinaAngoli), così frusta l'acqua come quella vera.
   A caccia la arma sopra la schiena come uno scorpione (è così che stordisce le prede), inarca il dorso, abbassa le
   pettorali, drizza la dorsale e mostra i denti. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos } = Math;

// ---- tinte: blu-violetto saturo (le ombre le fa il viola-notte), ventre bianco con l'ombra azzurra, pinne un tono più scure
const T = { corpo: P.tinta('#6f63e6'), pinna: P.tinta('#5f52d2'), lontana: P.tinta('#4a3fae'), ventre: P.tinta('#f6f8ff', '#8fb2ea') };
T.mento = Object.assign({}, P.tinta('#f2f5ff', '#8fb2ea'), { bordo: T.corpo.bordo });       // il mento ha il bordo scuro del corpo
const VENTRE = T.ventre.base, DORSO = P.alfa(T.corpo.bordo, .22), LAMA = P.alfa('#d9d4ff', .5), NEI = P.alfa(T.corpo.bordo, .55), PUNTA = '#3d3296';
/* Un siluro tozzo: muso corto a cono che sporge sopra la bocca (il ventre si ritira da u = .8), peduncolo robusto. */
const SU = P.sagoma([[0, .1], [.1, .17], [.3, .34], [.5, .44], [.68, .46], [.82, .42], [.92, .31], [1, .16]]);
const GIU = P.sagoma([[0, .1], [.1, .15], [.3, .3], [.5, .4], [.66, .41], [.78, .36], [.84, .25], [.92, .18], [1, .1]]);
const ONDA = { amp: .12, onde: .6, testa: .12, potenza: 1.7 };
/* La falce: larga all'attacco, sottile in punta. */
const FALCE = P.sagoma([[0, .2], [.1, .175], [.4, .135], [.75, .09], [1, .04]]);
const NF = 14, LF = 1.95;                                                // tratti e lunghezza della falce

B.specie.registra({
  id: 'squalo_volpe',
  descrizione: 'La sua coda è lunga quanto tutto il resto del corpo. La usa come una frusta: una sferzata in mezzo a un banco di pesciolini e li stordisce, poi torna indietro a mangiarli.',
  forma: { lx: 1.25, ly: .48 },
  ingombro: { x0: -2.92, y0: -2.06, x1: 1.42, y1: 1.14 },
  disegna(c, o) {

    c.save();
    const s = P.spinaPesce(16, -1.02, 1.06, fase, ONDA, SU, GIU, { testa: .23, coda: .03, arco: m ? -.07 : 0 }), luce = [.45, -.55, 2.2];

    // ---- 1. dietro al corpo: pettorale lontana, la falce e il lobo di sotto, seconda dorsale, anale, ventrale, dorsale, la bocca
    const rema = sin(F * 2 + .4), giu = m ? .14 : 0;
    const f0 = P.suSpina(s, .7, .7), f1 = P.suSpina(s, .53, .78);
    P.lama(c, { x0: f0.x, y0: f0.y, x1: f1.x, y1: f1.y, px: f1.x - .26 + giu, py: f1.y + .58 + giu - rema * .03, tinta: T.lontana, davanti: .14, dietro: .28 });
    P.suSpina(s, 0, 0, q);
    const frusta = sin(F - 1.1) * .22, rx = q.x + .1, ry = q.y - .02;
    const coda = P.spinaAngoli(NF, rx, ry, LF, m
      ? u => PI + 1.0 + u * u + frusta * .5 + .16 * u * sin(F * 2 - 1 - u * 2.6)        // armata sopra la schiena, e vibra

<script>
/* Boccone — specie: TRIGLIA (taglia 2, cacciatore). Pesce di fondo rosso corallo: fronte ripida quasi a muro, occhi in alto,
   bocca bassa e, sotto il mento, due lunghi barbigli che frugano (da calma pendono e ondeggiano, a caccia puntano in avanti).
   Striscia gialla sul fianco, ventre rosa chiaro, squame grandi sul dorso, prima dorsale a vela gialla orlata di rosso.
   Il tratto esagerato sono i barbigli e il profilo ripido. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, max } = Math;

   k sposta in avanti quello lontano, così i due non si coprono. */

  c.save(); c.translate(x, y); c.rotate(ang - apri * .5);
  P.denti(c, -.12 * r, .03 * r, .52 * r, -.1 * r, 3, r * (.12 + .22 * apri), -1, { spess: .012 });
  c.rotate(apri * 1.35);

  c.restore();
};

B.specie.registra({
  id: 'triglia',
  descrizione: 'Con i due baffi sotto il mento fruga nella sabbia e sente il sapore di quello che tocca, come se avesse la lingua sulle dita. Cambia colore con l\'umore: di notte, quando dorme, diventa a chiazze.',
  forma: { lx: 1.05, ly: .5 },
  ingombro: { x0: -1.72, y0: -1.22, x1: 1.55, y1: .99 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};

    P.coda(c, { x: q.x + .05, y: q.y, ang: q.ang + PI + sin(F - 1.1) * .35, tipo: 'forca', lung: .62, alt: .52, radice: .11, fase: F - 1.9, onda: .16, tinta: T.pinna, orlo: ORLO });
    const a0 = P.suSpina(s, .7, -.9), a1 = P.suSpina(s, .5, -.88), b0 = P.suSpina(s, .42, -.86), b1 = P.suSpina(s, .2, -.8), an0 = P.suSpina(s, .4, .86), an1 = P.suSpina(s, .2, .8);
    P.pinna(c, { x0: a0.x, y0: a0.y, x1: a1.x, y1: a1.y, a0: -(PI / 2 + .2 - alza), a1: -(PI - .5 - alza * .5), lung: m ? .66 : .56, profilo: [1, .95, .7, .42], n: 5, smerlo: .45, onda: .06, fase: F * 2,
      tinta: T.pinna, orlo: ORLO });
    P.pinna(c, { x0: b0.x, y0: b0.y, x1: b1.x, y1: b1.y, a0: -(PI / 2 + .45), a1: -(PI - .4), lung: .32, profilo: [.9, 1, .8, .6], n: 5, smerlo: .3, onda: .08, fase: F * 2 - 1, tinta: T.pinna, orlo: ORLO });
    P.pinna(c, { x0: an0.x, y0: an0.y, x1: an1.x, y1: an1.y, a0: PI / 2 + .5, a1: PI - .4, lung: .28, profilo: [.9, 1, .8, .6], n: 5, smerlo: .3, onda: .08, fase: F * 2 - 2, tinta: T.pinna, orlo: ORLO });
    const pv = P.suSpina(s, .62, .95);
    P.pinna(c, { x0: pv.x + .06, y0: pv.y - .05, x1: pv.x - .08, y1: pv.y - .05, a0: PI * .6 + sin(F - .5) * .1, a1: PI * .82 + sin(F - .5) * .1, lung: .38, profilo: [1, .55], n: 3, piega: .1, tinta: T.pinna, orlo: ORLO, righe: false });
    const me = P.suSpina(s, .97, .8);
    barbiglio(c, me.x + .09, me.y - .04, sin(F * 2 + 1.6), .07, m, T.barbaLontana);

    // ---- 2. il corpo: ventre rosa chiaro, striscia gialla sul fianco e un filo giallo più sotto, squame sul dorso
    P.volume(c, s, T.corpo, { luce, ombra: .09, dentro(cc) {
      P.fianco(cc, s, u => .42 - .14 * sin(u * PI) + max(0, u - .8) * 4.5, 1.4, T.ventre.base);   // verso il mento si chiude a punta

    } });

      tinta: T.pett, orlo: '#ffe9a0', primo: true });

    // ---- 4. la faccia. Calmo: occhio verde acqua in alto, bocca bassa chiusa. A caccia: occhio rosso tagliato, sopracciglio, denti
    const e = P.suSpina(s, .88, -.42);
    if (m) P.guancia(c, e.x - .02, e.y + .34, .2, '#e0143c', .5);

    if (m) P.sopracciglio(c, e.x + .05, e.y - .23, .5, .5, T.corpo.bordo, .12);

<script>
/* Boccone — eroe: ARLECCHINO, il pesce mandarino. Testone da ranocchio con due occhi rossi sporgenti in cima (quello lontano
   fa capolino dietro), boccuccia a cuore, corpo arancio a onde blu dal cuore verde, pinne blu a ventaglio orlate d'arancio:
   due ventagli sotto la pancia su cui «cammina», la coda tonda e la vela sul dorso.
   Tre stadi: cucciolo tutto testa senza vela, adulto con la vela, colosso con la vela alta col pennacchio e i ventagli a festoni.
   Quattro espressioni: di gioia drizza la vela e canta, di paura la chiude e gli occhi schizzano fuori, colpito la affloscia. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;

const STADI = [
  { x0: -.6, x1: .52, testa: .42, onda: { amp: .09, onde: .45, testa: .14 }, corpo: ARANCIO('#ffa436'), pinna: BLU('#4a9dff'), orlo: '#ffb43a', blu: '#2f7dff', bluBordo: '#1c2f9e',
    su: P.sagoma([[0, .13], [.35, .5], [.7, .72], [1, .6]]), giu: P.sagoma([[0, .12], [.35, .44], [.7, .6], [1, .5]]),
    bande: bande(ONDE0, 1), cuori: bande(ONDE0, .36), occhio: .3, eu: .78, ev: -.84, lontano: .43, bocca: .17,
    coda: .46, pin: .36, vela: 0, ventaglio: .4, smerlo: 0, ru: .42 },
  { x0: -.9, x1: .6, testa: .38, onda: { amp: .11, onde: .5, testa: .12 }, corpo: ARANCIO('#ff8f24'), pinna: BLU('#2f7dff'), orlo: '#ffa02a', blu: '#1f6dff', bluBordo: '#1a2a98',
    su: P.sagoma([[0, .13], [.3, .42], [.6, .64], [.82, .7], [1, .56]]), giu: P.sagoma([[0, .11], [.3, .36], [.6, .52], [.82, .55], [1, .46]]),
    bande: bande(ONDE1, 1), cuori: bande(ONDE1, .36), occhio: .27, eu: .81, ev: -.82, lontano: .43, bocca: .18,
    coda: .6, pin: .46, vela: .72, ventaglio: .56, smerlo: .25, ru: .5 },
  { x0: -.95, x1: .64, testa: .38, onda: { amp: .11, onde: .5, testa: .12 }, corpo: ARANCIO('#ff7a1c'), pinna: BLU('#2462f2'), orlo: '#ff8a1e', blu: '#1a58f0', bluBordo: '#181f86',
    su: P.sagoma([[0, .15], [.3, .48], [.6, .7], [.82, .77], [1, .6]]), giu: P.sagoma([[0, .13], [.3, .42], [.6, .58], [.82, .6], [1, .48]]),
    bande: bande(ONDE2, 1), cuori: bande(ONDE2, .36), occhio: .26, eu: .82, ev: -.82, lontano: .43, bocca: .2,
    coda: .7, pin: .54, vela: .9, ventaglio: .72, smerlo: .6, ru: .5 },

  id: 'arlecchino',
  descrizione: 'Un pesce mandarino, il più colorato della barriera: sembra dipinto a mano. Non ha squame e, più che nuotare, saltella sul fondo sulle pinne come su due ventagli. Dicono che porti fortuna.',
  ingombro: { x0: -1.75, y0: -1.9, x1: 1.2, y1: 1.34 },
  disegna(c, o) {

    const paura = esp === 'spaventato', colpito = esp === 'colpito', felice = esp === 'felice';

<script>

   Tre stadi: cucciolo tutto testa con il guscio liscio e tondo, adulto con le pale lunghe e i primi bozzi sul dorso,
   colosso dal guscio possente con la cresta di punte d'oro, le borchie sugli scudi e due patelle attaccate dietro.
   Quattro espressioni: di gioia allunga il collo e sventola le pale; di paura tira la testa sotto il guscio e sbircia;
   colpito resta con le pale a penzoloni. La testa e la sua faccia si disegnano PRIMA del guscio, che ne copre il collo. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, max, min } = Math;

// ---- tinte e misure dei tre stadi: tutto ciò che cambia crescendo sta qui, il disegno è uno solo
const PELLE = c => P.tinta(c, '#0e8f78'), GUSCIO = c => P.tinta(c, '#0b4f92');
const ORO = P.tinta('#ffd23f', '#ff7a1a'), CREMA = P.tinta('#fff3c4', '#e8925c'), CALCARE = P.tinta('#fff1d6', '#d98a5a');
const IRIDE = '#c8551c', GOLA = '#f6ffb4', ROSA = '#ff5f8f', TACCA = P.alfa(ORO.bordo, .45), PIEGA = P.alfa(CREMA.scura, .5);
/* gx, gy, grx, gry, ang: centro, mezze misure e inclinazione del guscio; hx, hy, r: centro e raggio della testa;
   pala: lunghezza delle pinne davanti; nodi: quanto spuntano i bozzi della cresta (0 = guscio liscio);
   rit: di quanto la testa rientra sotto il guscio per la paura. */
const STADI = [
  { gx: -.44, gy: -.1, grx: .6, gry: .68, ang: -.1, hx: .56, hy: -.02, r: .58, occhio: .3, bocca: .18, pala: .6, nodi: 0, rit: .2,
    pelle: PELLE('#a4ea5c'), guscio: GUSCIO('#3fd3a2'), sguardo: { palpebra: .05, brillio: 1.25 } },
  { gx: -.46, gy: -.08, grx: .76, gry: .78, ang: -.08, hx: .68, hy: -.01, r: .52, occhio: .28, bocca: .17, pala: .8, nodi: .45, rit: .22,
    pelle: PELLE('#86dc48'), guscio: GUSCIO('#17b488'), sguardo: { palpebra: .2, sotto: .1 } },
  { gx: -.5, gy: -.1, grx: .86, gry: .88, ang: -.07, hx: .72, hy: .01, r: .5, occhio: .25, bocca: .17, pala: .96, nodi: 1, rit: .24,
    pelle: PELLE('#68c63c'), guscio: GUSCIO('#0e9080'), sguardo: { palpebra: .3, taglio: .1, sotto: .08 } },
];
/* Le forme «in misura del guscio» (u da -1 dietro a +1 davanti, v da -1 in cima a circa +.45 all'orlo) e della testa
   (in raggi della testa): si riportano una volta sola nelle misure di ogni stadio. */
const SAGOMA = [1, .1, .93, -.36, .62, -.8, .1, -1, -.45, -.9, -.86, -.5, -1, .02, -.86, .36, -.3, .46, .4, .44, .88, .34];
const TESTA = [-1, -.1, -.72, -.72, -.1, -1, .52, -.84, .92, -.36, 1.1, .08, .98, .42, .6, .8, -.1, .92, -.75, .7];
const orlo = u => .24 - .22 * u * u;                                // dove comincia la fascia d'oro degli scudi dell'orlo
const ORLO = [], TACCHE = [];
for (let i = 0; i <= 10; i++) { const u = -1.1 + i * .22; ORLO.push(u, orlo(u)); }
for (const u of [-.84, -.58, -.32, -.06, .2, .46, .72]) TACCHE.push([u, orlo(u), u * 1.05, .62]);
const CUCITURE = [[-1.05, -.1, -.86, -.22, -.62, -.58, -.38, -.56, -.12, -.76, .14, -.62, .42, -.68, .62, -.44, .86, -.3, 1.05, -.32],      // lo zig-zag fra gli scudi del dorso e quelli del fianco
  [-.62, -.58, -.8, -.82], [-.12, -.76, -.16, -1.1], [.42, -.68, .56, -1], [-.38, -.56, -.46, orlo(-.46)], [.14, -.62, .08, orlo(.08)], [.62, -.44, .6, orlo(.6)], ORLO];
const CENTRI = [[-.66, -.2, .16, .22], [-.14, -.22, .19, .27], [.37, -.2, .18, .25], [.8, -.12, .09, .14]];        // il lustro al centro di ogni scudo
const PIEGHE = [[-.52, .5, -.56, .95], [-.14, .5, -.16, .95], [.24, .5, .24, .95]];
const NODI = [[3.75, 1], [4.28, 1.15], [4.8, 1.1], [5.32, .85], [2.82, .8], [3.2, .9]];                           // [direzione dal centro del guscio, altezza]; gli ultimi due sono i denti dell'orlo dietro
const PLACCHE = [[-.62, -.52, .13], [-.3, -.84, .11], [.14, -.9, .1], [.52, -.72, .09], [.8, -.42, .08], [-.86, -.16, .1]];
for (const K of STADI) {
  const ca = cos(K.ang), sa = sin(K.ang);
  const X = K.X = (u, v) => K.gx + u * K.grx * ca - v * K.gry * sa, Y = K.Y = (u, v) => K.gy + u * K.grx * sa + v * K.gry * ca;
  const mappa = p => { const q = []; for (let i = 0; i < p.length; i += 2) q.push(X(p[i], p[i + 1]), Y(p[i], p[i + 1])); return q; };
  K.sag = mappa(SAGOMA); K.cuciture = CUCITURE.map(mappa); K.tacche = TACCHE.map(mappa); K.pieghe = PIEGHE.map(mappa);
  K.fascia = [mappa(ORLO.concat([1.4, .9, -1.4, .9]))];
  K.centri = CENTRI.map(m => [X(m[0], m[1]), Y(m[0], m[1]), m[2] * K.grx, m[3] * K.gry]);
  K.borchie = mappa([-.66, -.24, -.14, -.28, .37, -.25, -.36, -.76, .15, -.84]); K.patelle = mappa([-.8, .0, -.9, -.2, -.62, .06]);
  K.testa = TESTA.map(v => v * K.r);
  K.nodiP = [];
  for (let i = 0; i < (K.nodi === 1 ? 6 : 4); i++) {                 // ogni bozzo: base, punta piegata all'indietro, base
    const a = NODI[i][0], h = NODI[i][1] * .17 * K.nodi, d = .17, e = [];
    for (const [da, rr] of [[-d, .9], [-d * .6, 1 + h * .6], [-.1, 1 + h], [d * .55, 1 + h * .5], [d, .9]]) e.push(X(cos(a + da) * rr, sin(a + da) * rr), Y(cos(a + da) * rr, sin(a + da) * rr));
    K.nodiP.push(e);
  }
  K.lontana = P.tinta(K.pelle.scura, '#0a3f6e'); K.placca = P.alfa(K.pelle.scura, .5);
  K.lustro = P.alfa(K.guscio.luce, .3); K.solco = P.alfa(K.guscio.bordo, .6); K.filo = P.alfa(K.guscio.luce, .5);
}
const SCAGLIE = [[.3, -.09, .075], [.47, -.12, .07], [.64, -.12, .06], [.8, -.09, .045], [.4, .035, .04], [.58, .035, .035], [.74, .025, .03]];
const PAURA = Object.assign({ raggioIride: .54 }, P.SGUARDI.spaventato);      // occhio sbarrato: tanto bianco, iride piccola
const TMP = new Array(20);                                          // il profilo della testa col mento che scende (riscritto a ogni disegno)

/* Tante spezzate in un tracciato solo, spostate di (dx, dy): cuciture, tacche, pieghe. */
const linee = (c, liste, dx, dy) => {
  c.beginPath();
  for (const p of liste) { c.moveTo(p[0] + dx, p[1] + dy); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i] + dx, p[i + 1] + dy); }
};
/* Una pinna a paletta lunga L che parte da (x, y) e punta nella direzione fi: il bordo d'attacco è gonfio, la punta tonda.
   macchia = colore delle placche (o niente, per le pinne lontane). */
const pala = (c, x, y, fi, L, tinta, macchia) => {
  c.save(); c.translate(x, y); c.rotate(fi);
  c.beginPath(); c.moveTo(-.06 * L, -.15 * L); c.bezierCurveTo(.25 * L, -.36 * L, .78 * L, -.32 * L, L, -.07 * L);
  c.quadraticCurveTo(1.07 * L, .06 * L, .92 * L, .11 * L); c.bezierCurveTo(.62 * L, .18 * L, .3 * L, .1 * L, -.06 * L, .17 * L); c.closePath();
  c.lineJoin = 'round'; c.strokeStyle = tinta.bordo; c.lineWidth = P.BORDO * 2; c.stroke();
  const g = c.createLinearGradient(0, 0, L, 0); g.addColorStop(0, tinta.scura); g.addColorStop(.35, tinta.base); g.addColorStop(1, tinta.chiara);
  c.fillStyle = g; c.fill();
  if (macchia) {
    c.fillStyle = macchia; c.beginPath();
    for (const m of SCAGLIE) { c.moveTo((m[0] + m[2]) * L, m[1] * L); c.arc(m[0] * L, m[1] * L, m[2] * L, 0, TAU); }
    c.fill();
    c.beginPath(); c.moveTo(.2 * L, -.215 * L); c.quadraticCurveTo(.55 * L, -.29 * L, .86 * L, -.15 * L);         // filo di luce sul bordo d'attacco
    c.lineCap = 'round'; c.strokeStyle = P.alfa(tinta.luce, .7); c.lineWidth = .028; c.stroke();
  }
  c.restore();
};

B.eroi.registra({
  id: 'scoglio',
  descrizione: 'Una tartarughina marina calma e testarda, che nuota battendo le pinne come ali. Le tartarughe di mare vere non riescono a nascondere la testa nel guscio: lui, quando ha paura, ci prova lo stesso.',
  ingombro: { x0: -1.66, y0: -1.36, x1: 1.45, y1: 1.2 },
  disegna(c, o) {
    const st = max(0, min(2, o.stadio | 0)), K = STADI[st], esp = o.espressione || 'normale', F = (o.fase || 0) * TAU, t = o.t || 0, b = max(0, min(1, o.bocca || 0));
    const paura = esp === 'spaventato', colpito = esp === 'colpito', felice = esp === 'felice', fermo = paura || colpito;
    const batte = sin(F), rema = fermo ? 0 : sin(F * 2 + .6), r = K.r, L = K.pala * (paura ? .55 : 1), X = K.X, Y = K.Y;
    // la direzione delle pale davanti: 1.57 = in giù, 3.14 = all'indietro. Battono come ali; di paura si chiudono sotto il guscio
    const fi = paura ? 2.75 : colpito ? 1.8 : felice ? 1.5 + batte * .4 + sin(t * 9) * .14 : 2.02 + batte * .5;
    c.save();
    if (paura) c.translate(sin(t * 41) * .012, 0);                   // trema
    c.translate(0, fermo ? 0 : sin(F - 1) * .03);                    // ogni colpo di pala lo solleva un po'
    c.rotate(batte * .03 + (colpito ? -.14 : 0));

    // ---- 1. dietro a tutto: pala lontana, pinne di dietro, codino, cresta di bozzi (le radici finiscono sotto il guscio)
    pala(c, X(.6, .3), Y(.6, .3), fi - .22 - (fermo ? 0 : cos(F) * .12), L * .86, K.lontana, null);
    const ch = paura ? .5 : 1;
    pala(c, X(-.4, .4), Y(-.4, .4), 2.25 - rema * .14, K.grx * .52 * ch, K.lontana, null);
    P.corno(c, X(-.9, .24), Y(-.9, .24), PI - .3 + rema * .12, K.grx * .3, .15, K.pelle);
    pala(c, X(-.66, .32), Y(-.66, .32), 2.72 + rema * .14, K.grx * .62 * ch, K.pelle, null);
    if (K.nodi) {
      c.beginPath();
      for (const e of K.nodiP) { c.moveTo(e[0], e[1]); c.quadraticCurveTo(e[2], e[3], e[4], e[5]); c.quadraticCurveTo(e[6], e[7], e[8], e[9]); }
      c.lineJoin = 'round'; c.strokeStyle = K.guscio.bordo; c.lineWidth = P.BORDO * 2; c.stroke();
      const g = c.createRadialGradient(K.gx, K.gy, K.gry * .92, K.gx, K.gy, K.gry * 1.17); g.addColorStop(0, K.guscio.base); g.addColorStop(.5, K.guscio.chiara); g.addColorStop(1, ORO.base);
      c.fillStyle = g; c.fill();
    }

    // ---- 2. la pancia crema, con le pieghe delle piastre
    P.palla(c, X(.04, .42), Y(.04, .42), K.grx * .88, K.gry * .42, K.ang, CREMA, { luce: [X(.25, .62), Y(.25, .62), K.grx * 1.5], ombra: .04, dentro(cc) {
      linee(cc, K.pieghe, 0, 0); cc.lineCap = 'round'; cc.strokeStyle = PIEGA; cc.lineWidth = .03; cc.stroke();
    } });

    // ---- 3. la testa con tutta la faccia: il mento scende quando apre la bocca; di paura rientra sotto il guscio
    const rit = paura ? K.rit : colpito ? .06 : felice ? -.05 : 0, apre = paura ? .3 : colpito ? .2 : felice ? max(b, .35) : b * .9;
    const hx = K.hx - rit, hy = K.hy - (felice ? .03 : 0), ex = -.02 * r, ey = -.2 * r, ro = K.occhio;
    c.save(); c.translate(hx, hy); c.rotate(sin(F - .9) * .03 + sin(t * 1.7) * .012 + (felice ? -.13 : colpito ? .12 : 0));
    for (let i = 0; i < 20; i++) TMP[i] = K.testa[i];
    TMP[13] += .1 * r * apre; TMP[14] += .03 * r * apre; TMP[15] += .26 * r * apre; TMP[17] += .12 * r * apre;
    P.volume(c, cc => P.profilo(cc, TMP), K.pelle, { luce: [.25 * r, -.4 * r, 1.9 * r], ombra: .055, dentro(cc) {
      P.guancia(cc, .3 * r, .95 * r, .85 * r, GOLA, .7);              // la gola chiara
      cc.fillStyle = K.placca; cc.beginPath();                        // le placche scure sulla testa
      for (const m of PLACCHE) { cc.moveTo((m[0] + m[2]) * r, m[1] * r); cc.arc(m[0] * r, m[1] * r, m[2] * r, 0, TAU); }
      cc.fill();
    } });
    P.guancia(c, -.25 * r, .56 * r, .32 * r, ROSA, paura ? .25 : felice ? .85 : .55);
    const ammicca = (t % 4.6) > 4.42;
    const sg = colpito ? P.SGUARDI.colpito : felice ? P.SGUARDI.felice : paura ? PAURA : ammicca ? P.SGUARDI.felice : K.sguardo;
    P.occhio(c, ex, ey, ro, Object.assign({ iride: IRIDE, pelle: K.pelle, guarda: P.sguardo(o.sguardo, hx + ex, hy + ey) }, sg));
    if (paura) P.sopracciglio(c, ex + .04, ey - ro * 1.42, ro * 1.1, -.32, K.pelle.bordo, .06);
    else if (st === 2 && !colpito && !felice) P.sopracciglio(c, ex + .05, ey - ro * 1.04, ro * 1.8, .16, K.pelle.bordo, .085);      // da colosso: lo sguardo di chi ne ha viste tante
    if (P.fine(o)) { c.fillStyle = P.alfa(K.pelle.bordo, .7); c.beginPath(); c.ellipse(.93 * r, -.16 * r, .035, .02, -.6, 0, TAU); c.fill(); }      // la narice
    const mx = .6 * r, my = .5 * r, w = K.bocca;
    if (paura) P.sorriso(c, mx + .03, my, w * .5, { ang: -.3, apri: .55 + sin(t * 30) * .08, alt: w * .8, curva: -.3, lingua: false, tinta: K.pelle, spess: .06 });
    else if (colpito) P.sorriso(c, mx, my, w * .9, { ang: -.3, apri: .45, alt: w * .7, curva: -.8, lingua: false, tinta: K.pelle, spess: .06 });
    else P.sorriso(c, mx, my, w, { ang: -.3, apri: apre, alt: w * 1.35, curva: felice ? 1 : .75, tinta: K.pelle, spess: .06 });
    c.restore();

    // ---- 4. la pala vicina (la radice finisce sotto il guscio) e l'ombra che il guscio le getta addosso
    pala(c, X(.42, .2), Y(.42, .2), fi, L, K.pelle, K.placca);
    P.ombra(c, X(.2, .56), Y(.2, .56), K.grx * .55, .1, K.ang, .3);

    // ---- 5. il guscio: una cupola sola; dentro, il lustro degli scudi, la fascia d'oro dell'orlo e le cuciture incise
    P.volume(c, cc => P.profilo(cc, K.sag), K.guscio, { luce: [X(.35, -.55), Y(.35, -.55), K.grx * 1.75], ombra: .12, dentro(cc) {
      cc.fillStyle = K.lustro; cc.beginPath();
      for (const m of K.centri) { cc.moveTo(m[0] + m[2], m[1]); cc.ellipse(m[0], m[1], m[2], m[3], 0, 0, TAU); }
      cc.fill();
      linee(cc, K.fascia, 0, 0); cc.fillStyle = P.sfumatura(cc, ORO, [X(.4, .1), Y(.4, .1), K.grx * 1.7]); cc.fill();
      cc.lineJoin = cc.lineCap = 'round';
      linee(cc, K.cuciture, 0, 0); cc.strokeStyle = K.solco; cc.lineWidth = .05; cc.stroke();
      linee(cc, K.cuciture, .022, .018); cc.strokeStyle = K.filo; cc.lineWidth = .022; cc.stroke();
      linee(cc, K.tacche, 0, 0); cc.strokeStyle = TACCA; cc.lineWidth = .035; cc.stroke();
    } });
    if (st === 2 && P.fine(o)) { P.bozzi(c, K.borchie, .05, K.guscio); P.bozzi(c, K.patelle, .05, CALCARE); }
    P.riflesso(c, X(.36, -.7), Y(.36, -.7), K.grx * .55, .4 + K.ang, .16);

    // ---- 6. i segni dell'espressione
    if (paura) P.goccia(c, hx + .5 * r, K.hy - .88 * r + sin(t * 5) * .015, .085, .5);
    if (colpito) P.stelle(c, hx - .1, K.hy - r - .3, .5, t, 3, .12);
    c.restore();
  },
});
})();

<script>
/* Boccone — eroe: ZANNA, lo squaletto. Di profilo: un siluro paffuto azzurro con la pancia bianca, il muso tondo che
   sporge sopra la bocca, e il suo marchio: il ghigno sempre socchiuso con i dentini in vista (la mandibola è incernierata
   e si spalanca per il morso). Occhio ambra, guancia rosa con la fossetta, pinne piene a lama, coda a falce.
   Tre stadi: cucciolo corto e tondo con tre dentini e le pinnette arrotondate; adulto affusolato con il sopracciglio
   da sbruffone; colosso dal petto largo e il dorso scuro, pinna alta, zanne irregolari e lo sfregio ricucito sull'occhio.
   Quattro espressioni: di gioia strizza l'occhio e spalanca il ghigno scodinzolando; di paura si ingobbisce, abbassa la
   pinna, stringe le pettorali e batte i denti; colpito resta a bocca aperta con le pinne flosce. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, max, min } = Math;

// ---- tinte e misure dei tre stadi: tutto ciò che cambia crescendo sta qui, il disegno è uno solo
const BLU = c => P.tinta(c, '#3a2c9e'), BIANCO = P.tinta('#f6fbff', '#86a8f0');
const IRIDE = '#ff931c', ROSA = '#ff5f93', VENTRE = BIANCO.base, SFREGIO = '#ffe3ec';
/* x0, x1, testa: la spina dal codino al muso e la calotta del muso; cu, cv: la cerniera della mandibola sulla spina;

   nd, ld: quanti denti e quanto lunghi; dors, coda, pett: grandezza della pinna del dorso, della coda, delle pettorali. */
const STADI = [
  { x0: -.56, x1: .78, testa: .34, onda: { amp: .1, onde: .5, testa: .14, potenza: 1.5 },
    su: P.sagoma([[0, .1], [.16, .3], [.38, .58], [.6, .72], [.8, .68], [.93, .52], [1, .34]]),
    giu: P.sagoma([[0, .1], [.16, .3], [.38, .56], [.58, .66], [.68, .6], [.75, .46], [.84, .4], [.93, .36], [1, .32]]),
    corpo: BLU('#86b8ff'), occhio: .3, eu: .78, ev: -.22, cu: .74, cv: .85, mang: -.3, mand: .44, malt: .17, lu0: .79, lu1: .985, nd: 3, ld: .11, br: 2,
    dors: .36, coda: .6, pett: .6, tondo: .36, falce: .05, sguardo: { palpebra: .05, brillio: 1.25, pupilla: 1.15 } },
  { x0: -.9, x1: .84, testa: .28, onda: { amp: .12, onde: .55, testa: .12, potenza: 1.6 },
    su: P.sagoma([[0, .09], [.14, .22], [.34, .46], [.55, .62], [.72, .64], [.86, .54], [.95, .38], [1, .26]]),
    giu: P.sagoma([[0, .09], [.14, .21], [.34, .42], [.54, .56], [.66, .56], [.74, .44], [.83, .36], [.92, .3], [1, .25]]),
    corpo: BLU('#6298f0'), occhio: .27, eu: .82, ev: -.28, cu: .73, cv: .85, mang: -.34, mand: .55, malt: .19, lu0: .77, lu1: .985, nd: 5, ld: .12, br: 3,
    dors: .5, coda: .8, pett: .82, tondo: .18, falce: .16, sguardo: { palpebra: .12, taglio: .14, sotto: .12, pupilla: 1.15 } },
  { x0: -.96, x1: .88, testa: .26, onda: { amp: .12, onde: .55, testa: .1, potenza: 1.7 },
    su: P.sagoma([[0, .1], [.12, .22], [.3, .48], [.5, .68], [.68, .72], [.84, .58], [.94, .4], [1, .26]]),

// ---------------------------------------------------------------- i pittori del fondale (origine nel piede, y verso l'alto negativo)
function alghetta(x, caso, tipo, r, col) {

    const n = 4 + Math.floor(caso() * 3);
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1) - .5, lun = r * (.7 + caso() * .4) * (1 - Math.abs(u) * .3);
      x.save(); x.rotate(u * 1.7 + (caso() - .5) * .2);

      x.beginPath(); liscia(x, puntiMacchia(0, -lun * .52, lun * .3, lun * .54, caso, .2, 9)); x.fill();
      x.strokeStyle = alfa(chiaro(col, .4), .5); x.lineWidth = 1.8; x.stroke();
      x.strokeStyle = alfa(scuro(col, .5), .3); x.lineWidth = 1.6; x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(lun * .06, -lun * .4, 0, -lun * .8); x.stroke();
      x.restore();

    const n = 7 + Math.floor(caso() * 4);
    for (let pass = 0; pass < 2; pass++) {
      x.fillStyle = pass ? chiaro(col, .16) : scuro(col, .22); x.beginPath();
      for (let i = pass; i < n; i += 2) { const u = i / (n - 1) - .5, h = r * (.7 + caso() * .5), pg = u * r * 1.1 + (caso() - .5) * 8, bx = u * r * .5, w = 2.6 + caso() * 1.4; x.moveTo(bx - w, 3); x.quadraticCurveTo(bx + pg * .3 - w, -h * .55, bx + pg, -h); x.quadraticCurveTo(bx + pg * .3 + w, -h * .55, bx + w, 3); }
      x.fill();
    }
  } else {                     // quercina di mare: rametti a forcella con le palline in punta
    const rami = [], punte = [];
    const cresci = (x0, y0, ang, lun, sp, liv) => {
      const x1 = x0 + Math.cos(ang) * lun, y1 = y0 + Math.sin(ang) * lun; rami.push([x0, y0, x1, y1, sp]);
      if (liv <= 0) { punte.push([x1, y1]); return; }

  }
}
/* Stende il muschio tra un orlo di fuori e uno di dentro (punti nello stesso ordine), con l'ombra sotto l'orlo. */
function stendiMuschio(x, fuori, dentro, col, su, giu) {
  const orlo = fuori.concat(dentro.slice().reverse());

/* La coperta di muschio su una massa tonda (chi chiama ha già ritagliato la massa): spessa in cima, niente sotto. */
function coperta(x, caso, m, col, spesso = .5) {

// ---------------------------------------------------------------- la ghiaia
const GHI = ['#cdd3a2', '#a9b587', '#7d8f6f'];   // in cima, sotto la cresta, in profondità
const SASSI = ['#8fa192', '#b7c1a6', '#6d8378', '#bda98a', '#9aae8c'];

/* Chiazze, sassolini e granelli su una striscia larga 512 unità che si ripete. */
function granaGhiaia(x, caso, alt, forza, fitta = 1) {
  const P = 512, GIRI = [-P, 0, P];
  for (let i = 0; i < 4 + alt / 26; i++) {
    const cx = caso() * P, cy = caso() * alt, rx = 36 + caso() * 80, ry = 7 + caso() * 15, luce = caso() < .45;
    for (const ox of GIRI) lucido(x, cx + ox, cy, rx, ry, 0, (luce ? .3 : .24) * forza, luce ? '#f4f8d6' : '#557a5c');
  }

  for (let i = 0; i < alt * 1.1 * fitta; i++) { const u = caso(); sassi.push([caso() * P, caso() * alt, 1.8 + u * u * 7.5, .55 + caso() * .35, (caso() - .5) * 1.2, Math.floor(caso() * SASSI.length)]); }

    x.fillStyle = stile; x.beginPath();
    for (const s of sassi) if (quale === undefined || s[5] === quale) for (const ox of GIRI) ovale(x, s[0] + ox + dx * s[2], s[1] + dy * s[2], s[2] * kx, s[2] * s[3] * ky, s[4]);
    x.fill();

/* Dove sta il fusto `st` della pianta `p` alla quota y: il piede è fermo, più su serpeggia e ondeggia con la corrente. */

const PASSO_FUSTO = 48;

const TINTE_VICINE = { fusto: mesc(scuro(KELP.fusto, .12), ACQUA, VELO_KELP), luce: mesc(chiaro(KELP.fusto, .3), ACQUA, VELO_KELP), spesso: 6.5 };

const PUNTE = new Float32Array(64);
function tentacoli(c, a, t) {
  const n = a.n;

<style>
/* css/00-base.css */
/* Boccone — base: pagina, tela, bottoni comuni e cruscotto di gioco. */
:root {
  --sopra: env(safe-area-inset-top, 0px); --sotto: env(safe-area-inset-bottom, 0px);
  --sx: env(safe-area-inset-left, 0px); --dx: env(safe-area-inset-right, 0px);
  --acqua: #35e0c8; --notte: rgba(8, 20, 48, .62); --oro: #ffe066; --rosa: #ff5c7a;
}
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #0a1f44; color: #fff;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
canvas#tela { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font-family: inherit; color: inherit; -webkit-appearance: none; appearance: none; border: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
[hidden] { display: none !important; }

.vetro { background: var(--notte); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .22); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tondo { pointer-events: auto; width: 44px; height: 44px; flex: none; border-radius: 50%; padding: 0; font-size: 18px; font-weight: 900; display: grid; place-items: center; }
.tondo:active { transform: scale(.92); }
.perla { width: 16px; height: 16px; border-radius: 50%; flex: none; display: inline-block; vertical-align: -2px; background: radial-gradient(circle at 35% 30%, #fff, #ffd9f0 45%, #d58fc0); box-shadow: 0 0 6px rgba(255, 200, 240, .7); }
.perla.piccola { width: 11px; height: 11px; vertical-align: -1px; }
.segno-pausa { display: block; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; box-sizing: border-box; }

/* ----- Cruscotto ----- */
#cruscotto { position: fixed; inset: 0; pointer-events: none; display: none; }
#cruscotto.visibile { display: block; }
#cr-alto { padding: calc(var(--sopra) + 10px) calc(var(--dx) + 12px) 0 calc(var(--sx) + 12px); }
.riga { display: flex; align-items: center; gap: 10px; }
#cr-avanzamento { flex: 1; min-width: 0; }
#cr-etichette { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; font-size: 12px; font-weight: 800; margin-bottom: 4px; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
#cr-livello { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#cr-obiettivo { flex: none; color: var(--oro); }
#cr-obiettivo .morso { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 3px; background: var(--rosa); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85); }
#cr-obiettivo .morso.dato { background: rgba(8, 20, 48, .6); }
#cr-barra { height: 13px; border-radius: 8px; overflow: hidden; }
#cr-barra i { display: block; height: 100%; width: 0%; border-radius: 8px; background: linear-gradient(90deg, #35e0c8, #ffe066); transition: width .25s; }
#cr-frenesia { height: 5px; border-radius: 4px; margin-top: 4px; overflow: hidden; background: rgba(8, 20, 48, .45); }
#cr-frenesia i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ff9d3b, #ff4f7b); }
#cr-perle { flex: none; height: 44px; border-radius: 22px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 7px; font-weight: 900; font-size: 16px; }
#cr-sotto { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; min-height: 28px; }
#cr-cuori { font-size: 21px; letter-spacing: 2px; text-shadow: 0 2px 3px rgba(0, 0, 0, .5); margin-right: 4px; white-space: nowrap; }
#cr-cuori .pieno { color: var(--rosa); } #cr-cuori .vuoto { color: rgba(255, 255, 255, .28); }
#cr-aiuti { display: contents; }
.gettone { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 14px; white-space: nowrap; }
.gettone.molt { color: var(--oro); } .gettone.cal { color: #ff9ecb; } .gettone.scu { color: #9be7ff; } .gettone.fre { color: #ffb05c; } .gettone.tempo { color: #fff; }

#cr-scatto {
  pointer-events: auto; position: absolute; right: calc(var(--dx) + 18px); bottom: calc(var(--sotto) + 26px);
  width: 84px; height: 84px; border-radius: 50%; padding: 0; --car: 100%;
  background: conic-gradient(#35e0c8 var(--car), rgba(8, 20, 48, .6) 0);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
}
#cruscotto.mano-sinistra #cr-scatto { right: auto; left: calc(var(--sx) + 18px); }
#cr-scatto span { position: absolute; inset: 6px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 900; letter-spacing: .5px; background: radial-gradient(circle at 40% 30%, #1e4d8c, #0b2350); }
#cr-scatto.pronto span { background: radial-gradient(circle at 40% 30%, #2aa7a0, #0b5f6c); }
#cr-scatto:active { transform: scale(.93); }

#cr-annuncio { position: absolute; left: 0; right: 0; top: max(25%, calc(var(--sopra) + 204px)); text-align: center; opacity: 0; padding: 0 18px; }
#cr-annuncio.vai { animation: annuncio var(--durata, 2.4s) ease-out both; }
#cr-annuncio b { display: block; font-size: 32px; font-weight: 900; line-height: 1.08; text-shadow: 0 3px 0 rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .5); }
#cr-annuncio span { display: inline-block; margin-top: 8px; font-size: 15px; line-height: 1.25; font-weight: 800; padding: 6px 14px; border-radius: 16px; background: rgba(8, 20, 48, .6); max-width: 330px; }
#cr-annuncio span:empty { display: none; }
@keyframes annuncio { 0% { opacity: 0; transform: scale(.6); } 12% { opacity: 1; transform: scale(1.08); } 20% { transform: scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }

#cr-consiglio {
  position: absolute; left: 50%; bottom: calc(var(--sotto) + 132px); transform: translateX(-50%); width: max-content; max-width: min(320px, calc(100% - 40px));
  text-align: center; font-size: 16px; line-height: 1.3; font-weight: 800; padding: 10px 16px; border-radius: 18px;
  background: rgba(8, 20, 48, .78); box-shadow: inset 0 0 0 2px rgba(53, 224, 200, .8); opacity: 0; transition: opacity .3s;
}
#cr-consiglio.visibile { opacity: 1; }

/* ----- Avvisi a comparsa ----- */
#avvisi { position: fixed; left: 0; right: 0; top: calc(var(--sopra) + 70px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 30; padding: 0 14px; }
#avvisi.in-partita { top: calc(var(--sopra) + 138px); }
.avviso {
  max-width: 340px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 16px; font-size: 14px; line-height: 1.25; font-weight: 800;
  background: rgba(10, 26, 60, .92); box-shadow: inset 0 0 0 1.5px rgba(255, 224, 102, .8), 0 6px 18px rgba(0, 0, 0, .4); animation: avviso var(--durata, 3s) ease-out both;
}
.avviso small { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
.avviso .segno { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--oro); color: #3a2400; font-size: 15px; font-weight: 900; }
.avviso.scoperta { box-shadow: inset 0 0 0 1.5px rgba(53, 224, 200, .8), 0 6px 18px rgba(0, 0, 0, .4); } .avviso.scoperta .segno { background: var(--acqua); color: #06303a; }
@keyframes avviso { 0% { opacity: 0; transform: translateY(-14px) scale(.9); } 8% { opacity: 1; transform: none; } 88% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

#attesa { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 40; font-size: 26px; font-weight: 900; background: rgba(6, 16, 40, .8); text-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
#attesa.visibile { display: flex; }

@media (prefers-reduced-motion: reduce) { #cr-annuncio.vai, .avviso { animation-timing-function: step-end; } }

</style>
<style>
/* css/10-schermate.css */
/* Boccone — schermate: casa, mappa, negozio, acquario, traguardi, impostazioni, aiuto, pausa, risultato. */
#schermate { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
.schermata {
  position: absolute; inset: 0; display: none; flex-direction: column; pointer-events: auto;
  background: radial-gradient(ellipse at center, rgba(6, 16, 40, .8), rgba(6, 16, 40, .93));
}
.schermata.visibile { display: flex; }
/* Pausa e risultato lasciano intravedere la partita; la casa lascia vedere di più l'acquario che nuota dietro. */
#s-pausa, #s-risultato { background: radial-gradient(ellipse at center, rgba(6, 16, 40, .62), rgba(6, 16, 40, .9)); }
#s-casa { background: linear-gradient(180deg, rgba(6, 16, 40, .34), rgba(6, 16, 40, .5) 38%, rgba(6, 16, 40, .78)); }
#s-casa .sottotitolo { text-shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 3px 14px rgba(4, 12, 34, .8); }
.testata { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(var(--sopra) + 10px) calc(var(--dx) + 12px) 8px calc(var(--sx) + 12px); }
.testata h2 { flex: 1; min-width: 0; margin: 0; font-size: 24px; line-height: 1.1; font-weight: 900; text-shadow: 0 3px 0 rgba(0, 0, 0, .35); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.testata .tondo { background: rgba(255, 255, 255, .12); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .25); font-size: 24px; line-height: 1; padding-bottom: 3px; }
.corpo { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; padding: 4px calc(var(--dx) + 14px) calc(var(--sotto) + 22px) calc(var(--sx) + 14px); }
.colonna { max-width: 430px; width: 100%; margin: 0 auto; }
.centro { display: flex; flex-direction: column; justify-content: center; min-height: 100%; box-sizing: border-box; text-align: center; }
.piede { flex: none; padding: 10px calc(var(--dx) + 14px) calc(var(--sotto) + 14px) calc(var(--sx) + 14px); background: rgba(6, 16, 40, .82); box-shadow: 0 -1.5px 0 rgba(255, 255, 255, .14); }

h1 { font-size: 58px; line-height: 1; margin: 0 0 4px; font-weight: 900; letter-spacing: -1.5px; color: var(--acqua); text-shadow: 0 4px 0 #0b6f7a, 0 12px 26px rgba(0, 0, 0, .5); }
h2.titolo { font-size: 30px; line-height: 1.1; margin: 0 0 10px; font-weight: 900; text-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; opacity: .75; text-align: left; font-weight: 900; }
p { margin: 0 0 12px; font-size: 16px; line-height: 1.4; }
.piccolo { font-size: 13.5px; line-height: 1.35; opacity: .82; }

.grande {
  width: 100%; border-radius: 20px; padding: 14px 18px; font-size: 21px; line-height: 1.15; font-weight: 900; color: #06303a;
  background: linear-gradient(#5ff0dc, #22c9b6); box-shadow: 0 6px 0 #0b7f86, 0 14px 26px rgba(0, 0, 0, .4);
}
.grande small { display: block; font-size: 13px; font-weight: 800; opacity: .8; }
.grande:active { transform: translateY(4px); box-shadow: 0 2px 0 #0b7f86, 0 6px 12px rgba(0, 0, 0, .4); }
.grande:disabled { filter: grayscale(.9); opacity: .55; }
.medio { width: 100%; margin-top: 12px; border-radius: 16px; padding: 12px 12px; font-size: 16px; line-height: 1.15; font-weight: 800; background: rgba(255, 255, 255, .12); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .25); position: relative; }
.medio small { display: block; font-size: 12px; font-weight: 700; opacity: .75; margin-top: 2px; }
.medio:active { transform: scale(.97); }
.medio:disabled { opacity: .5; }
.medio.oro { color: #3a2400; background: linear-gradient(#ffe98a, #ffc93b); box-shadow: 0 4px 0 #b9860f; }
.medio.pericolo { color: #ffd0d6; box-shadow: inset 0 0 0 1.5px rgba(255, 92, 122, .7); }
.coppia { display: flex; gap: 10px; } .coppia > * { flex: 1; min-width: 0; }
.borsa { display: inline-flex; align-items: center; gap: 7px; font-weight: 900; font-size: 17px; padding: 7px 14px; border-radius: 18px; background: rgba(255, 255, 255, .12); white-space: nowrap; flex: none; }
.pallino { position: absolute; top: -6px; right: -4px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 11px; background: var(--rosa); color: #fff; font-size: 13px; font-weight: 900; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
.stelle { font-size: 22px; letter-spacing: 3px; color: var(--oro); white-space: nowrap; } .stelle i { font-style: normal; color: rgba(255, 255, 255, .25); }
.numero { font-size: 42px; font-weight: 900; color: var(--oro); margin: 2px 0 10px; text-shadow: 0 3px 0 rgba(0, 0, 0, .35); }

/* ----- Casa ----- */
#s-casa .sottotitolo { font-size: 16px; margin-bottom: 14px; opacity: .95; }
#s-casa .borsa { margin-bottom: 14px; }
.regalo { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin: 0 0 14px; padding: 10px 14px; border-radius: 18px; color: #3a2400; background: linear-gradient(#ffe98a, #ffc93b); box-shadow: 0 4px 0 #b9860f, 0 10px 20px rgba(0, 0, 0, .35); font-size: 16px; font-weight: 900; line-height: 1.2; }
.regalo small { display: block; font-size: 12.5px; font-weight: 800; opacity: .8; }
.regalo .fiocco { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255, 255, 255, .55); }
.regalo:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9860f; }
.regalo.preso { color: #fff; background: rgba(255, 255, 255, .1); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .2); }
.giorni { display: flex; gap: 3px; margin-top: 4px; } .giorni i { width: 14px; height: 5px; border-radius: 3px; background: rgba(58, 36, 0, .25); } .giorni i.on { background: #b9580f; }
.regalo.preso .giorni i { background: rgba(255, 255, 255, .2); } .regalo.preso .giorni i.on { background: var(--oro); }

/* ----- Mappa ----- */
.ambiente { border-radius: 20px; padding: 12px 12px 14px; margin-bottom: 12px; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .2); position: relative; overflow: hidden; }
.ambiente .capo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ambiente strong { font-size: 18px; font-weight: 900; text-shadow: 0 2px 3px rgba(0, 0, 0, .45); }
.ambiente .conto { flex: none; font-size: 13px; font-weight: 900; color: var(--oro); text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.ambiente .riga-desc { font-size: 13px; line-height: 1.3; margin: 2px 0 10px; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); opacity: .95; }
.ambiente.chiuso { filter: saturate(.35); opacity: .7; }
.livelli { display: flex; justify-content: space-between; gap: 6px; }
.livello { flex: 1; min-width: 0; max-width: 64px; padding: 6px 0 5px; border-radius: 16px; background: rgba(8, 20, 48, .55); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28); font-weight: 900; }
.livello b { display: block; font-size: 20px; line-height: 1.2; }
.livello span { display: block; font-size: 11px; letter-spacing: 1px; color: var(--oro); line-height: 1.2; } .livello span i { font-style: normal; color: rgba(255, 255, 255, .28); }
.livello.gigante b::after { content: " ♛"; font-size: 13px; color: var(--oro); }
.livello.scelto { background: rgba(53, 224, 200, .28); box-shadow: inset 0 0 0 2.5px var(--acqua); }
.livello.chiuso { opacity: .45; }
.livello:active { transform: scale(.94); }
#s-mappa .piede strong { display: block; font-size: 17px; font-weight: 900; }
#s-mappa .piede .piccolo { margin: 2px 0 10px; min-height: 36px; }

/* ----- Negozio ----- */
.voce { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; margin-bottom: 8px; border-radius: 16px; background: rgba(255, 255, 255, .08); }
.voce > div { flex: 1; min-width: 0; } .voce strong { display: block; font-size: 16px; } .voce small { display: block; font-size: 12.5px; line-height: 1.3; opacity: .82; }
.voce em { font-style: normal; color: var(--acqua); font-weight: 800; }
.tacche { margin-top: 5px; display: flex; gap: 4px; } .tacche i { width: 16px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .2); } .tacche i.on { background: var(--acqua); }
.compra { flex: none; min-width: 84px; border-radius: 14px; padding: 9px 10px; font-size: 15px; font-weight: 900; color: #3a2400; background: linear-gradient(#ffe98a, #ffc93b); box-shadow: 0 4px 0 #b9860f; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.compra:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9860f; }
.compra:disabled { filter: grayscale(1); opacity: .55; }
.compra.fatto { background: rgba(255, 255, 255, .14); color: #fff; box-shadow: none; filter: none; opacity: .85; }
.compra.scegli { color: #06303a; background: linear-gradient(#5ff0dc, #22c9b6); box-shadow: 0 4px 0 #0b7f86; }
.eroe { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px 8px 8px; margin-bottom: 8px; border-radius: 18px; background: rgba(255, 255, 255, .08); }
.eroe.scelto { box-shadow: inset 0 0 0 2.5px var(--acqua); background: rgba(53, 224, 200, .14); }
.eroe canvas { flex: none; width: 84px; height: 72px; display: block; }
.eroe > div { flex: 1; min-width: 0; } .eroe strong { display: block; font-size: 17px; } .eroe small { display: block; font-size: 12.5px; line-height: 1.3; opacity: .85; }

/* ----- Acquario ----- */
.vasca { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.specie { padding: 6px 4px 8px; border-radius: 16px; background: rgba(255, 255, 255, .08); font-size: 12px; line-height: 1.2; font-weight: 800; min-width: 0; }
.specie canvas { width: 100%; height: 62px; display: block; margin-bottom: 3px; }
.specie span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 2.4em; padding: 0 2px; overflow-wrap: anywhere; }
.specie.ignota { color: rgba(255, 255, 255, .5); }
.specie.gigante { box-shadow: inset 0 0 0 1.5px rgba(255, 224, 102, .55); }
.specie:active { transform: scale(.96); }
.scheda-velo { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: calc(var(--sopra) + 16px) 18px calc(var(--sotto) + 16px); background: rgba(4, 10, 28, .78); z-index: 2; }
.scheda-velo.visibile { display: flex; }
.scheda { width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; touch-action: pan-y; box-sizing: border-box; border-radius: 24px; padding: 16px 18px 18px; text-align: center; background: linear-gradient(#17407e, #0b2350); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .25), 0 18px 40px rgba(0, 0, 0, .5); }
.scheda canvas { width: 100%; height: 170px; display: block; border-radius: 16px; margin-bottom: 10px; background: radial-gradient(ellipse at 50% 30%, rgba(120, 210, 255, .35), rgba(8, 20, 48, .2)); }
.scheda h2 { margin: 0 0 6px; font-size: 24px; font-weight: 900; }
.scheda .dove { font-size: 13px; font-weight: 800; color: var(--acqua); margin-bottom: 8px; }
.conti { display: flex; gap: 8px; margin: 10px 0 14px; } .conti div { flex: 1; padding: 8px 4px; border-radius: 14px; background: rgba(255, 255, 255, .1); font-size: 12.5px; font-weight: 800; } .conti b { display: block; font-size: 22px; color: var(--oro); }

/* ----- Traguardi ----- */
.traguardo { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; margin-bottom: 8px; border-radius: 16px; background: rgba(255, 255, 255, .08); }
.traguardo > div { flex: 1; min-width: 0; } .traguardo strong { display: block; font-size: 15.5px; } .traguardo small { display: block; font-size: 12.5px; line-height: 1.3; opacity: .82; }
.traguardo.fatto { background: rgba(255, 224, 102, .16); box-shadow: inset 0 0 0 1.5px rgba(255, 224, 102, .5); }
.traguardo.riscosso { opacity: .6; }
.misura { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 11.5px; font-weight: 800; opacity: .9; white-space: nowrap; }
.misura i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .18); overflow: hidden; } .misura i b { display: block; height: 100%; border-radius: 3px; background: var(--acqua); }
.premio { flex: none; min-width: 70px; text-align: center; font-size: 14px; font-weight: 900; color: var(--oro); white-space: nowrap; }

/* ----- Impostazioni ----- */
.scelta { display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 12px; margin-bottom: 8px; border-radius: 16px; background: rgba(255, 255, 255, .08); }
.scelta > div:first-child { flex: 1; min-width: 0; } .scelta strong { display: block; font-size: 16px; } .scelta small { display: block; font-size: 12.5px; line-height: 1.3; opacity: .8; }
.scelta.pila { display: block; } .scelta.pila .opzioni { margin-top: 8px; }
.interruttore { flex: none; width: 58px; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, .2); position: relative; transition: background .15s; }
.interruttore::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 2px 5px rgba(0, 0, 0, .35); }
.interruttore.acceso { background: #22c9b6; } .interruttore.acceso::after { transform: translateX(24px); }
.opzioni { display: flex; gap: 5px; } .opzioni button { flex: 1; min-width: 0; padding: 9px 2px; border-radius: 12px; font-size: 14px; font-weight: 800; background: rgba(255, 255, 255, .12); }
.opzioni button.scelto { background: #22c9b6; color: #06303a; }

/* ----- Aiuto ----- */
.elenco { list-style: none; padding: 0; margin: 10px 0; text-align: left; font-size: 14px; line-height: 1.32; }
.elenco li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; margin-bottom: 6px; border-radius: 14px; background: rgba(255, 255, 255, .08); }
.elenco li.fatto { background: rgba(124, 242, 154, .16); } .elenco li.mancato { opacity: .6; }
.elenco li > b { flex: none; width: 22px; text-align: center; color: #7cf29a; font-size: 18px; } .elenco li.mancato > b { color: rgba(255, 255, 255, .4); }
.regole li > b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: #0a1f44; }
.regole li > b.verde { background: #7cf29a; } .regole li > b.rosso { background: #ff7b7b; } .regole li > b.giallo { background: var(--oro); } .regole li > b.grigio { background: #c3ccdc; }

/* ----- Pausa e risultato ----- */
#s-risultato .stelle { font-size: 48px; margin: 0 0 6px; }
#s-risultato .stelle b { display: inline-block; animation: stella .5s cubic-bezier(.2, 1.6, .4, 1) both; } #s-risultato .stelle b:nth-child(2) { animation-delay: .25s; } #s-risultato .stelle b:nth-child(3) { animation-delay: .5s; }
@keyframes stella { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 100% { transform: none; opacity: 1; } }

@media (max-height: 620px) {
  h1 { font-size: 46px; } .grande { padding: 11px 16px; font-size: 19px; } .medio { margin-top: 9px; padding: 10px 10px; }
  #s-risultato .stelle { font-size: 40px; } .numero { font-size: 34px; }
}

<script>
/* Boccone — nucleo: spazio dei nomi B, utilità, eventi e registri dei contenuti.
   Nessuna dipendenza. Tutti gli altri file partono da qui (vedi ARCHITETTURA.md). */
(() => {
'use strict';
const B = window.B = window.B || {};
const TAU = Math.PI * 2;

// ---------------------------------------------------------------- utilità
B.util = {
  TAU,
  caso: (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a),
  intero: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  limita: (v, a, b) => v < a ? a : v > b ? b : v,
  scegli: lista => lista[Math.floor(Math.random() * lista.length)],
  lerp: (a, b, t) => a + (b - a) * t,
  dolce: t => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); },
  differenzaAngolo: (da, a) => ((a - da + Math.PI * 3) % TAU) - Math.PI,
  /* Generatore casuale ripetibile: const caso = B.util.semi(42); caso() → [0,1) */
  semi(seme) {
    let s = (seme >>> 0) || 1;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },
  /* Numero fisso in [0,1) a partire da un indice: per variare i dettagli di un modello senza Math.random. */
  rumore(i, seme = 0) {
    let h = (Math.imul((i | 0) + 1, 0x9E3779B1) ^ Math.imul((seme | 0) + 7, 0x85EBCA6B)) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 0x2C1B3C6D) >>> 0; h = Math.imul(h ^ (h >>> 12), 0x297A2D39) >>> 0;
    return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
  },
  /* Numeri per il giocatore: interi con i puntini fino al milione, poi abbreviati (mln, mld, bilioni… ogni nome vale
     mille volte il precedente; oltre i triliardi, la potenza di dieci). */
  numero: n => {
    if (!(n >= 1e6)) return Math.round(n || 0).toLocaleString('it-IT');
    const sigle = [[1e21, ' triliardi'], [1e18, ' trilioni'], [1e15, ' biliardi'], [1e12, ' bilioni'], [1e9, ' mld'], [1e6, ' mln']];
    if (n >= 1e24) { const e = Math.floor(Math.log10(n)); return (n / Math.pow(10, e)).toFixed(1).replace('.', ',') + '×10^' + e; }
    for (const [soglia, sigla] of sigle) if (n >= soglia) { const v = n / soglia; return (v >= 100 ? Math.round(v).toLocaleString('it-IT') : v.toFixed(1).replace('.', ',')) + sigla; }
  },
  tela(w, h) { const t = document.createElement('canvas'); t.width = Math.max(1, Math.round(w)); t.height = Math.max(1, Math.round(h)); return t; },
};

// ---------------------------------------------------------------- eventi
const ascoltatori = new Map();
B.eventi = {
  su(nome, fn) { if (!ascoltatori.has(nome)) ascoltatori.set(nome, new Set()); ascoltatori.get(nome).add(fn); return () => B.eventi.via(nome, fn); },
  via(nome, fn) { const s = ascoltatori.get(nome); if (s) s.delete(fn); },
  emetti(nome, dati) {
    const s = ascoltatori.get(nome); if (!s) return;
    for (const fn of [...s]) { try { fn(dati); } catch (e) { console.error('[Boccone] errore in un ascoltatore di "' + nome + '"', e); } }
  },
};

// ---------------------------------------------------------------- registri
const ID_VALIDO = /^[a-z][a-z0-9_]*$/;
function schedaCast(elenco, id) { return (B.cast && B.cast[elenco] || []).find(v => v.id === id) || null; }

function registro(etichetta, elencoCast, completa) {
  const mappa = new Map();
  return {
    /* Registra una definizione. I campi mancanti si ereditano dalla scheda con lo stesso id in B.cast.
       Una definizione vera sostituisce sempre una provvisoria (provvisoria: true), mai il contrario. */
    registra(def) {
      if (!def || typeof def !== 'object') throw new Error(etichetta + ': la definizione deve essere un oggetto');
      if (!ID_VALIDO.test(def.id || '')) throw new Error(etichetta + ': id non valido "' + def.id + '" (solo minuscole, cifre e _)');
      const scheda = schedaCast(elencoCast, def.id);
      if (!scheda && !def.provvisoria) console.warn('[Boccone] ' + etichetta + ' "' + def.id + '" non è nel cast (01-cast.js)');
      const pieno = completa(Object.assign({}, scheda || {}, def), etichetta);
      const gia = mappa.get(pieno.id);
      if (gia && !gia.provvisoria && pieno.provvisoria) return gia;
      if (gia && !gia.provvisoria && !pieno.provvisoria) console.warn('[Boccone] ' + etichetta + ' "' + pieno.id + '" registrato due volte: vale l\'ultimo');
      mappa.set(pieno.id, pieno);
      return pieno;
    },
    prendi: id => mappa.get(id) || null,
    ha: id => mappa.has(id),
    tutte: () => [...mappa.values()],
  };
}

function pretendi(cond, messaggio) { if (!cond) throw new Error(messaggio); }

const TIPI = ['pesce', 'gigante', 'banco', 'pericolo'];
B.specie = registro('specie', 'specie', (d, e) => {
  d.tipo = d.tipo || 'pesce';
  pretendi(TIPI.includes(d.tipo), e + ' ' + d.id + ': tipo sconosciuto "' + d.tipo + '"');
  pretendi(typeof d.disegna === 'function', e + ' ' + d.id + ': manca disegna(c, o)');
  pretendi(typeof d.nome === 'string' && d.nome, e + ' ' + d.id + ': manca il nome');
  d.plurale = d.plurale || d.nome;
  d.forma = Object.assign({ lx: 1.2, ly: 0.8 }, d.forma || {});
  if (!d.ingombro) d.ingombro = { x0: -(d.forma.lx + 1.1), y0: -(d.forma.ly + 0.9), x1: d.forma.lx + 0.5, y1: d.forma.ly + 0.9 };
  d.assetto = d.assetto || 'libero';
  d.indole = d.indole || 'cacciatore';
  d.ambienti = d.ambienti || [];
  d.fotogrammi = d.fotogrammi || 8;
  if (d.tipo === 'pesce') pretendi(d.taglia >= 1 && d.taglia <= 5, e + ' ' + d.id + ': taglia deve essere tra 1 e 5');
  return d;
});
B.specie.diTipo = tipo => B.specie.tutte().filter(s => s.tipo === tipo);

B.eroi = registro('eroe', 'eroi', (d, e) => {
  pretendi(typeof d.disegna === 'function', e + ' ' + d.id + ': manca disegna(c, o)');
  pretendi(typeof d.nome === 'string' && d.nome, e + ' ' + d.id + ': manca il nome');
  d.stadi = d.stadi || 3;
  d.costo = d.costo || 0;
  d.effetti = d.effetti || {};
  if (!d.ingombro) d.ingombro = { x0: -2.2, y0: -1.6, x1: 1.5, y1: 1.6 };
  return d;
});

B.ambienti = registro('ambiente', 'ambienti', (d, e) => {
  for (const f of ['crea', 'sfondo', 'dietro', 'davanti', 'velo']) pretendi(typeof d[f] === 'function', e + ' ' + d.id + ': manca ' + f + '()');
  pretendi(typeof d.nome === 'string' && d.nome, e + ' ' + d.id + ': manca il nome');
  d.mondo = Object.assign({ w: 2600, h: 2600 }, d.mondo || {});
  d.colori = d.colori || {};
  d.banchi = d.banchi || []; d.pericoli = d.pericoli || [];
  return d;
});
B.ambienti.inOrdine = () => B.ambienti.tutte().sort((a, b) => (a.ordine || 99) - (b.ordine || 99));
})();

//# sourceURL=boccone/js/00-nucleo.js
</script>

<script>
/* Boccone — progressi: l'unica porta verso il salvataggio (vedi ARCHITETTURA.md §6).
   Tiene perle, potenziamenti, eroi, livelli e stelle, acquario, statistiche, traguardi, regalo del giorno e impostazioni.
   Ascolta gli eventi del gioco e aggiorna da solo statistiche, acquario e traguardi.

   Che cosa c'è nel salvataggio (B.progressi.stato, chiave "boccone-salvataggio-3"):
     versione        3
     perle           quante perle ho adesso
     potenziamenti   { id: livello }
     eroe, eroi      l'eroe scelto e { id: true } per quelli comprati
     livelloMax      il livello più avanti che si può giocare (totale + 1 quando l'avventura è finita)
     stelle          { numeroLivello: 1..3 }
     record          { potenza, tempo } della sopravvivenza (i due massimi, anche di partite diverse)
     acquario        { idSpecie: { visti, mangiati } }
     statistiche     i contatori elencati in statistichePredefinite()
     traguardi       { id: { fatto, riscosso } } (solo quelli raggiunti)
     regalo          { ultimo: 'AAAA-MM-GG', serie }
     impostazioni    { suoni, musica, vibrazione, qualita, mano }
     tutorial        true quando i consigli della prima partita sono stati visti
     importatoV2     true quando i dati della versione precedente sono già stati presi (o non c'erano)

   Il file si può caricare anche senza pagina (niente document, niente localStorage): in quel caso resta tutto in memoria. */
(() => {
'use strict';
const B = window.B;

// ---------------------------------------------------------------- costanti
const CHIAVE = 'boccone-salvataggio-3', CHIAVE_V2 = 'boccone-salvataggio', VERSIONE = 3;
const PAUSA_SCRITTURA = 2000;            // millisecondi: durante la partita non si scrive più spesso di così
const PERLE_MAX = 99999999;
const ACQUARIO_MAX = 400;                // tetto alle voci dell'acquario (le specie vere sono meno di cento)
const LIVELLO_SOPRAVVIVENZA = 5;         // superato questo livello si apre la sopravvivenza
const PREMI_REGALO = [20, 30, 40, 50, 60, 80, 120];
const TIPI_AIUTO = ['x2', 'x5', 'calamita', 'scudo', 'perla', 'cuore'];
const TIPI_SPECIE = ['pesce', 'gigante', 'banco', 'pericolo'];
const ID_VALIDO = /^[a-z][a-z0-9_]{0,39}$/;
const DATA = /^(\d{4})-(\d{2})-(\d{2})$/;

const cast = B.cast || {};
const AMBIENTI = (cast.ambienti || []).slice().sort((a, b) => (a.ordine || 99) - (b.ordine || 99));
const EROI = cast.eroi || [];
/* I livelli dell'avventura sono quelli degli ambienti giocabili (B.cast.aperti); se l'elenco manca, di tutti. */
const APERTI = Array.isArray(cast.aperti) && cast.aperti.length ? cast.aperti.filter(id => AMBIENTI.some(a => a.id === id)) : AMBIENTI.map(a => a.id);
const TOTALE_LIVELLI = Math.max(1, APERTI.length * (cast.livelliPerAmbiente || 5));
const EROE_BASE = (EROI.find(e => e.id === 'pallino') || EROI.find(e => !(e.costo > 0)) || { id: 'pallino' }).id;

// ---------------------------------------------------------------- piccoli attrezzi
const ha = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
const eOggetto = v => v !== null && typeof v === 'object' && !Array.isArray(v);
/* Intero non negativo: tutto ciò che non è un numero sensato diventa 0. */
const conta = (v, massimo = Number.MAX_SAFE_INTEGER) => typeof v === 'number' && v > 0 ? Math.min(Math.floor(v), massimo) : 0;
/* Misura non negativa, anche con la virgola (tempi, potenze). */
const misura = v => typeof v === 'number' && v > 0 && v < Infinity ? v : 0;
const pulito = x => Math.round(x * 10000) / 10000;
/* Somma che non esce mai dai numeri interi sicuri: così ciò che si salva si rilegge sempre uguale. */
const somma = (a, b) => Math.min(Number.MAX_SAFE_INTEGER, a + b);

function dataValida(s) {
  const m = typeof s === 'string' ? DATA.exec(s) : null;
  return !!m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31;
}
/* Giorni di calendario da una data all'altra (stringhe AAAA-MM-GG); null se una delle due non è una data. */
function giorniTra(da, a) {
  if (!dataValida(da) || !dataValida(a)) return null;
  const x = DATA.exec(da), y = DATA.exec(a);
  return Math.round((Date.UTC(+y[1], +y[2] - 1, +y[3]) - Date.UTC(+x[1], +x[2] - 1, +x[3])) / 86400000);
}

// ---------------------------------------------------------------- potenziamenti
const percento = passo => liv => (passo < 0 ? '−' : '+') + Math.round(Math.abs(passo) * liv * 100) + '%';
const secondi = passo => liv => '+' + String(Math.round(passo * liv * 10) / 10).replace('.', ',') + ' s';
/* effetto: il campo di effetti() che cambia; passo: di quanto, a ogni livello; beneficio(liv): la scritta per il negozio. */
const POTENZIAMENTI = [
  { id: 'pinne',    nome: 'Pinne veloci',       descrizione: 'Nuoti più in fretta.',                  costi: [40, 90, 160, 260, 400],  effetto: 'velocita',       passo: 0.06,  beneficio: percento(0.06) },
  { id: 'scatto',   nome: 'Scatto pronto',      descrizione: 'Lo scatto si ricarica prima.',          costi: [40, 90, 160, 260, 400],  effetto: 'ricaricaScatto', passo: -0.12, beneficio: percento(-0.12) },
  { id: 'boccone',  nome: 'Boccone largo',      descrizione: 'Risucchi i pesciolini da più lontano.', costi: [50, 110, 190, 300, 450], effetto: 'risucchio',      passo: 0.30,  beneficio: percento(0.30) },
  { id: 'generoso', nome: 'Mare generoso',      descrizione: 'Compaiono più bolle con gli aiuti.',    costi: [60, 130, 220],           effetto: 'bolle',          passo: 0.17,  beneficio: percento(0.17) },
  { id: 'cuori',    nome: 'Cuore in più',       descrizione: 'Parti con un cuore in più.',            costi: [200, 500],               effetto: 'cuori',          passo: 1,     beneficio: liv => '+' + liv },
  { id: 'calamita', nome: 'Calamita potente',   descrizione: 'La calamita dura di più.',              costi: [80, 170, 300],           effetto: 'durataCalamita', passo: 2,     beneficio: secondi(2) },
  { id: 'frenesia', nome: 'Frenesia lunga',     descrizione: 'La frenesia dura di più.',              costi: [100, 220, 380],          effetto: 'durataFrenesia', passo: 1.5,   beneficio: secondi(1.5) },
  { id: 'fiuto',    nome: 'Fiuto per le perle', descrizione: 'Trovi più perle.',                      costi: [120, 260, 480],          effetto: 'perle',          passo: 0.15,  beneficio: percento(0.15) },
  { id: 'scudo',    nome: 'Scudo di partenza',  descrizione: 'Cominci ogni partita con lo scudo.',    costi: [350],                    effetto: 'scudoIniziale',  passo: 1,     beneficio: liv => liv > 0 ? 'pronto' : '' },
];
const POT = {};
for (const p of POTENZIAMENTI) POT[p.id] = p;

const MOLTIPLICATORI = ['velocita', 'ricaricaScatto', 'durataScatto', 'risucchio', 'bolle', 'perle', 'morso'];
const AGGIUNTE = ['cuori', 'durataCalamita', 'durataFrenesia', 'invulnerabile'];

// ---------------------------------------------------------------- impostazioni
const scelta = (predefinito, ammessi) => ({ predefinito, valido: v => ammessi.includes(v) });
const IMPOSTAZIONI = {
  suoni: scelta(true, [true, false]),
  musica: scelta(true, [true, false]),
  vibrazione: scelta(true, [true, false]),
  qualita: scelta('auto', ['auto', 'alta', 'media', 'bassa']),
  mano: scelta('destra', ['destra', 'sinistra']),
};

// ---------------------------------------------------------------- lo stato e i suoi valori predefiniti
const S = {};                            // sempre lo stesso oggetto, anche dopo azzera(): chi se lo tiene da parte non resta indietro
let P = null;                            // B.progressi (definito più sotto)

function statistichePredefinite() {
  return {
    partite: 0, partiteSopravvivenza: 0, vittorie: 0, sconfitte: 0, vittorieSenzaColpi: 0,
    pesciMangiati: 0, pesciolini: 0, dorati: 0,
    perleTotali: 0, perleSpese: 0,
    colpiPresi: 0, frenesie: 0, scatti: 0, crescite: 0,
    aiuti: { x2: 0, x5: 0, calamita: 0, scudo: 0, perla: 0, cuore: 0, altro: 0 },
    gigantiSconfitti: 0, morsiGiganti: 0,
    potenzaMassima: 0, tempoGioco: 0, stelle: 0,
    regali: 0, serieMassima: 0,
  };
}

function predefinito() {
  const potenziamenti = {}, eroi = {}, impostazioni = {};
  for (const p of POTENZIAMENTI) potenziamenti[p.id] = 0;
  eroi[EROE_BASE] = true;
  for (const k of Object.keys(IMPOSTAZIONI)) impostazioni[k] = IMPOSTAZIONI[k].predefinito;
  return {
    versione: VERSIONE, perle: 0, potenziamenti, eroe: EROE_BASE, eroi,
    livelloMax: 1, stelle: {}, record: { potenza: 0, tempo: 0 },
    acquario: {}, statistiche: statistichePredefinite(), traguardi: {},
    regalo: { ultimo: '', serie: 0 }, impostazioni, tutorial: false, importatoV2: false,
  };
}

const schedaEroe = id => EROI.find(e => e.id === id) || null;
function possiede(stato, id) {
  const e = schedaEroe(id);
  return !!e && (id === EROE_BASE || !(e.costo > 0) || (ha(stato.eroi, id) && stato.eroi[id] === true));
}

function livelloValido(n) { return Number.isInteger(n) && n >= 1 && n <= TOTALE_LIVELLI; }

/* Da ciò che si è letto (qualunque cosa sia) a uno stato sano: i campi rovinati tornano ai valori predefiniti,
   quelli buoni restano, quelli che questa versione non conosce si conservano così come sono. */
function ripulisci(letto) {
  const s = predefinito();
  if (!eOggetto(letto)) return s;
  for (const k of Object.keys(letto)) if (!ha(s, k)) s[k] = letto[k];
  s.perle = conta(letto.perle, PERLE_MAX);

  if (eOggetto(letto.potenziamenti)) for (const k of Object.keys(letto.potenziamenti)) {
    const v = conta(letto.potenziamenti[k], 99);
    if (ha(POT, k)) s.potenziamenti[k] = Math.min(v, POT[k].costi.length); else if (ID_VALIDO.test(k)) s.potenziamenti[k] = v;
  }

  if (eOggetto(letto.eroi)) for (const k of Object.keys(letto.eroi)) if (ID_VALIDO.test(k) && letto.eroi[k] === true) s.eroi[k] = true;
  if (typeof letto.eroe === 'string' && possiede(s, letto.eroe)) s.eroe = letto.eroe;

  if (eOggetto(letto.stelle)) for (const k of Object.keys(letto.stelle)) {
    const n = Number(k), v = conta(letto.stelle[k], 3);
    if (livelloValido(n) && v > 0) s.stelle[n] = v;
  }
  s.livelloMax = Math.min(conta(letto.livelloMax) || 1, TOTALE_LIVELLI + 1);
  for (const k of Object.keys(s.stelle)) s.livelloMax = Math.max(s.livelloMax, Number(k) + 1);   // un livello con le stelle è superato

  if (eOggetto(letto.record)) s.record = { potenza: Math.round(misura(letto.record.potenza)), tempo: pulito(misura(letto.record.tempo)) };
  else if (typeof letto.record === 'number') s.record.potenza = Math.round(misura(letto.record));

  if (eOggetto(letto.acquario)) {
    let voci = 0;
    for (const k of Object.keys(letto.acquario)) {
      const v = letto.acquario[k];
      if (voci >= ACQUARIO_MAX || !ID_VALIDO.test(k) || !eOggetto(v)) continue;
      const visti = conta(v.visti), mangiati = conta(v.mangiati);
      if (!visti && !mangiati) continue;
      s.acquario[k] = { visti: Math.max(visti, 1), mangiati }; voci++;
    }
  }

  if (eOggetto(letto.statistiche)) {
    const da = letto.statistiche, a = s.statistiche;
    for (const k of Object.keys(da)) {
      if (k === 'aiuti') { if (eOggetto(da.aiuti)) for (const t of Object.keys(da.aiuti)) if (ha(a.aiuti, t)) a.aiuti[t] = conta(da.aiuti[t]); }
      else if (!ha(a, k)) a[k] = da[k];
      else if (k === 'tempoGioco') a[k] = pulito(misura(da[k]));
      else a[k] = conta(da[k]);
    }
  }
  s.statistiche.stelle = sommaStelle(s);

  if (eOggetto(letto.traguardi)) for (const k of Object.keys(letto.traguardi)) {
    const v = letto.traguardi[k];
    if (ID_VALIDO.test(k) && eOggetto(v) && (v.fatto === true || v.riscosso === true)) s.traguardi[k] = { fatto: true, riscosso: v.riscosso === true };
  }

  if (eOggetto(letto.regalo) && dataValida(letto.regalo.ultimo)) s.regalo = { ultimo: letto.regalo.ultimo, serie: Math.max(1, conta(letto.regalo.serie, 99999)) };

  if (eOggetto(letto.impostazioni)) for (const k of Object.keys(letto.impostazioni)) {
    const v = letto.impostazioni[k];
    if (!ha(IMPOSTAZIONI, k)) s.impostazioni[k] = v; else if (IMPOSTAZIONI[k].valido(v)) s.impostazioni[k] = v;
  }
  s.tutorial = letto.tutorial === true;
  s.importatoV2 = letto.importatoV2 === true;
  return s;
}

function archivio() { try { return window.localStorage || null; } catch (e) { return null; } }
function leggi(chiave) {
  try {
    const a = archivio(); if (!a) return null;
    const testo = a.getItem(chiave);
    if (typeof testo !== 'string' || !testo) return null;
    const v = JSON.parse(testo);
    return eOggetto(v) ? v : null;
  } catch (e) { return null; }
}

let sporco = false, ultimaScrittura = -Infinity, sveglia = null;

function scrivi() {
  if (sveglia !== null) { try { if (typeof clearTimeout === 'function') clearTimeout(sveglia); } catch (e) {} sveglia = null; }
  sporco = false; ultimaScrittura = P._adesso();
  try { const a = archivio(); if (!a) return false; a.setItem(CHIAVE, JSON.stringify(S)); return true; } catch (e) { return false; }
}

/* subito: scrive ora. Altrimenti scrive al massimo una volta ogni PAUSA_SCRITTURA (e l'ultima modifica non va persa). */
function daScrivere(subito) {
  sporco = true;
  if (subito) { scrivi(); return; }
  const attesa = PAUSA_SCRITTURA - (P._adesso() - ultimaScrittura);
  /* attesa più lunga della pausa vuol dire che l'orologio è tornato indietro: si scrive, e si riparte da adesso. */
  if (!(attesa > 0) || attesa > PAUSA_SCRITTURA) { scrivi(); return; }
  if (sveglia === null && typeof setTimeout === 'function') {
    try { sveglia = setTimeout(() => { sveglia = null; scriviSeServe(); }, attesa); } catch (e) { sveglia = null; }
  }
}

/* Il catalogo dice quali specie esistono in questa costruzione del gioco: quelle registrate in B.specie (se ce n'è
   almeno una), altrimenti quelle del cast. Così i traguardi "tutte le specie" restano raggiungibili anche con una parte
   sola dei contenuti. "acquario" sono pesci e giganti: le specie che hanno una scheda con la descrizione. */
let cat = null, der = null;
function catalogo() {
  if (cat) return cat;
  let schede = cast.specie || [];
  try { const registrate = B.specie && typeof B.specie.tutte === 'function' ? B.specie.tutte() : []; if (registrate.length) schede = registrate; } catch (e) {}
  const c = { schede: Object.create(null), pesce: [], gigante: [], banco: [], pericolo: [], acquario: [], perAmbiente: Object.create(null) };
  for (const a of AMBIENTI) c.perAmbiente[a.id] = [];
  for (const s of schede) {
    if (!s || typeof s.id !== 'string' || c.schede[s.id]) continue;
    const tipo = TIPI_SPECIE.includes(s.tipo) ? s.tipo : 'pesce';
    c.schede[s.id] = { id: s.id, nome: s.nome || s.id, tipo };
    const abitante = tipo === 'pesce' || tipo === 'gigante';
    /* Pesci e giganti che vivono solo in ambienti ancora "in arrivo" non si contano: non si possono incontrare. */
    if (abitante && Array.isArray(s.ambienti) && s.ambienti.length && !s.ambienti.some(a => APERTI.includes(a))) continue;
    c[tipo].push(s.id);
    if (!abitante) continue;
    c.acquario.push(s.id);
    for (const a of s.ambienti || []) if (c.perAmbiente[a]) c.perAmbiente[a].push(s.id);
  }
  return cat = c;
}
function tipoDi(id) { const s = typeof id === 'string' ? catalogo().schede[id] : null; return s ? s.tipo : null; }
function elenco(gruppo) {
  const c = catalogo();
  if (gruppo === undefined || gruppo === null || gruppo === 'acquario') return c.acquario;
  if (gruppo === 'tutti') return [...c.pesce, ...c.gigante, ...c.banco, ...c.pericolo];
  if (TIPI_SPECIE.includes(gruppo)) return c[gruppo];
  return typeof gruppo === 'string' && c.perAmbiente[gruppo] ? c.perAmbiente[gruppo] : [];
}
const vista = id => ha(S.acquario, id) && (S.acquario[id].visti > 0 || S.acquario[id].mangiati > 0);
const assaggiata = id => ha(S.acquario, id) && S.acquario[id].mangiati > 0;
function quante(ids, prova) { let n = 0; for (const id of ids) if (prova(id)) n++; return n; }

/* Conti che servono ai traguardi: si rifanno solo quando cambia qualcosa che li tocca (una specie nuova, una stella). */
function derivati() {
  if (der) return der;
  const c = catalogo(), d = { scoperte: quante(c.acquario, vista), assaggiate: quante(c.acquario, assaggiata), giganti: quante(c.gigante, assaggiata), ambienti: Object.create(null), treStelle: 0 };
  for (const a of AMBIENTI) d.ambienti[a.id] = quante(c.perAmbiente[a.id], vista);

}

function verifica(silenzioso) {

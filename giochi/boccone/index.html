<script>
/* Boccone — specie: CAVALLUCCIO MARINO (taglia 1, timido, assetto 'dritto': il motore non lo ruota, lo specchia soltanto).
   Sta in piedi col muso a tubo verso +x: testa da cavallino con la coroncina, collo arcuato, pancia tonda, coda a ricciolo.
   Il corpo è UNA spina costruita per angoli dalla nuca alla punta della coda (così la testa resta ferma e la coda dondola);
   la testa è un pezzo a parte, appoggiato sul collo. Il tratto esagerato sono il muso a trombetta e l'occhione. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, max, min, round } = Math;

// ---- tinte (una volta sola)
const T = { corpo: P.tinta('#ffc21a', '#f0541e'), ventre: P.tinta('#fff1c4', '#f0a05a'), pinna: P.tinta('#27c9c0'), corona: P.tinta('#ff7a2e', '#d02a3a'), labbra: P.tinta('#ff6f8f') };
const ORLO = '#c9fff6', PUNTINI = P.alfa('#fff6d0', .85), FASCIA = P.alfa('#e2401e', .8);
// ---- il corpo: 30 tratti lunghi in tutto 2.7, dalla punta della coda (u = 0) alla nuca (u = 1). SU è la schiena (-x), GIU la pancia (+x)
const NT = 30, LUNG = 2.7, K0 = .44;
const SU = P.sagoma([[0, .028], [.15, .045], [.3, .065], [.44, .1], [.54, .17], [.66, .24], [.8, .26], [.92, .21], [1, .16]]);
const GIU = P.sagoma([[0, .028], [.15, .045], [.3, .065], [.44, .1], [.54, .18], [.64, .36], [.75, .47], [.86, .38], [.94, .24], [1, .17]]);
/* Di quanto la linea di mezzo devia dalla verticale scendendo dalla nuca (k = 0): collo all'indietro, pancia in avanti,
   coda di nuovo indietro; da k = K0 in poi si arrotola in avanti, sempre più stretta (un giro abbondante: di più le spire si
   toccherebbero e il ricciolo diventerebbe una ciambella). */
const PIEGA = [[0, .5], [.08, .28], [.19, -.3], [.28, -.1], [.37, .3], [.44, .1]];
const tab = (l, k) => { let i = 0; while (i < l.length - 2 && k > l[i + 1][0]) i++; const a = l[i], b = l[i + 1], q = max(0, min(1, (k - a[0]) / (b[0] - a[0]))); return a[1] + (b[1] - a[1]) * q * q * (3 - 2 * q); };
const posa = F => {
  const px = [-.05], py = [-.52 + .03 * sin(F)], passo = LUNG / NT, ricciolo = 6.6 * (1 + .03 * sin(F - 1));
  for (let i = 1; i <= NT; i++) {
    const k = (i - .5) / NT, x = (k - K0) / (1 - K0), a = PI / 2 + (k < K0 ? tab(PIEGA, k) : .1 - ricciolo * x * (.1 + .9 * x)) + .06 * k * sin(F - k * 2.5);
    px[i] = px[i - 1] + cos(a) * passo; py[i] = py[i - 1] + sin(a) * passo;
  }
  return P.spina(NT, (u, p) => { const i = round((1 - u) * NT); p.x = px[i]; p.y = py[i]; }, SU, GIU, { coda: .03 });
};
// ---- la testa, nelle sue coordinate (origine al centro del cranio, +x lungo il muso): sagoma, coroncina [x, y, angolo, lunghezza]
const TESTA = [-.34, -.02, -.16, -.33, .13, -.28, .33, -.11, .6, -.09, .8, -.11, .88, 0, .8, .11, .6, .085, .33, .12, .1, .3, -.18, .28];
const CORONA = [[-.28, -.14, -PI / 2 - .95, .19], [-.19, -.25, -PI / 2 - .45, .27], [-.07, -.28, -PI / 2 - .02, .28], [.05, -.25, -PI / 2 + .42, .19]];
const OPERCOLO = [-.14, -.16, -.22, .04, -.13, .2], FASCE = [.46, .63];
/* I nodi ossei che sporgono dalla schiena: tondini della tinta del corpo, tutti in un tracciato. Si disegnano PRIMA del corpo. */
const nodi = (c, p, r, t) => {
  c.beginPath(); for (let i = 0; i < p.length; i += 2) { const rr = r(i / 2); c.moveTo(p[i] + rr, p[i + 1]); c.arc(p[i], p[i + 1], rr, 0, TAU); }
  c.strokeStyle = t.bordo; c.lineWidth = P.BORDO * 1.6; c.stroke(); c.fillStyle = t.chiara; c.fill();
};
const raggioNodo = i => .045 + .005 * i;

B.specie.registra({
  id: 'cavalluccio',
  descrizione: 'Nuota in piedi, piano piano, facendo vibrare la pinna che ha sulla schiena. Con la coda si aggrappa alle alghe per non farsi portare via, e i piccoli li porta nel marsupio il papà.',
  forma: { lx: .55, ly: 1.2 },
  ingombro: { x0: -.94, y0: -1.44, x1: 1.05, y1: 1.38 },
  disegna(c, o) {
    const F = (o.fase || 0) * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};
    c.save();
    const s = posa(F), luce = [.25, -.3, 2.4];

    // ---- 1. dietro al corpo: la pinna della schiena che vibra, i nodi ossei lungo la schiena
    const d0 = P.suSpina(s, .85, -.85), d1 = P.suSpina(s, .67, -.85);
    P.pinna(c, { x0: d0.x, y0: d0.y, x1: d1.x, y1: d1.y, a0: PI + .75 + (m ? .25 : 0), a1: PI - .55 - (m ? .15 : 0), lung: m ? .52 : .43, profilo: [.75, 1, 1, .8], n: 8, smerlo: .35,
      onda: .16, fase: F * 4, passo: 1.1, tinta: T.pinna, orlo: ORLO });
    nodi(c, P.puntiSuSpina(s, 8, .535, .96, -1.06), raggioNodo, T.corpo);

    // ---- 2. il corpo: pancia chiara, puntini, anelli incisi dalla coda al collo
    P.volume(c, s, T.corpo, { luce, ombra: .08, dentro(cc) {
      P.fianco(cc, s, u => .3 + max(0, .66 - u) * 7, 1.4, T.ventre.base, .52, .97);
      P.anelli(cc, s, .05, .96, 16, T.corpo, { spess: .04 });
      if (P.fine(o)) P.macchie(cc, s, { n: 9, seme: 4, u0: .56, u1: .95, v0: -.75, v1: .15, r0: .018, r1: .03, colore: PUNTINI, lungo: 1 });
    } });
    P.suSpina(s, .86, -.1, q); P.riflesso(c, q.x, q.y, .3, q.ang + PI, .12);

    // ---- 3. sul collo: la pinnetta dietro la guancia, che frulla
    const pe = P.suSpina(s, .93, -.3), fr = sin(F * 3) * .18;
    P.pinna(c, { x0: pe.x + .03, y0: pe.y - .08, x1: pe.x - .02, y1: pe.y + .08, a0: PI + .75 + fr, a1: PI - .45 + fr, lung: .25, profilo: [.7, 1, 1, .75], n: 5, smerlo: .3, onda: .12, fase: F * 3,
      tinta: T.pinna, orlo: ORLO, primo: true });

    // ---- 4. la testa appoggiata sul collo: coroncina (a caccia si drizza), cranio e muso a tubo
    const n0 = P.suSpina(s, 1, 0), ha = .4 + .05 * sin(F + 1) + (m ? .1 : 0), hx = n0.x + .06, hy = n0.y - .12, ca = cos(ha), sa = sin(ha);
    P.ombra(c, n0.x + .07, n0.y + .14, .32, .15, .4, .3);
    c.save(); c.translate(hx, hy); c.rotate(ha);
    for (const k of CORONA) P.corno(c, k[0], k[1], k[2] + (m ? .12 : 0), k[3] * (m ? 1.3 : 1), .12, T.corona, { punta: m ? '#ffe14a' : T.corona.luce });
    P.volume(c, cc => P.profilo(cc, TESTA), T.corpo, { luce: [.1, -.3, 1], ombra: .06, dentro(cc) {
      cc.beginPath(); for (const x of FASCE) cc.rect(x, -.2, .05, .4); cc.fillStyle = FASCIA; cc.fill();   // fascette sul tubo
    } });
    P.solco(c, OPERCOLO, T.corpo, .03);
    P.riflesso(c, .56, -.045, .2, 0, .04);
    c.restore();

    // ---- 5. la faccia. Calmo: occhione verde acqua, gota rosa, trombetta chiusa. A caccia: occhio rosso tagliato, sopracciglio, dentini
    const ex = hx + ca * .02 + sa * .05, ey = hy + sa * .02 - ca * .05;
    if (!m) P.guancia(c, hx + ca * .2 - sa * .2, hy + sa * .2 + ca * .2, .12);
    P.occhio(c, ex, ey, .21, Object.assign({ iride: m ? '#ff3a1e' : '#19b89c', pelle: T.corpo, guarda: { x: .5, y: .15 } }, m ? P.SGUARDI.cattivo : P.SGUARDI.normale));
    if (m) P.sopracciglio(c, ex + .05, ey - .21, .48, .55, T.corpo.bordo, .12);
    P.labbra(c, hx + ca * .9, hy + sa * .9, ha, m ? .13 : .115, m ? max(b, .45) : b * .5, T.labbra, { denti: m ? 2 : 0 });
    c.restore();
  },
});
})();

</script>
<script>
/* Boccone — gigante: DON CERNIA, il padrone della laguna. Una cernia colossale bruno-oliva marmorizzata: labbroni carnosi,
   mento sporgente, guancia cadente, sopracciglia folte, coroncina e un dente d'oro.
   Tutti gli stati letti con P.statoGigante. Il segnale da ricordare: labbra rosa = tranquillo; labbra che LAMPEGGIANO ROSSE
   (con un alone rosso attorno alla bocca e le spine del dorso dritte) = sta per aspirare o per caricare. Quando aspira
   spalanca una bocca-caverna: mandibola giù, testa su, e in fondo il buio della gola. */
(() => {
'use strict';
const B = window.B, P = B.pittura, R = B.util.rumore, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, round, max, min } = Math;

// ---- tinte (una volta sola): oliva caldo con le ombre color prugna, pinne ruggine orlate d'oro, labbra salmone
const T = { corpo: P.tinta('#9c8c2e', '#4a2456'), mento: P.tinta('#b3a03c', '#5a2a52'), guancia: P.tinta('#bba640', '#5e2c56'), ventre: P.tinta('#ffe9ae', '#e08f4a'),
  pinna: P.tinta('#b8682a', '#4a1e52'), pinnaSpenta: P.tinta('#b39a94', '#6a5a80'), ciglio: P.tinta('#4d2f52'), spenta: P.tinta('#a9a6bd') };
const LABBRA = [];                                                     // dal salmone al rosso acceso: sette gradini per il lampo
for (let i = 0; i <= 6; i++) LABBRA.push(P.tinta(P.mescola('#f08a78', '#ff2a3a', i / 6), '#a8204e'));
const LABBRA_SPENTE = P.tinta('#cbb4be', '#7a6a8a');
const ORO = '#ffe14a', ROSSO = '#ff3348', MARMO = P.alfa('#ece282', .5), NEI = P.alfa(T.corpo.bordo, .5), SELLA = P.alfa(T.corpo.bordo, .24);
const CALMO = { palpebra: .3, sotto: .1 };                             // l'occhio mezzo addormentato del vecchio signore

/* Un barile con la coda: testa enorme, e il ventre che si ritira da u = .6 in avanti, dove lavora la mandibola. */
const SU = P.sagoma([[0, .13], [.1, .21], [.28, .54], [.48, .8], [.66, .88], [.82, .84], [.93, .66], [1, .44]]);
const GIU = P.sagoma([[0, .13], [.1, .21], [.28, .52], [.44, .76], [.56, .8], [.64, .62], [.7, .46], [.8, .36], [.9, .275], [1, .19]]);
const ONDA = { amp: .13, onde: .5, testa: .02, potenza: 2.2 };         // si muove solo il codone
const L = 1.06, H = .35, ANG = -.43, APRI = 1.1;                        // mandibola: lunghezza, spessore, direzione da chiusa, apertura massima (radianti)
const sella = (u0, d) => v => u0 + d + .035 * sin(v * 3 + u0 * 20);    // selle scure dal bordo ondulato
const SELLE = [.14, .3, .46, .62].map(u0 => [sella(u0, 0), sella(u0, .08)]);
/* Le labbra sono due salsicciotti su una spina curva: sottili all'angolo della bocca, gonfi davanti. */
const curva = (ax, ay, bx, by, dx, dy) => (u, p) => { const w = 1 - u; p.x = w * w * ax + 2 * w * u * bx + u * u * dx; p.y = w * w * ay + 2 * w * u * by + u * u * dy; };
const SPL = P.sagoma([[0, .03], [.4, .06], [.78, .1], [1, .09]]);
const LABBRO_GIU = P.spina(8, curva(L * .2, .03, L * 1.03, -.02, L * 1.02, H * .3), SPL, SPL, { testa: .09, coda: .03 });   // nelle coordinate della mandibola

/* Marmo: chiazze irregolari (tre ellissi sghembe ciascuna) sparse sul dorso e sui fianchi, sempre uguali. */
function marmo(cc, s, n, seme, r0, r1, colore) {
  const q = {}; cc.beginPath();
  for (let i = 0; i < n; i++) {
    const r = r0 + (r1 - r0) * R(i, seme + 5);
    P.suSpina(s, .07 + .84 * ((i * .618034 + seme * .37) % 1), -.86 + 1.12 * (i + .5) / n, q);
    for (let k = 0; k < 3; k++) {
      const j = i * 3 + k, a = R(j, seme) * TAU, d = r * .75 * R(j, seme + 2), x = q.x + cos(a) * d, y = q.y + sin(a) * d * .7, rr = r * (.5 + .5 * R(j, seme + 7)), g = R(j, seme + 3) * PI;
      cc.moveTo(x + cos(g) * rr * 1.4, y + sin(g) * rr * 1.4); cc.ellipse(x, y, rr * 1.4, rr * .75, g, 0, TAU);
    }
  }
  cc.fillStyle = colore; cc.fill();
}
/* Sopracciglio folto: una virgola grossa con tre ciuffi verso la tempia. ang > 0 = cattivo. */
function ciglione(c, x, y, lung, ang, s, t) {
  const h = lung / 2;
  c.save(); c.translate(x, y); c.rotate(ang); c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath(); c.moveTo(h, s * .15);
  c.quadraticCurveTo(h * .3, -s * 1.3, -h * .45, -s);
  c.lineTo(-h * 1.05, -s * 1.5); c.lineTo(-h * .8, -s * .55); c.lineTo(-h * 1.28, -s * .45); c.lineTo(-h * .85, s * .08); c.lineTo(-h * 1.1, s * .6); c.lineTo(-h * .5, s * .32);
  c.quadraticCurveTo(h * .2, -s * .1, h, s * .15); c.closePath();
  c.strokeStyle = t.bordo; c.lineWidth = .05; c.stroke(); c.fillStyle = t.base; c.fill();
  c.beginPath(); c.moveTo(h * .6, -s * .3); c.quadraticCurveTo(h * .1, -s * .9, -h * .45, -s * .68);
  c.strokeStyle = P.alfa(t.luce, .6); c.lineWidth = s * .2; c.stroke();
  c.restore();
}
/* Guancia cadente: un lembo della stessa pelle del corpo che pende sopra l'angolo della bocca. In alto si fonde con la
   testa (niente bordo), in basso ha bordo e ombra. k = di quanto si allunga quando la bocca si spalanca. */
function guanciona(c, x, y, k, t, luce, dentro) {
  const p = [x - .26, y - .08, x - .05, y - .23, x + .17, y - .17, x + .25, y + .05, x + .14, y + .27 + k, x - .09, y + .3 + k, x - .27, y + .12];
  c.save(); c.beginPath(); c.rect(x - 1, y - .02, 2, 2); c.clip();
  P.profilo(c, p); c.lineJoin = 'round'; c.strokeStyle = t.bordo; c.lineWidth = P.BORDO * 2; c.stroke(); c.restore();
  P.volume(c, cc => P.profilo(cc, p), t, { luce, bordo: 0, ombra: .09, dentro });
}

B.specie.registra({
  id: 'don_cernia',
  descrizione: 'Le cernie non inseguono nessuno: spalancano la bocca di colpo e l\'acqua si porta dentro la preda. Don Cernia comanda la laguna da cinquant\'anni: quando le labbra gli diventano rosse, nuota via!',
  forma: { lx: 1.25, ly: .95 },
  ingombro: { x0: -2.2, y0: -1.6, x1: 1.8, y1: 1.35 },
  disegna(c, o) {
    const G = P.statoGigante(o), t = o.t || 0, fase = o.fase || 0, F = fase * TAU, q = {};
    const viva = !G.giu, velo = G.sconfitto ? .45 : G.stordito ? .18 : 0;
    const ap = max(.03, G.apri * APRI + (G.calmo ? .06 + .04 * sin(t * 1.6) : 0));     // apertura della mandibola in radianti (da calmo «respira»)
    const rosso = G.carica ? 6 : G.avviso ? round(G.lampo * 6) : G.caccia ? 1 : 0;     // quanto sono accese le labbra (0..6)
    const labbra = G.sconfitto ? LABBRA_SPENTE : LABBRA[rosso], tp = G.sconfitto ? T.pinnaSpenta : T.pinna;
    const orlo = G.sconfitto ? T.spenta.base : rosso > 1 ? P.mescola(ORO, ROSSO, rosso / 6) : ORO;
    const sbiadisci = velo ? cc => { cc.fillStyle = 'rgba(182,180,210,' + velo + ')'; cc.fillRect(-3, -3, 6, 6); } : null;   // sbiadisce quando è giù
    c.save();
    c.translate(G.rincula + G.trema, sin(t * 1.3) * .02 + (G.sconfitto ? .12 : 0));
    c.rotate((G.sconfitto ? .32 : G.stordito ? sin(t * 2.2) * .07 : 0) - ap * .26 - (G.avviso ? G.k * .04 : 0));   // spalancando la bocca alza la testa
    if (G.carica) c.scale(1.05, .96); else if (G.avviso) c.scale(1 + G.k * .03, 1 + G.k * .05);                    // prima di colpire si gonfia
    if (rosso > 1) P.bagliore(c, .8, .3, 1.0, ROSSO, G.carica ? .3 : G.lampo * .5);                                // l'alone dell'avviso
    const s = P.spinaPesce(14, -1.3, .64, fase, ONDA, SU, GIU, { testa: .3, coda: .05 }), luce = [.25, -.55, 2];
    const irto = viva ? G.ira : -.6;                                   // spine dritte quando è arrabbiato, flosce quando è giù

    // ---- 1. dietro al corpo: codone a ventaglio, dorsale molle, dorsale spinosa, anale, e la caverna della bocca
    P.suSpina(s, 0, 0, q);
    P.coda(c, { x: q.x + .05, y: q.y, ang: q.ang + PI + sin(F - 1) * .3 + (G.giu ? .25 : 0), tipo: 'ventaglio', lung: .62, alt: .66, radice: .15, fase: F - 1.8, onda: .2, tinta: tp, orlo, smerlo: .35, n: 7 });
    const m0 = P.suSpina(s, .42, -.9), m1 = P.suSpina(s, .12, -.62);
    P.pinna(c, { x0: m0.x, y0: m0.y, x1: m1.x, y1: m1.y, a0: -PI / 2 - .55 + irto * .15, a1: -PI + .4, lung: .5, profilo: [.75, 1, 1, .85, .5], n: 6, onda: .08, fase: F, passo: .7, tinta: tp, orlo });
    const d0 = P.suSpina(s, .7, -.93), d1 = P.suSpina(s, .4, -.9);
    P.pinna(c, { x0: d0.x, y0: d0.y, x1: d1.x, y1: d1.y, a0: -PI / 2 - .5 + irto * .35, a1: -PI / 2 - .85 + irto * .25, lung: .4 + irto * .16, profilo: [.55, .9, 1, .95, .85, .7], n: 6, smerlo: .9,
      onda: .05, fase: F, passo: .8, tinta: tp, orlo, primo: true });
    const a0 = P.suSpina(s, .3, .88), a1 = P.suSpina(s, .12, .75);
    P.pinna(c, { x0: a0.x, y0: a0.y, x1: a1.x, y1: a1.y, a0: PI / 2 + .55, a1: PI - .4, lung: .4, profilo: [.75, 1, .8, .5], n: 5, onda: .08, fase: F + 1, tinta: tp, orlo });
    const ce = P.suSpina(s, .62, .86), am = ANG + ap, ca = cos(am), sa = sin(am);               // cerniera e direzione della mandibola
    const fauci = { x: ce.x, y: ce.y, ang: ANG, lung: L, apri: ap, alt: H, su: .3, fondo: .74, tinta: T.mento, interno: '#8a1446', lingua: '#ff7d9c', ombra: .09,
      dentro(cc) {                                                     // doppio mento chiaro e piega della gola (nelle coordinate della mandibola)
        cc.fillStyle = P.alfa(T.ventre.base, .62); cc.beginPath(); cc.ellipse(L * .38, H * 1.08, L * .62, H * .52, 0, 0, TAU); cc.fill();
        P.solco(cc, [L * .08, H * .52, L * .34, H * .76, L * .66, H * .7], T.mento, .03);
        if (sbiadisci) sbiadisci(cc);
      } };
    fauci.parte = 'cavita'; P.fauci(c, fauci);
    if (ap > .14) {                                                    // la gola: il buio in fondo alla caverna
      const mid = ANG + (ap - .3) / 2, k = min(1, ap * 1.2);
      P.ombra(c, ce.x + cos(mid) * L * .26, ce.y + sin(mid) * L * .26, L * .34 * k, L * .25 * k, mid, .92, '#1c0318');
    }

    // ---- 2. il corpo: selle scure, ventre chiaro, marmo giallo-verde, nei; sopra bozzi, opercolo, riflesso
    P.volume(c, s, T.corpo, { luce, ombra: .13, dentro(cc) {
      P.bande(cc, s, SELLE, SELLA);
      P.fianco(cc, s, u => .38 + .1 * sin(u * 9), 1.4, T.ventre.base, 0, .66);
      marmo(cc, s, 13, 4, .06, .12, MARMO);
      P.macchie(cc, s, { n: 11, seme: 2, u0: .1, u1: .92, v0: -.82, v1: .3, r0: .022, r1: .045, colore: NEI, lungo: 1.1 });
      if (sbiadisci) sbiadisci(cc);
    } });
    if (P.fine(o)) P.bozzi(c, P.puntiSuSpina(s, 5, .5, .8, u => -.76 - .12 * sin(u * 31)), i => .034 + (i % 3) * .012, T.corpo);
    const b0 = P.suSpina(s, .56, -.5), b1 = P.suSpina(s, .5, -.05), b2 = P.suSpina(s, .51, .3);
    P.solco(c, [b0.x, b0.y, b1.x, b1.y, b2.x, b2.y], T.corpo, .05);
    P.riflesso(c, -.2, -.66, .3, -.08, .12);

    // ---- 3. sul fianco: la pettorale tonda che rema
    const pp = P.suSpina(s, .42, .34), rema = sin(F * 2 + .5), dir = PI * .88 + rema * .28 - (G.carica ? .25 : 0) - (G.giu ? .5 : 0);
    P.ombra(c, pp.x - .16, pp.y + .08, .36, .24, -.3, .3);
    P.pinna(c, { x0: pp.x + .05, y0: pp.y - .12, x1: pp.x - .03, y1: pp.y + .14, a0: dir - .65, a1: dir + .65, lung: .62, profilo: [.65, .92, 1, .92, .65], n: 6, onda: .1, fase: F * 2, passo: .7, tinta: tp, orlo, primo: true });

    // ---- 4. la bocca: denti di sopra e di sotto (col dente d'oro), labbro di sopra, mandibola, labbro di sotto, guancia cadente
    const kd = min(1, .3 + ap * 1.6), l0 = P.suSpina(s, .76, 1), l1 = P.suSpina(s, 1, 1);       // a bocca chiusa i denti stanno dietro le labbra
    P.denti(c, l0.x, l0.y, l1.x + .2, l1.y - .07, 8, .17 * kd, -1, { tipo: 'punta', varia: .3, seme: 11 });
    P.denti(c, ce.x + ca * L * .26, ce.y + sa * L * .26, ce.x + ca * L * .98, ce.y + sa * L * .98, 8, .21 * kd, 1, { tipo: 'punta', varia: .3, seme: 5 });
    P.denti(c, ce.x + ca * L * .71, ce.y + sa * L * .71, ce.x + ca * L * .8, ce.y + sa * L * .8, 1, .22 * kd, 1, { tipo: 'punta', colore: '#ffcf3a', bordo: '#8a4a0a' });
    const la = P.suSpina(s, .72, .9);
    P.volume(c, P.spina(8, curva(la.x, la.y, l1.x + .27, l1.y - .09, l1.x + .3, l1.y - .22), SPL, SPL, { testa: .08, coda: .03 }), labbra, { luce: [l1.x + .2, l1.y - .2, 1], bordo: .04, ombra: .04, lume: .04 });
    P.riflesso(c, l1.x + .25, l1.y - .16, .13, 1.1, .1);
    fauci.parte = 'mandibola'; P.fauci(c, fauci);
    c.save(); c.translate(ce.x, ce.y); c.rotate(am);
    P.volume(c, LABBRO_GIU, labbra, { luce: [L * .9, -.1, 1], bordo: .04, ombra: .04, lume: .04 });
    P.riflesso(c, L * .8, -.035, .15, -.05, .1);
    c.restore();
    const gx = ce.x + .02, gy = ce.y - .13 + ap * .04;
    P.ombra(c, gx + .08, gy + .2, .26, .22, 0, .22);

/* Boccone — banco: PESCIOLINO DORATO. Il banco raro che vale di più: un pesciolino paffuto tutto d'oro, con la coda a
   ventaglio arancio, due squame in rilievo e una stellina di luce che gli si accende e spegne sul dorso mentre nuota.

(() => {
'use strict';
const B = window.B, TAU = Math.PI * 2;
const BORDO = '#8a3208', ARANCIO = '#ff9a1c', SQUAMA = 'rgba(214,98,8,.6)', PUPILLA = '#3b1030';
/* Una stellina a quattro punte di raggio r, aggiunta al tracciato in corso. */
const stellina = (c, x, y, r) => {
  c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r); c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r);
};

    c.beginPath(); c.moveTo(-.46, ym * .5 - .07); c.quadraticCurveTo(-.84, yc - .52, -1.08, yc - .4); c.quadraticCurveTo(-.86, yc, -1.08, yc + .4); c.quadraticCurveTo(-.84, yc + .52, -.46, ym * .5 + .07); c.closePath();
    c.strokeStyle = BORDO; c.lineWidth = .1; c.stroke(); c.fillStyle = ARANCIO; c.fill();
    // corpo paffuto: oro carico sul dorso, oro chiaro sul fianco, pancia quasi bianca
    const g = c.createLinearGradient(0, -.44, 0, .44); g.addColorStop(0, '#ff9f12'); g.addColorStop(.38, '#ffd426'); g.addColorStop(.62, '#fff7b8'); g.addColorStop(1, '#ffbe3a');
    c.beginPath(); c.moveTo(1, .03); c.bezierCurveTo(.74, -.52, -.18, -.5 + ym, -.7, ym * .4 - .06); c.lineTo(-.7, ym * .4 + .08); c.bezierCurveTo(-.18, .5 + ym, .74, .48, 1, .03); c.closePath();

    P.pinna(c, { x0: an0.x, y0: an0.y, x1: an1.x, y1: an1.y, a0: PI / 2 + .6, a1: PI - .4, lung: .28, profilo: [.8, 1, .9, .75], n: 5, smerlo: .4, onda: .08, fase: F * 2 - 2, tinta: T.pinna, orlo: ORLO });

<script>
/* Boccone — gigante: IL KRAKEN, il padrone del relitto. Un calamaro colossale rosso cupo, lungo e affusolato: mantello a
   siluro che finisce a freccia con le due pinne a rombo, la testa che esce dal colletto del mantello con l'occhio più
   grande del mare (giallo, tondo), il sifone sotto, e davanti il cono delle otto braccia che nasconde il becco. Dal cono
   escono i due tentacoli lunghi, sottili, con la clava in fondo.
   Tutti gli stati letti con P.statoGigante. Da calmo tiene le braccia chiuse a punta, come un tulipano; a caccia le apre a
   fiore, mostra il becco e allunga i tentacoli a tenaglia. Il segnale da ricordare: LE LUCINE AZZURRE che si accendono in
   fila sul fianco e sulle clave, mentre i due tentacoli si avvolgono a molla sopra e sotto la testa = sta per colpire.
   Quando parte li scaglia dritti in avanti, col mantello stirato e le pinne piegate all'indietro. */
(() => {

    dorso: P.alfa(pelle.bordo, .24), nei: P.alfa(pelle.bordo, .45), striscia: P.alfa(P.mescola(base, '#ffd9c2', .5), .5),

const SU = P.sagoma([[0, .03], [.1, .13], [.28, .26], [.52, .35], [.78, .395], [.92, .39], [1, .37]]);

const ASSE = .04, MX = CX + cos(ASSE) * .42, MY = CY + sin(ASSE) * .42; // direzione e posto del becco (attorno a x = .8)
const ROMBO = [.22, .74, 1, .86, .6, .3];                               // il profilo delle pinne a rombo
/* Le braccia: [angolo da chiuse, angolo aperte, ricciolo da chiuse, ricciolo aperte, lunghezza, lato delle ventose].
   Da chiuse fanno un cono che si stringe in punta; aperte, le quattro di sopra salgono e le quattro di sotto scendono,
   con le punte che tornano in avanti come artigli: in mezzo resta il becco. */
const LONTANE = [[-.58, -1.4, 1.05, 1.3, 1.15, 1], [-.24, -.5, .43, .7, 1.35, 1], [.2, .45, -.36, -.6, 1.35, -1], [.56, 1.2, -1, -1.1, 1.15, -1]];
const VICINE = [[-.42, -1.2, .76, 1.2, 1.3, 1], [-.1, -.92, .18, .95, 1.45, 1], [.28, 1, -.5, -.95, 1.45, -1], [.66, 1.42, -1.2, -1.2, 1.25, -1]];

   lungo l'orlo col cuore rosa: tinte piatte, in tre passate. st = lo stato già calcolato. */

  if (vicino) P.fianco(c, s, la * .2, la * .96, K.sotto, .03, .96, 9);
  for (let passata = vicino ? 0 : 1; passata < (vicino ? 3 : 2); passata++) {       // le lontane: una passata sola, tutta dentro il braccio
    const piu = passata ? 0 : .03, k = passata === 2 ? .42 : vicino ? 1 : .8, v = la * (vicino ? .97 : .62);
    c.beginPath();
    for (let j = 0; j < nv; j++) {
      const u = .12 + .78 * j / (nv - 1), r = (.058 - .036 * u) * k + piu;
      P.suSpina(s, u, v, q); c.moveTo(q.x + r, q.y); c.arc(q.x, q.y, r, 0, TAU);
    }
    c.fillStyle = passata === 2 ? K.cuoreVentosa : passata ? (vicino ? K.ventosa : K.ventosaLontana) : tinta.bordo; c.fill();
  }
}
/* Un tentacolo da preda: stelo sottile e clava in fondo. Quello lontano sta di sopra, quello vicino di sotto. Da calmi
   ondeggiano oltre il cono; a caccia si chiudono a tenaglia; nell'avviso si avvolgono a molla; nella carica partono dritti. */
function frusta(c, lontana, K, st, q) {
  const se = lontana ? -1 : 1, i = lontana ? 0 : 1;
  let ang, curva, onda, lung;
  if (st.giu) { ang = 1.05 + se * .22 + sin(st.t * 1.2 + i * 2) * .05; curva = st.sconfitto ? (lontana ? 2.2 : 2.9) : .5; onda = .12; lung = 1.7; }
  else if (st.scatto) { ang = se * .12 + .02; curva = -se * .1; onda = .05; lung = 2.12; }
  else {
    const w = st.avviso ? .3 + .7 * st.stringe : 0;                                  // quanto è avvolto a molla
    ang = lerp(lerp(se * .16 + .04, se * .34, st.ap), se * 1.12, w) + sin(st.t * .7 + i * 2.4) * .05;
    curva = lerp(lerp(se * .55, -se * .55, st.ap), se * 4.7, w) + sin(st.t * .5 + i) * .12;
    onda = lerp(.3, .08, w) * (1 - .4 * st.ap); lung = lerp(1.95, 2.02, st.ap);
  }
  const s = P.tentacolo(c, { x: CX, y: CY, ang, lung, spess: .12, punta: .09, curva, onda, onde: 1.1, fase: st.F + i * 2.6, clava: 1.35, tinta: lontana ? K.lontano : K.pelle,
    ombra: 0, lume: lontana ? 0 : .025, n: 14, bordo: .04 });
  CLAVA.length = 0;
  for (let j = 0; j < 5; j++) { P.suSpina(s, .74 + j * .056, -se * .3, q); CLAVA.push(q.x, q.y); }
  if (st.luci) {                                                                     // la clava accesa: è il pugno che sta per arrivare
    P.suSpina(s, .86, 0, q); P.bagliore(c, q.x, q.y, .5, LUME, st.luci * (lontana ? .6 : .75));
    P.lucine(c, CLAVA, j => RV[j] * (1.05 + .45 * st.lampo), LUME, st.luci);
  } else for (let passata = 0; passata < 2; passata++) {
    c.beginPath();
    for (let j = 0; j < 5; j++) { const r = RV[j] * (passata ? .45 : 1); c.moveTo(CLAVA[j * 2] + r, CLAVA[j * 2 + 1]); c.arc(CLAVA[j * 2], CLAVA[j * 2 + 1], r, 0, TAU); }
    c.fillStyle = passata ? K.cuoreVentosa : lontana ? K.ventosaLontana : K.ventosa; c.fill();
  }
}

B.specie.registra({
  id: 'kraken',
  descrizione: 'Il calamaro gigante ha gli occhi più grandi di tutti gli animali: grossi come un pallone. Se al Kraken si accendono le lucine azzurre e i due tentacoli lunghi si avvolgono a molla, scappa: sta per colpire!',
  forma: { lx: 1.5, ly: .6 },
  ingombro: { x0: -2.15, y0: -1.82, x1: 2.86, y1: 2.05 },   // nell'avviso i tentacoli si alzano più che nelle pose della galleria
  disegna(c, o) {
    const G = P.statoGigante(o), t = o.t || 0, F = (o.fase || 0) * TAU, q = {};
    const viva = !G.giu, K = G.sconfitto ? SPENTA : G.stordito ? STORDITA : VIVE[G.carica ? 3 : G.avviso ? 2 : G.caccia ? 1 : 0];
    const luci = G.carica ? 1 : G.avviso ? .68 + .32 * G.lampo : 0;                  // le lucine: già ben accese appena parte l'avviso, poi pulsano
    const st = { t, F, fine: P.fine(o), giu: G.giu, sconfitto: G.sconfitto, avviso: G.avviso, stringe: G.avviso ? G.k : 0, scatto: G.carica ? 1 : 0, luci, lampo: G.lampo,
      ap: G.carica ? 1 : G.avviso ? .34 - .14 * G.k : G.caccia ? .55 + .45 * (o.bocca || 0) : G.apri };   // quanto si apre il fiore delle braccia
    const becco = G.giu ? .12 : G.apri;
    c.save();
    c.translate(G.rincula + G.trema, sin(t * 1.3) * .025 + (G.sconfitto ? .12 : 0));
    c.rotate(G.sconfitto ? .26 : G.stordito ? sin(t * 2.2) * .07 : -st.ap * .03);
    if (luci) P.bagliore(c, .2, 0, 1.35, G.carica ? ROSSO : LUME, G.carica ? .26 : .14 + G.lampo * .3);   // l'alone dell'avviso

    // ---- 1. dietro a tutto: il tentacolo lontano e le quattro braccia lontane, scure
    frusta(c, true, K, st, q);
    for (let i = 0; i < 4; i++) braccio(c, LONTANE[i], i * 2, K, st, false, q);

    // ---- 2. in mezzo alle braccia: la membrana scura, la bocca col becco
    c.beginPath(); c.ellipse(CX + .14, CY, .3, .3, 0, 0, TAU); c.strokeStyle = K.lontano.bordo; c.lineWidth = .1; c.stroke(); c.fillStyle = K.lontano.ombra; c.fill();
    c.beginPath(); c.ellipse(MX, MY, .2 + becco * .03, .22 + becco * .05, ASSE, 0, TAU); c.strokeStyle = LABBRO.bordo; c.lineWidth = .07; c.stroke(); c.fillStyle = viva ? LABBRO.base : K.sotto; c.fill();
    c.beginPath(); c.ellipse(MX + .02, MY + .01, .11 + becco * .05, .12 + becco * .09, ASSE, 0, TAU); c.fillStyle = '#5a0c34'; c.fill();
    P.corno(c, MX - .06, MY + .07, ASSE + .3 + becco * .55, .25, .19, BECCO, { curva: -.7 });
    P.corno(c, MX - .07, MY - .07, ASSE - .1 - becco * .4, .37, .25, BECCO, { curva: .75 });

    // ---- 3. le quattro braccia vicine e il tentacolo vicino
    for (let i = 0; i < 4; i++) braccio(c, VICINE[i], i * 2 + 1, K, st, true, q);
    frusta(c, false, K, st, q);

    // ---- 4. la testa (copre le radici delle braccia) e il sifone, che spunta da sotto il colletto
    P.palla(c, HX, HY, .43, .34, -.06, K.pelle, { luce: [HX + .14, HY - .3, 1], ombra: .08 });
    if (viva) P.guancia(c, HX + .27, HY + .2, .17, '#ff4f8a', .34);
    c.beginPath(); c.ellipse(0, HY + .31, .2, .085, .2, 0, TAU); c.strokeStyle = SIFONE.bordo; c.lineWidth = .08; c.stroke(); c.fillStyle = viva ? SIFONE.base : K.sotto; c.fill();
    c.beginPath(); c.ellipse(.15, HY + .345, .042, .062, .2, 0, TAU); c.fillStyle = SIFONE.bordo; c.fill();

    P.ombra(c, X1 + .12, HY, .2, .38, 0, .4);                                         // l'ombra del colletto sulla testa

    // ---- 5. il mantello: respira, pulsa nuotando, si gonfia prima di colpire, si stira nello scatto, si affloscia quando è giù
    const cade = G.sconfitto ? .5 : G.stordito ? .22 + sin(t * 2.2) * .04 : 0, lungo = G.carica ? 1.1 : G.avviso ? 1 - .06 * G.k : G.sconfitto ? .95 : 1;
    const dondola = viva ? sin(F - 1) * .05 + sin(t * .9) * .025 : 0;
    const gonfia = G.sconfitto ? -.2 : G.carica ? -.14 : G.avviso ? .04 + G.k * .1 + G.lampo * .03 : (viva ? .03 : .012) * sin(t * 1.7) + (viva ? .025 * sin(F) : 0);
    const s = P.spina(NS, (u, p) => { const d = 1 - u; p.x = X1 + (X0 - X1) * d * lungo; p.y = Y1 + (Y0 - Y1) * d + (cade + dondola) * d * d; }, SU, GIU, { coda: .02, testa: .05 });
    for (let i = 0; i <= NS; i++) { const g = 1 + gonfia * sin(PI * i / NS); s.su[i] *= g; s.giu[i] *= g; }
    // le due pinne a rombo, in punta: quella di sotto più scura; ondeggiano, a caccia si drizzano, nello scatto si piegano indietro
    const irto = viva ? G.ira : -.7, vela = G.carica ? .5 : G.giu ? .3 : 0;
    const f0 = P.suSpina(s, .47, .72), f1 = P.suSpina(s, .03, .4);
    P.pinna(c, { x0: f0.x, y0: f0.y, x1: f1.x, y1: f1.y, a0: f0.ang + PI / 2 + .15 + vela, a1: f0.ang + PI / 2 + .8 + vela * .5, lung: .5 * (1 + irto * .14), profilo: ROMBO, n: 7,
      onda: viva ? .13 : .04, fase: F * 2 + 1.5, passo: .8, tinta: K.pinnaLontana, orlo: luci ? LUME : undefined });
    const g0 = P.suSpina(s, .47, -.72), g1 = P.suSpina(s, .03, -.4);
    P.pinna(c, { x0: g0.x, y0: g0.y, x1: g1.x, y1: g1.y, a0: g0.ang - PI / 2 - .15 - vela, a1: g0.ang - PI / 2 - .8 - vela * .5, lung: .56 * (1 + irto * .14), profilo: ROMBO, n: 7,
      onda: viva ? .13 : .04, fase: F * 2, passo: .8, tinta: K.pinna, orlo: luci ? LUME : K.sotto });
    P.volume(c, s, K.pelle, { luce: [-.45, -.8, 2.1], ombra: .1, dentro(cc) {
      P.fianco(cc, s, -1.4, u => -.5 + .09 * sin(u * 15), K.dorso);
      P.fianco(cc, s, u => .44 + .07 * sin(u * 12 + 1), 1.4, K.velo);
      P.fianco(cc, s, .07, .25, luci ? NEON[Math.round((G.carica ? 1 : G.lampo) * 3)] : K.striscia, .08, .93);
      P.banda(cc, s, .955, 1.2, K.orlo);
      P.macchie(cc, s, { n: 7, seme: 9, u0: .12, u1: .9, v0: .3, v1: .8, r0: .014, r1: .028, colore: K.striscia, lungo: 1.3 });
      P.macchie(cc, s, { n: 16, seme: 4, u0: .08, u1: .92, v0: -.92, v1: -.08, r0: .016, r1: .042, colore: K.nei, lungo: 1.4 });
    } });
    const foto = P.puntiSuSpina(s, 7, .17, .89, .16), rf = i => .034 + .005 * i;       // la fila di lucine sul fianco
    if (luci) P.lucine(c, foto, i => rf(i) * (1 + .5 * G.lampo), LUME, luci);
    else if (st.fine) P.bozzi(c, foto, rf, K.pelle);
    if (st.fine) {                                                                    // le cicatrici di cento battaglie
      const a = P.suSpina(s, .6, -.8), b = P.suSpina(s, .52, -.12), d = P.suSpina(s, .51, -.74), e = P.suSpina(s, .45, -.22);
      P.solco(c, [a.x, a.y, (a.x + b.x) / 2 + .03, (a.y + b.y) / 2, b.x, b.y], K.pelle, .04);
      P.solco(c, [d.x, d.y, (d.x + e.x) / 2 + .03, (d.y + e.y) / 2, e.x, e.y], K.pelle, .035);
    }
    P.suSpina(s, .8, -.6, q); P.riflesso(c, q.x, q.y, .46, q.ang - .06, .11);

    // ---- 6. la faccia: l'occhione (giallo e tondo, oppure rosso e tagliato), sopracciglio, stelline
    const ex = HX + .1, ey = HY - .05;
    if (G.ira > .6) P.bagliore(c, ex, ey, .4, ROSSO, G.ira * .4);
    c.beginPath(); c.arc(ex - .01, ey, .32, 0, TAU); c.fillStyle = K.pelle.chiara; c.fill();                 // il bozzo dell'occhio
    P.occhio(c, ex, ey, .27, Object.assign({ iride: G.ira ? '#ff3a1e' : '#ffd21e', pelle: K.pelle, tipo: G.ira ? 'fessura' : 'tondo', guarda: P.sguardo(o.sguardo, ex, ey) }, G.calmo ? CALMO : G.occhi));
    if (G.ira) P.sopracciglio(c, ex + .05, ey - .26, .6, .42 + G.ira * .2, K.pelle.bordo, .14);
    else if (G.giu) P.sopracciglio(c, ex, ey - .35, .44, -.35, K.pelle.bordo, .07);
    if (G.stordito) P.stelle(c, .25, -.72, .5, t, 3, .11);
    c.restore();
  },
});
})();

</script>
<script>
/* Boccone — gigante: LA GRANDE LANTERNA, signora dell'abisso. ESEMPIO DI RIFERIMENTO per i giganti (vedi GUIDA-STILE.md):
   tutti gli stati letti con P.statoGigante (calmo, caccia, avviso con o.carica, carica, stordito, sconfitto), mandibola
   sporgente (P.fauci in due parti), esca luminosa che fa da segnale di pericolo, corona.
   Il segnale da ricordare: esca verde acqua = tranquilla, gialla = ti dà la caccia, lampeggia rossa = sta per attaccare. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, round } = Math;

/* Viola-nero, ma con la tinta base abbastanza chiara da staccare dal buio dell'abisso: il nero lo fanno ombre e bordi. */
const T = { corpo: P.tinta('#5d36b8', '#1a0a4a'), mento: P.tinta('#7b4fd0', '#2a0f5a'), ventre: P.tinta('#b993ea', '#5a2a9a'), pinna: P.tinta('#9a3fd6', '#2a0f6a'),
  stelo: P.tinta('#8f72e6', '#2a0f6a'), spenta: P.tinta('#8d89b4') };
const ACQUA = '#62ffd2', ORO = '#ffe14a', ROSSO = '#ff3348', FOTOFORI = '#58f0e0';
/* Un pallone con la coda: il ventre si ritira da u = .6 in avanti, dove lavora la mandibola. */
const SU = P.sagoma([[0, .12], [.1, .2], [.28, .58], [.48, .88], [.68, .98], [.86, .86], [1, .6]]);
const GIU = P.sagoma([[0, .12], [.1, .2], [.28, .55], [.44, .8], [.56, .78], [.64, .4], [.78, .3], [.9, .2], [1, .14]]);
const ONDA = { amp: .13, onde: .5, testa: .02, potenza: 2.2 };       // si muove solo il codino

B.specie.registra({
  id: 'lanterna',
  descrizione: 'Nel buio dell\'abisso si vede soltanto la sua lucina che dondola, e chi si avvicina a guardare scopre troppo tardi la bocca che c\'è dietro. Se la luce diventa rossa, scappa.',
  forma: { lx: 1.15, ly: 1.0 },
  ingombro: { x0: -1.96, y0: -1.84, x1: 1.84, y1: 1.58 },
  disegna(c, o) {
    const G = P.statoGigante(o), t = o.t || 0, fase = o.fase || 0, F = fase * TAU, q = {};
    const ap = G.apri * 1.05, viva = !G.giu;                           // ap: apertura della mandibola in radianti
    c.save();
    c.translate(G.rincula + G.trema, sin(t * 1.3) * .02 + (G.sconfitto ? .1 : 0));
    c.rotate((G.sconfitto ? .3 : G.stordito ? sin(t * 2.2) * .07 : 0) - ap * .13 - (G.avviso ? G.k * .05 : 0));   // spalancando la bocca alza la testa
    if (G.carica) c.scale(1.05, .96);                                  // lanciata: si allunga
    const s = P.spinaPesce(14, -1.2, .62, fase, ONDA, SU, GIU, { testa: .3, coda: .05 }), luce = [.2, -.55, 1.9];
    const irto = viva ? G.ira : -.6;                                   // pinne irte quando è arrabbiata, flosce quando è giù

    // ---- 1. dietro al corpo: coda sfrangiata, pinna dorsale a punte, anale, e la cavità della bocca
    P.suSpina(s, 0, 0, q);
    P.coda(c, { x: q.x + .05, y: q.y, ang: q.ang + PI + sin(F - 1) * .3, tipo: 'ventaglio', lung: .52, alt: .56, radice: .13, fase: F - 1.8, onda: .2, tinta: T.pinna, orlo: viva ? FOTOFORI : T.spenta.base, smerlo: .8, n: 6 });
    const d0 = P.suSpina(s, .52, -.9), d1 = P.suSpina(s, .2, -.75);
    P.pinna(c, { x0: d0.x, y0: d0.y, x1: d1.x, y1: d1.y, a0: -PI / 2 - .5 + irto * .3, a1: -PI + .45 + irto * .15, lung: .5 + irto * .12, profilo: [.55, 1, .9, .7, .45], n: 5, smerlo: .85,
      onda: .06, fase: F, passo: .8, tinta: T.pinna, orlo: viva ? FOTOFORI : T.spenta.base, primo: true });
    const a0 = P.suSpina(s, .34, .85), a1 = P.suSpina(s, .14, .8);
    P.pinna(c, { x0: a0.x, y0: a0.y, x1: a1.x, y1: a1.y, a0: PI / 2 + .6, a1: PI - .4, lung: .36, profilo: [.7, 1, .7], n: 4, smerlo: .8, onda: .08, fase: F + 1, tinta: T.pinna });
    const ce = P.suSpina(s, .58, .5), L = 1.08, h = .42;               // cerniera, lunghezza e spessore della mandibola
    const fauci = { x: ce.x, y: ce.y, ang: -.36, lung: L, apri: ap, alt: h, su: .25, fondo: .74, tinta: T.mento, interno: '#7a0c3e', lingua: '#ff6f9a', ombra: .08,
      dentro(cc) {                                                     // labbro chiaro, bozzi del mento (nelle coordinate della mandibola)
        cc.fillStyle = P.alfa(T.ventre.base, .55); cc.fillRect(-L * .3, 0, L * 1.4, h * .2);
        P.bozzi(cc, [L * .3, h * .55, L * .52, h * .62, L * .72, h * .5, L * .88, h * .3], .034, T.mento);
      } };
    fauci.parte = 'cavita'; P.fauci(c, fauci);

    // ---- 2. il corpo: ventre chiaro con le pieghe, sella scura sul dorso, macchie; sopra bozzi, fotofori, branchia, riflesso
    P.volume(c, s, T.corpo, { luce, ombra: .13, dentro(cc) {
      P.fianco(cc, s, u => .42 + .1 * sin(u * 9), 1.4, T.ventre.base, 0, .63);
      P.fianco(cc, s, -1.4, u => -.62 + .12 * sin(u * 23), P.alfa(T.corpo.bordo, .4), 0, 1);
      P.macchie(cc, s, { n: 9, seme: 6, u0: .12, u1: .8, v0: -.5, v1: .3, r0: .035, r1: .075, colore: P.alfa(T.corpo.bordo, .42), lungo: 1.1 });
      P.anelli(cc, s, .3, .5, 4, T.ventre, { v0: .5, v1: 1.1, curva: -.03, spess: .04 });
      if (!viva) { cc.fillStyle = 'rgba(176,176,206,' + (G.sconfitto ? .42 : .2) + ')'; cc.fillRect(-2, -2, 4, 4); }     // sbiadisce quando è giù
    } });
    P.bozzi(c, P.puntiSuSpina(s, 6, .32, .8, u => -.6 - .2 * sin(u * 31)), i => .04 + (i % 3) * .012, T.corpo);
    P.lucine(c, P.puntiSuSpina(s, 6, .15, .52, u => .08 + .1 * sin(u * 12)), i => .03 + (i % 2) * .012, FOTOFORI, viva ? .7 + .3 * sin(t * 3) : .15);
    const b0 = P.suSpina(s, .5, -.25), b1 = P.suSpina(s, .46, .1), b2 = P.suSpina(s, .5, .4);
    P.solco(c, [b0.x, b0.y, b1.x, b1.y, b2.x, b2.y], T.corpo, .05);
    P.riflesso(c, .36, -.66, .34, .55, .12);

    // ---- 3. sul fianco: pinna pettorale che rema
    const pp = P.suSpina(s, .4, .45), rema = sin(F * 2 + .5), dir = PI * .86 + rema * .3 - (G.carica ? .25 : 0);
    P.ombra(c, pp.x - .16, pp.y + .08, .34, .22, -.3, .3);
    P.pinna(c, { x0: pp.x + .05, y0: pp.y - .1, x1: pp.x - .03, y1: pp.y + .12, a0: dir - .6, a1: dir + .6, lung: .6, profilo: [.6, .9, 1, .9, .6], n: 5, smerlo: .6, onda: .1, fase: F * 2, passo: .7, tinta: T.pinna, orlo: viva ? FOTOFORI : T.spenta.base, primo: true });

    // ---- 4. la bocca: denti di vetro di sopra, poi quelli di sotto, il pizzetto, e la mandibola che ne copre le radici
    const l0 = P.suSpina(s, .68, 1), l1 = P.suSpina(s, 1, 1);
    P.denti(c, l0.x, l0.y - .02, l1.x + .16, l1.y - .05, 7, .3, -1, { tipo: 'ago', varia: .5, seme: 11, colore: '#eefcff', curva: -.02 });
    const am = fauci.ang + ap, ca = cos(am), sa = sin(am);
    P.denti(c, ce.x + ca * L * .2, ce.y + sa * L * .2, ce.x + ca * L * .97, ce.y + sa * L * .97, 7, .36, 1, { tipo: 'ago', varia: .5, seme: 5, colore: '#eefcff' });
    const mx = ce.x + ca * L * .62 - sa * h * .9, my = ce.y + sa * L * .62 + ca * h * .9, don = sin(t * 1.7) * .06;       // sotto il mento
    P.filo(c, [mx, my, mx - .05 + don, my + .17, mx - .13 + don * 2, my + .31], .06, .025, T.stelo, .03);
    fauci.parte = 'mandibola'; P.fauci(c, fauci);
    if (viva) P.lucine(c, [mx - .13 + don * 2, my + .33], .035, FOTOFORI, .8);

    // ---- 5. l'occhio piccolo e crudele sotto l'arcata, la corona
    const e = P.suSpina(s, .9, -.42);
    if (G.ira) P.bagliore(c, e.x, e.y, .34, ROSSO, G.ira * .55);
    P.occhio(c, e.x, e.y, .15, Object.assign({ iride: G.ira ? '#ff5a1e' : '#b8f23a', bianco: '#fff6b0', tipo: 'fessura', pelle: T.corpo, guarda: P.sguardo(o.sguardo, e.x, e.y) }, G.occhi));
    P.sopracciglio(c, e.x + .03, e.y - (G.ira ? .17 : .2), .46, G.giu ? -.3 : G.ira ? .3 + G.ira * .35 : -.04, T.corpo.bordo, G.ira ? .14 : .1);   // piatto da calma, a spiovente da arrabbiata
    const k0 = P.suSpina(s, .62, -1);
    P.corona(c, k0.x - (G.sconfitto ? .3 : G.stordito ? .1 : 0), k0.y + .06, .25, G.sconfitto ? -.75 : G.stordito ? -.5 : -.2);

    // ---- 6. l'esca: lo stelo parte dalla fronte e porta la lucina davanti alla bocca. Il colore dice che cosa sta per fare
    const r0 = P.suSpina(s, .83, -.96);
    const stelo = P.tentacolo(c, { x: r0.x, y: r0.y, lung: 1.22, spess: .11, punta: .05, n: 9, tinta: T.stelo, ombra: 0, lume: .03,
      ang: G.carica ? -2.7 : G.giu ? -.6 : -.82 - (G.avviso ? G.k * .2 : 0),                       // in carica la corrente lo piega all'indietro
      curva: G.carica ? -.5 : G.giu ? 3.2 : 2.8 - (G.avviso ? G.k * .5 : 0),
      onda: G.carica ? .05 : .12, fase: t * 1.4, onde: .8 });
    P.palla(c, r0.x, r0.y + .02, .1, .07, 0, T.corpo, { ombra: .02 });                              // l'attacco dello stelo
    const p = P.suSpina(stelo, 1), ex = p.x + cos(p.ang) * .13, ey = p.y + sin(p.ang) * .13;
    const col = G.sconfitto ? null : G.carica ? ROSSO : G.avviso ? P.mescola(ORO, ROSSO, round(G.lampo * 6) / 6) : G.caccia ? ORO : ACQUA;
    const forza = G.stordito ? .28 + .12 * sin(t * 9) : G.avviso ? .65 + .35 * G.lampo : G.carica ? 1 : .8 + .1 * sin(t * 2.3);
    if (col) {

      P.bagliore(c, ex, ey, .5, col, forza);

    if (col) P.lucine(c, [ex + .03, ey - .03], .07, col, forza);
    P.riflesso(c, ex + .03, ey - .07, .11, -.3, .1);

    if (G.stordito) P.stelle(c, .35, -1.15, .5, t, 3, .11);
    c.restore();
  },
});
})();

<script>
/* Boccone — pericolo: MEDUSA. Ombrello traslucido rosa-lilla dall'orlo a festoni, con dentro il «quadrifoglio» viola; sotto,
   quattro braccia orali arricciate e otto tentacoli sottili con la perlina urticante in punta.
   Dipende solo da o.fase (i tentacoli che ondeggiano) e da o.attivo (la spinta: l'ombrello si stringe e si allunga,
   braccia e tentacoli si distendono, e lei strizza gli occhi per lo sforzo). 1 unità = il raggio che fa male. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, abs, max, min } = Math;

// ---- tinte: rosa con le ombre viola; braccia più cariche, tentacoli lilla
const T = { ombrello: P.tinta('#ff8fd0', '#8a3fd0'), braccia: P.tinta('#ff6fb4', '#9a3ab8'), lontane: P.tinta('#dc62c2', '#6a2aa0'), filo: P.tinta('#dcaaff', '#6a3fd0') };
const GONADI = P.alfa('#b84fe0', .8), CUORE = P.alfa('#ffe0f6', .6), CANALI = 'rgba(255,255,255,.34)', SOTTO = P.alfa('#8a3ad0', .32), GOTA = P.alfa('#ff3f8f', .38), PERLA = '#fff3a8', BALZA = '#ffd2ee';
const FILI = [-.92, -.66, -.4, -.14, .14, .4, .66, .92];             // da dove pendono i tentacoli (in quote della larghezza)
const OCCHIO = { iride: '#7a3fe0', pelle: T.ombrello, guarda: { x: 0, y: .3 }, palpebra: .24 }, STRIZZATO = { pelle: T.ombrello, tipo: 'chiuso' };
const SORRISO = { curva: .8, tinta: T.ombrello, spess: .05 }, SFORZO = { apri: .7, alt: .13, curva: .5, tinta: T.ombrello, lingua: false, spess: .05 };
const PUNTE = [], ORLO = [];                                // tamponi riusati a ogni disegno (non tengono stato)

B.specie.registra({
  id: 'medusa',
  descrizione: 'Non ha cervello, né cuore, né ossa: è quasi tutta acqua. Eppure i suoi tentacoli pungono chiunque li sfiori.',
  forma: { lx: 1, ly: 1 },
  ingombro: { x0: -1.33, y0: -1.08, x1: 1.33, y1: 2.72 },
  disegna(c, o) {
    const F = (o.fase || 0) * TAU, at = max(0, min(1, o.attivo || 0));
    const w = 1.02 - .17 * at, top = -(.9 + .12 * at), orlo = .2 + .07 * at;        // spingendo, l'ombrello si stringe e si allunga
    c.save();

    // ---- 1. sotto l'ombrello: i tentacoli sottili (con la perlina in punta) e le braccia orali arricciate
    PUNTE.length = 0; c.beginPath();                                  // tutti i tentacoli in un tracciato solo: due passate (bordo, colore) invece di sedici
    for (let i = 0; i < FILI.length; i++) {
      const x0 = FILI[i] * w * .9, lung = (1.7 + .36 * sin(i * 2.4)) * (1 + .12 * at), am = .17 * (1 - .55 * at);
      let px = x0, py = orlo - .06; c.moveTo(px, py);
      for (let k = 1; k <= 4; k++) {
        const x = x0 * (1 - k * .07 * at) + sin(F - k * 1.2 + i * 1.7) * am * k * .5, y = orlo + lung * k / 4;
        if (k > 1) c.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2);
        px = x; py = y;
      }
      c.lineTo(px, py); PUNTE.push(px, py);
    }
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = T.filo.bordo; c.lineWidth = .11; c.stroke(); c.strokeStyle = T.filo.base; c.lineWidth = .048; c.stroke();
    P.lucine(c, PUNTE, .036, PERLA, .55 + .45 * at);
    for (let i = 0; i < 4; i++) {
      const lato = i % 2 ? 1 : -1, vicino = i > 1;
      P.tentacolo(c, { x: lato * (vicino ? .16 : .4) * w, y: orlo - .14, ang: PI / 2 - lato * (vicino ? .1 : -.12) * (1 - at * .6), lung: (vicino ? 1.35 : 1.05) * (1 + .12 * at), spess: vicino ? .27 : .21, punta: .08,
        curva: -lato * (vicino ? 2.3 : 2.9) * (1 - .6 * at), onda: .5 * (1 - .4 * at), fase: F + i * 1.9, onde: 1.8, n: 7, tinta: vicino ? T.braccia : T.lontane, ombra: 0, lume: 0,
        ventose: vicino ? 7 : 0, lato: -lato, chiara: BALZA });                                     // i pallini chiari fanno la balza arricciata
    }

    // ---- 2. l'ombrello traslucido: il sotto in trasparenza, i canali, il quadrifoglio
    const traccia = cc => {
      cc.beginPath(); cc.moveTo(-w, orlo - .04);
      cc.bezierCurveTo(-w * 1.07, top * 1.32, w * 1.07, top * 1.32, w, orlo - .04);
      for (let i = 0; i < 6; i++) { const xa = w - i * w / 3, xb = xa - w / 3; cc.quadraticCurveTo((xa + xb) / 2, orlo + .17, xb, orlo - .04); }   // l'orlo a festoni
      cc.closePath();
    };
    c.globalAlpha = .9;
    P.volume(c, traccia, T.ombrello, { luce: [.32, top * .8, 1.75], ombra: .1, dentro(cc) {
      cc.fillStyle = SOTTO; cc.beginPath(); cc.ellipse(0, orlo - .02, w * .88, .2, 0, 0, TAU); cc.fill();
      cc.beginPath(); for (let i = -3; i <= 3; i++) { cc.moveTo(i * .05, top * .8); cc.quadraticCurveTo(i * w * .2, top * .3, i * w * .31, orlo + .1); }
      cc.strokeStyle = CANALI; cc.lineWidth = .026; cc.stroke();
      cc.beginPath(); for (let i = 0; i < 4; i++) { const x = (i - 1.5) * .3 * w, y = top * .6 + abs(i - 1.5) * .05; cc.moveTo(x + .13 * w, y); cc.ellipse(x, y, .13 * w, .1, 0, 0, TAU); }
      cc.fillStyle = CUORE; cc.fill(); cc.strokeStyle = GONADI; cc.lineWidth = .055; cc.stroke();
    } });
    c.globalAlpha = 1;
    ORLO.length = 0; for (let i = 0; i <= 6; i++) ORLO.push(w - i * w / 3, orlo - .05);
    if (P.fine(o)) P.bozzi(c, ORLO, .04, T.ombrello);                                               // una perlina a ogni festone
    P.riflesso(c, w * .44, top * .68, .36, .8, .16);

    // ---- 3. il visino: occhi sognanti (strizzati mentre spinge), gote, bocca
    const su = at > .6;
    c.fillStyle = GOTA; c.beginPath(); c.ellipse(-.53 * w, .0, .1, .06, 0, 0, TAU); c.ellipse(.53 * w, .0, .1, .06, 0, 0, TAU); c.fill();
    P.occhio(c, -.3 * w, -.13, .16, su ? STRIZZATO : OCCHIO); P.occhio(c, .3 * w, -.13, .16, su ? STRIZZATO : OCCHIO);
    P.sorriso(c, 0, su ? .0 : .02, su ? .07 : .1, su ? SFORZO : SORRISO);
    c.restore();
  },
});
})();

<script>
/* Boccone — specie: MURENA (taglia 4, agguato). ESEMPIO DI RIFERIMENTO per i corpi a nastro (vedi GUIDA-STILE.md):
   una spina lunga che ondeggia per tutta la lunghezza, cresta continua sul dorso, bocca a mandibola (P.fauci) con denti ad ago.
   Lo stesso schema serve per grongo, murena drago, pesce lupo, pesce remo, anguilla pellicano, drago di lava. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, pow } = Math;

const T = { corpo: P.tinta('#c8782a', '#5a2350'), mento: P.tinta('#e8ac48', '#96481e'), ventre: P.tinta('#ffe9a8', '#e08a3a'), cresta: P.tinta('#ffa81e', '#c2410c') };
/* Il nastro: sottile in coda, più grosso verso la testa, con la gobba della fronte. Davanti il ventre si ritira (da u = .9):
   lì sotto lavora la mandibola. */
const SU = P.sagoma([[0, .03], [.08, .12], [.3, .23], [.6, .28], [.8, .36], [.9, .46], [.96, .4], [1, .24]]);
const GIU = P.sagoma([[0, .03], [.08, .1], [.3, .2], [.6, .25], [.8, .34], [.87, .4], [.925, .16], [1, .09]]);
const ONDA = { amp: .3, onde: 1.3, testa: .16, potenza: .75 };       // potenza < 1: ondeggia tutto il corpo, non solo la coda
const altCresta = k => .27 * pow(sin(PI * pow(k, .7)), .6);          // alta a metà corpo, a zero ai due capi

B.specie.registra({
  id: 'murena',
  descrizione: 'Passa la giornata con la testa fuori da una tana, a bocca socchiusa: non minaccia nessuno, sta solo respirando. Ma se le passi davanti al naso scatta come una molla.',
  forma: { lx: 1.75, ly: .45 },
  ingombro: { x0: -2.1, y0: -.93, x1: 1.75, y1: .83 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};
    c.save();
    const s = P.spinaPesce(22, -1.95, 1.4, fase, ONDA, SU, GIU, { testa: .1, coda: .02 });

    // ---- 1. dietro al corpo: la bocca (cavità, lingua, mandibola, denti di sotto) e le creste
    const ce = P.suSpina(s, .9, .3), apri = m ? .58 + b * .42 : .17 + b * .25;          // calma: socchiusa; a caccia: spalancata
    const ge = P.fauci(c, { x: ce.x, y: ce.y, ang: ce.ang + .06, lung: .55, apri, alt: .22, su: .22, tinta: T.mento, interno: '#8a1240', lingua: '#ff7d9c' });
    P.denti(c, ge.x0 + (ge.x1 - ge.x0) * .2, ge.y0 + (ge.y1 - ge.y0) * .2, ge.x1, ge.y1, 5, .14, 1, { tipo: 'ago', varia: .35, seme: 4 });
    P.cresta(c, s, { u0: .04, u1: .9, lato: -1, alt: k => altCresta(k) * (m ? 1.25 : 1), onda: .16, fase: F * 2, onde: 4, piega: .5, passi: 16, tinta: T.cresta, orlo: '#fff3b0' });
    P.cresta(c, s, { u0: .03, u1: .55, lato: 1, alt: k => .13 * sin(PI * pow(k, .6)), piega: .5, passi: 10, tinta: T.cresta, righe: false });

    // ---- 2. il corpo: tinta piatta con lama di luce (va bene per i nastri), ventre chiaro, macchie gialle, pieghe della gola
    const te = P.suSpina(s, .93, -.2);
    P.volume(c, s, T.corpo, { ombra: .09, lume: .09, dentro(cc) {
      P.fianco(cc, s, u => .45 + .12 * sin(u * 40), 1.4, T.ventre.base);
      P.guancia(cc, te.x, te.y - .1, .5, T.corpo.luce, .7);                           // la testa prende più luce: sembra più tonda
      P.macchie(cc, s, { n: 15, seme: 3, u0: .05, u1: .86, v0: -.85, v1: .3, r0: .05, r1: .1, colore: '#ffd43a', cuore: '#fff6b8', lungo: 1.3 });
      P.macchie(cc, s, { n: 9, seme: 8, u0: .1, u1: .97, v0: -.8, v1: .1, r0: .02, r1: .035, colore: P.alfa(T.corpo.bordo, .55), lungo: 1 });
      P.anelli(cc, s, .8, .87, 3, T.corpo, { v0: .15, v1: 1.1, curva: -.012 });
    } });
    P.suSpina(s, .76, -.62, q); P.riflesso(c, q.x, q.y, .3, q.ang - .05, .12);

    // ---- 3. la faccia: denti di sopra, narice a tubetto, occhio
    const d0 = P.suSpina(s, .94, 1), d1 = P.suSpina(s, 1, 1);
    P.denti(c, d0.x, d0.y - .01, d1.x + .09, d1.y - .02, 5, m ? .15 : .11, -1, { tipo: 'ago', varia: .35, seme: 7 });
    P.suSpina(s, 1, -.75, q); P.corno(c, q.x + .07, q.y + .02, q.ang - .7, .11, .075, T.mento, { gonfio: 1, bordo: .03 });
    const e = P.suSpina(s, .94, -.42);
    P.occhio(c, e.x, e.y, .17, Object.assign({ pelle: T.corpo, guarda: { x: .6, y: .1 } }, m ? { iride: '#ff3a1e', tipo: 'fessura' } : { iride: '#ffe14a' }, m ? P.SGUARDI.cattivo : P.SGUARDI.calmo));
    if (m) P.sopracciglio(c, e.x + .03, e.y - .17, .4, e.ang + .5, T.corpo.bordo, .11);
    c.restore();
  },
});
})();

<script>
/* Boccone — banco: PESCIOLINO NEON. Minuscolo e tondetto, con la striscia azzurra elettrica dall'occhio alla coda, la pancia
   d'argento che dietro diventa rossa e la codina rossa. Come la sardina: pochissimi tratti (due bordi e sei riempimenti),
   niente attrezzi pesanti, ma bordo scuro colorato, occhio grande e un'anima di luce nella striscia. Dipende solo da o.fase. */
(() => {
'use strict';
const B = window.B, TAU = Math.PI * 2;

B.specie.registra({
  id: 'neon',
  forma: { lx: 1, ly: .4 },
  ingombro: { x0: -1.16, y0: -.77, x1: 1.11, y1: .69 },
  disegna(c, o) {
    const w = Math.sin((o.fase || 0) * TAU), yc = w * .17, ym = -w * .05;      // yc: la coda sbatte; ym: il corpo si flette al contrario
    const sy = -.2 + ym * .6, cy = ym * .4 - .04;                              // la striscia: quota a metà corpo e in coda
    c.save(); c.lineJoin = 'round';
    // codina rossa a forca
    c.beginPath(); c.moveTo(-.48, ym * .5 - .07); c.lineTo(-1.04, yc - .4); c.quadraticCurveTo(-.8, yc, -1.04, yc + .4); c.lineTo(-.48, ym * .5 + .07); c.closePath();
    c.strokeStyle = '#2a1460'; c.lineWidth = .1; c.stroke(); c.fillStyle = '#ff3d55'; c.fill();
    // corpo con la pinnetta del dorso in un solo contorno (costa meno di due sagome sovrapposte): dorso blu notte, fianco e pancia d'argento
    const g = c.createLinearGradient(0, -.4, 0, .4); g.addColorStop(0, '#4a52c8'); g.addColorStop(.36, '#2c2f8e'); g.addColorStop(.6, '#f4fbff'); g.addColorStop(1, '#c4d6f4');
    c.beginPath(); c.moveTo(1, .03); c.quadraticCurveTo(.7, -.36, .22, -.345 + ym * .6); c.quadraticCurveTo(0, -.7 + ym, -.26, -.6 + ym); c.lineTo(-.22, -.29 + ym * .8);
    c.quadraticCurveTo(-.48, -.2 + ym * .7, -.7, ym * .4 - .06); c.lineTo(-.7, ym * .4 + .08); c.bezierCurveTo(-.18, .46 + ym, .74, .44, 1, .03); c.closePath();
    c.stroke(); c.fillStyle = g; c.fill();
    // la pancia di dietro è rossa
    c.beginPath(); c.moveTo(-.66, ym * .4 + .02); c.quadraticCurveTo(-.3, .02 + ym * .7, .08, .04 + ym * .3); c.quadraticCurveTo(-.06, .36 + ym * .6, -.66, ym * .4 + .06); c.closePath();
    c.fillStyle = '#ff3d55'; c.fill();
    // la striscia al neon: larga dietro l'occhio (che ne copre l'inizio), a punta verso la coda. I riempimenti costano meno dei tratti spessi
    c.beginPath(); c.moveTo(.72, -.15); c.quadraticCurveTo(.1, sy - .13, -.64, cy); c.quadraticCurveTo(.1, sy + .13, .72, .02); c.closePath();
    c.fillStyle = '#19d3ff'; c.fill();
    // l'anima chiara della striscia e il bianco dell'occhio in un colpo solo (l'arco gira nello stesso verso, così non si bucano)
    c.beginPath(); c.moveTo(.7, -.095); c.quadraticCurveTo(.1, sy - .05, -.5, cy); c.quadraticCurveTo(.1, sy + .035, .7, -.04); c.closePath();
    c.moveTo(.77, -.03); c.arc(.6, -.03, .17, 0, TAU, true);
    c.fillStyle = '#eefeff'; c.fill();
    c.fillStyle = '#14173a'; c.beginPath(); c.arc(.64, -.02, .095, 0, TAU); c.fill();
    c.restore();
  },
});
})();

<script>
/* Boccone — specie: PESCE ANGELO (taglia 3, cacciatore). ESEMPIO DI RIFERIMENTO per i pesci «normali» (vedi GUIDA-STILE.md):
   corpo su una spina che ondeggia, pinne a raggi, motivi dipinti dentro il volume, faccia calma e faccia a caccia.
   Niente squame: sulle righe farebbero confusione (si usano sui pesci a tinta unita, vedi P.squame). */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, max } = Math;

// ---- tinte (una volta sola) e sagoma del corpo: alto e compresso, col muso che sporge
const T = { corpo: P.tinta('#ffc21a', '#f0641e'), blu: P.tinta('#2a5cf0'), notte: P.tinta('#232a8a'), pinna: P.tinta('#4a5dfa'), coda: P.tinta('#ffb01f', '#f0641e'),
  labbra: P.tinta('#ff6f8f'), ventre: P.tinta('#fff0c0', '#f0a05a'), pett: P.tinta('#ffd84a', '#ff7a1a') };
const SU = P.sagoma([[0, .13], [.1, .26], [.26, .7], [.45, .98], [.62, 1.02], [.8, .9], [.93, .66], [1, .44]]);
const GIU = P.sagoma([[0, .13], [.1, .26], [.26, .66], [.45, .9], [.62, .94], [.8, .8], [.93, .56], [1, .34]]);
const ONDA = { amp: .11, onde: .5, testa: .14 };
const arco = (u0, d) => v => u0 + d + .07 * (1 - v * v);              // righe incurvate verso il muso
/* Tre righe blu orlate di notte e d'azzurro, più la maschera scura sull'occhio: ogni lista è [[da, a], …] lungo il corpo. */
const RIGHE = { notte: [], blu: [], filo: [[arco(.8, 0), arco(.8, .014)], [arco(.8, .111), arco(.8, .125)]] };
for (const u0 of [.2, .39, .58]) { RIGHE.notte.push([arco(u0, -.014), arco(u0, .112)]); RIGHE.blu.push([arco(u0, 0), arco(u0, .098)]); RIGHE.filo.push([arco(u0, .012), arco(u0, .03)]); }
RIGHE.notte.push([arco(.8, .014), arco(.8, .111)]);

B.specie.registra({

    // ---- 2. il corpo, con ventre chiaro, righe blu orlate di notte e d'azzurro, maschera sull'occhio, squame

<script>
/* Boccone — specie: PESCE BALESTRA (taglia 3, scattante). Corpo a rombo, occhio piccolo messo in alto e all'indietro,
   bocca minuscola con i dentoni sempre in vista (il tratto esagerato), disegni geometrici: fascia blu notte sull'occhio
   filettata d'azzurro, baffo giallo, sbarre oblique sul fianco. La spina «a grilletto» sta ripiegata da calmo e scatta
   dritta a caccia. Nuota come i balestra veri: corpo quasi fermo, dorsale e anale che ondeggiano. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, max } = Math;

// ---- tinte (una volta sola) e sagoma: un rombo, alto a metà corpo, con la fronte lunga e dritta
const T = { corpo: P.tinta('#fbc04a', '#d6542c'), ventre: P.tinta('#fffdf0', '#f0a878'), notte: P.tinta('#2b2a80'), pinna: P.tinta('#6fc4ff'), coda: P.tinta('#ffd23a', '#ff6a14'), labbra: P.tinta('#ffcf24', '#ff6a14') };
const NOTTE = T.notte.base, BLU = '#2f9dff', GIALLO = '#ffd21f';
const SU = P.sagoma([[0, .12], [.12, .22], [.32, .56], [.5, .8], [.62, .76], [.8, .5], [.92, .3], [1, .18]]);
const GIU = P.sagoma([[0, .12], [.12, .22], [.32, .56], [.5, .78], [.62, .72], [.8, .46], [.92, .28], [1, .17]]);
const ONDA = { amp: .06, onde: .45, testa: .2 };                      // corpo rigido: spingono le pinne

const fa = v => .615 - .035 * v, fb = v => .765 - .055 * v;
const FASCIA = [[fa, fb]], FILETTI = [[v => fa(v) - .034, v => fa(v) - .012], [v => fb(v) + .012, v => fb(v) + .034], [.905, .93]];
/* Le sbarre oblique sul fianco di dietro: tre quadrilateri in un colpo solo, dal mezzo del corpo al ventre. */
const SBARRE = [.17, .285, .4];
const sbarre = (c, s) => {
  const q = {}; c.beginPath();
  for (const u0 of SBARRE) {
    P.suSpina(s, u0 + .012, -.22, q); c.moveTo(q.x, q.y); P.suSpina(s, u0 + .045, -.22, q); c.lineTo(q.x, q.y);       // a cuneo: sottili in alto
    P.suSpina(s, u0 + .17, 1.2, q); c.lineTo(q.x, q.y); P.suSpina(s, u0 + .1, 1.2, q); c.lineTo(q.x, q.y); c.closePath();
  }
  c.fillStyle = NOTTE; c.fill();
};
/* I dentoni: due incisivi di sopra che sporgono dalle labbra anche a bocca quasi chiusa; a caccia (sotto = true) si vedono
   anche i due di sotto. Stessi x, y, ang, r, apri delle labbra. */
const dentoni = (c, x, y, ang, r, apri, sotto) => {
  c.save(); c.translate(x, y); c.rotate(ang - apri * .5);
  P.denti(c, -.1 * r, .04 * r, .66 * r, -.14 * r, 2, r * (.34 + .3 * apri), -1, { tipo: 'piatto', spess: .014 });
  if (sotto) { c.rotate(apri * 1.35); P.denti(c, -.1 * r, -.02 * r, .6 * r, .12 * r, 2, r * (.2 + .3 * apri), 1, { tipo: 'piatto', spess: .014 }); }
  c.restore();
};

B.specie.registra({
  id: 'pesce_balestra',
  descrizione: 'Sulla schiena ha una spina che si blocca dritta come il grilletto di una balestra: incastrato in una fessura, nessuno riesce più a tirarlo fuori. Con i suoi dentoni sgranocchia ricci e conchiglie.',
  forma: { lx: 1.0, ly: .8 },
  ingombro: { x0: -1.49, y0: -1.38, x1: 1.3, y1: 1.22 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};
    c.save();

    P.suSpina(s, 0, 0, q);
    P.coda(c, { x: q.x + .06, y: q.y, ang: q.ang + PI + sin(F - 1.1) * .3, tipo: 'ventaglio', lung: .5, alt: .46, radice: .12, fase: F - 1.9, onda: .2, tinta: T.coda, orlo: BLU });
    for (const v of [-1, 1]) {

        onda: .17, fase: F * 2 + (v > 0 ? PI : 0), passo: .85, tinta: T.pinna, orlo: '#e8f8ff' });
    }
    const t0 = P.suSpina(s, .62, -.94), t1 = P.suSpina(s, .47, -.9), ag = m ? -(PI / 2 + .2) : -(PI - .85);       // il grilletto: giù da calmo, dritto a caccia
    P.pinna(c, { x0: t0.x, y0: t0.y, x1: t1.x, y1: t1.y, a0: ag, a1: -(PI - .25), lung: m ? .56 : .44, profilo: [.94, .7, .4], n: 3, tinta: T.pinna, orlo: '#e8f8ff', righe: false });
    P.corno(c, t0.x - .02, t0.y + .05, ag, m ? .62 : .5, .13, T.notte, { curva: -.12, gonfio: .6 });
    const pv = P.suSpina(s, .5, 1);
    P.corno(c, pv.x + .04, pv.y - .08, PI * .62, .26, .15, T.ventre, { curva: .25 });

    // ---- 2. il corpo: ventre bianco, sbarre oblique, baffo giallo, fascia dell'occhio blu notte coi filetti azzurri
    P.volume(c, s, T.corpo, { luce, dentro(cc) {
      P.fianco(cc, s, u => .12 - .3 * sin(u * PI), 1.4, T.ventre.base);
      sbarre(cc, s);
      P.fianco(cc, s, .1, .3, GIALLO, .7, 1.1, 5);
      P.bande(cc, s, FASCIA, NOTTE);
      P.bande(cc, s, FILETTI, BLU, 4);
    } });
    if (P.fine(o)) P.bozzi(c, P.puntiSuSpina(s, 3, .06, .15, -.3).concat(P.puntiSuSpina(s, 3, .06, .15, .3)), .028, T.notte);   // le spinette del gambo della coda
    P.riflesso(c, .0, -.52, .4, -.3, .13);

    // ---- 3. sul fianco: la fessura della branchia e la pettorale che rema, con la sua ombra
    const pp = P.suSpina(s, .6, .16), rema = sin(F * 2 + .4), ap = PI * .9 + rema * .35;
    const g1 = P.suSpina(s, .63, -.22), g2 = P.suSpina(s, .615, 0);
    P.solco(c, [g1.x, g1.y, g2.x, g2.y, pp.x + .06, pp.y - .02], T.notte, .04);
    P.ombra(c, pp.x - .13, pp.y + .05, .24, .16, -.3, .25);
    P.pinna(c, { x0: pp.x + .03, y0: pp.y - .09, x1: pp.x - .02, y1: pp.y + .09, a0: ap + .5 + rema * .1, a1: ap - .5 - rema * .1, lung: .36, profilo: [.75, 1, 1, .8, .6], n: 5, onda: .1, fase: F * 2, passo: .7, tinta: T.pinna, orlo: '#e8f8ff', primo: true });

    // ---- 4. la faccia. Calmo: occhio ambrato, labbra socchiuse sui dentoni. A caccia: occhio rosso tagliato, sopracciglio, bocca spalancata
    const e = P.suSpina(s, .7, -.5);
    P.occhio(c, e.x, e.y, .2, Object.assign({ iride: m ? '#ff3a1e' : '#ffa51c', pelle: T.notte, guarda: { x: .5, y: .15 } }, m ? P.SGUARDI.cattivo : P.SGUARDI.normale));
    if (m) P.sopracciglio(c, e.x + .05, e.y - .2, .44, e.ang + .5, T.notte.bordo, .11);
    const l = P.suSpina(s, 1, .1), lx = l.x + .1, ly = l.y + .01, lr = m ? .23 : .2, apri = m ? max(b, .55) : .22 + b * .3;
    P.labbra(c, lx, ly, l.ang, lr, apri, T.labbra);

  },

})();

<script>
/* Boccone — specie: PESCE CHIRURGO (taglia 2, branco). Ovale blu intenso con il disegno scuro «a tavolozza» (una fascia
   lungo la schiena e un anello sul fianco), coda gialla orlata di scuro, pettorale con la punta gialla e la piccola lama
   bianca alla base della coda: da calmo è ripiegata, a caccia scatta in fuori (cambia la sagoma). Niente nero: è blu notte. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, max } = Math;

// ---- tinte (una volta sola) e sagoma: ovale pieno, muso piccolo e un po' a punta
const T = { corpo: P.tinta('#2a6df4'), notte: P.tinta('#28257c'), pinna: P.tinta('#3f8eff'), coda: P.tinta('#ffd21f', '#ff6a14'), lama: P.tinta('#ffffff', '#8cb2ff'), labbra: P.tinta('#ff7fa6') };
const NOTTE = T.notte.base, CIELO = '#86dcff';
const SU = P.sagoma([[0, .13], [.1, .26], [.3, .6], [.55, .76], [.78, .7], [.93, .5], [1, .34]]);
const GIU = P.sagoma([[0, .13], [.1, .26], [.3, .58], [.55, .72], [.78, .64], [.93, .44], [1, .28]]);

/* Il disegno a tavolozza. La fascia: tutta la schiena, più larga sul gambo della coda e in avanti, dove scende fino all'occhio.
   L'anello: appeso sotto la fascia, chiude dentro un ovale di blu. */
const orloFascia = u => u < .14 ? .2 : u < .62 ? -.74 : -.74 + (u - .62) * 1.9;
const anello = (c, s) => {
  const q = {}; c.beginPath();
  for (let i = 0; i < 14; i++) { const a = i / 14 * TAU; P.suSpina(s, .4 + .235 * cos(a), -.3 + .42 * sin(a), q); if (i) c.lineTo(q.x, q.y); else c.moveTo(q.x, q.y); }
  c.closePath(); c.lineJoin = 'round'; c.strokeStyle = NOTTE; c.lineWidth = .115; c.stroke();
};
/* I dentini in vista fra le labbra aperte (P.labbra li lascia dietro le labbra): stessi x, y, ang, r, apri delle labbra. */
const dentini = (c, x, y, ang, r, apri) => {
  c.save(); c.translate(x, y); c.rotate(ang - apri * .5);
  P.denti(c, -.12 * r, .03 * r, .52 * r, -.1 * r, 3, r * (.12 + .22 * apri), -1, { spess: .012 });
  c.rotate(apri * 1.35);
  P.denti(c, -.12 * r, -.03 * r, .48 * r, .09 * r, 3, r * (.08 + .18 * apri), 1, { spess: .012 });
  c.restore();
};

B.specie.registra({
  id: 'pesce_chirurgo',
  descrizione: 'Si chiama così per la lama affilata come un bisturi che tiene ripiegata vicino alla coda: se qualcuno lo disturba la fa scattare con un colpo di coda. Di notte dorme incastrato tra i coralli.',
  forma: { lx: 1.0, ly: .74 },
  ingombro: { x0: -1.63, y0: -1.02, x1: 1.13, y1: 1.08 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};
    c.save();
    const s = P.spinaPesce(14, -.9, .72, fase, ONDA, SU, GIU, { testa: .26 }), luce = [.3, -.5, 1.8], alza = m ? .22 : 0;

    // ---- 1. dietro al corpo: coda gialla con gli orli scuri, dorsale e anale lunghe e basse, ventrale
    P.suSpina(s, 0, 0, q);
    const g = P.coda(c, { x: q.x + .06, y: q.y, ang: q.ang + PI + sin(F - 1.1) * .34, tipo: 'forca', lung: .56, alt: .56, radice: .13, fase: F - 1.9, onda: .18, tinta: T.coda, orlo: '#fff3a0' });
    for (let i = 0; i <= g.n; i += g.n) P.filo(c, [g.bx[i], g.by[i], g.mx[i], g.my[i], g.mx[i] + (g.ex[i] - g.mx[i]) * .72, g.my[i] + (g.ey[i] - g.my[i]) * .72], .09, .04, NOTTE, .03);
    const d0 = P.suSpina(s, .78, -.92), d1 = P.suSpina(s, .08, -.85), a0 = P.suSpina(s, .5, .9), a1 = P.suSpina(s, .08, .85);
    P.pinna(c, { x0: d0.x, y0: d0.y, x1: d1.x, y1: d1.y, a0: -(PI / 2 + .5 - alza), a1: -(PI - .5 - alza * .5), lung: m ? .44 : .36, profilo: [.6, .85, 1, 1, .95, .8], n: 10, smerlo: .25,
      onda: .07, fase: F * 2, passo: .5, tinta: T.pinna, orlo: CIELO });
    P.pinna(c, { x0: a0.x, y0: a0.y, x1: a1.x, y1: a1.y, a0: PI / 2 + .6, a1: PI - .5, lung: .32, profilo: [.7, 1, .95, .8], n: 7, smerlo: .25, onda: .07, fase: F * 2 - 1, passo: .5, tinta: T.pinna, orlo: CIELO });
    const pv = P.suSpina(s, .64, .95);
    P.pinna(c, { x0: pv.x + .06, y0: pv.y - .05, x1: pv.x - .1, y1: pv.y - .05, a0: PI * .58 + sin(F - .5) * .1, a1: PI * .8 + sin(F - .5) * .1, lung: .38, profilo: [1, .6], n: 3, piega: .12, tinta: T.pinna, righe: false });

    // ---- 2. il corpo: ventre appena più chiaro, la tavolozza blu notte
    P.volume(c, s, T.corpo, { luce, dentro(cc) {
      P.fianco(cc, s, .5, 1.4, P.alfa(CIELO, .22));

    P.riflesso(c, .3, -.52, .38, -.15, .12);

    P.suSpina(s, .13, .12, q);
    P.ombra(c, q.x - .05, q.y + .04, .16, .09, q.ang, .3);
    P.corno(c, q.x + .06, q.y, q.ang + PI + (m ? .75 : .08), m ? .34 : .2, m ? .12 : .09, T.lama, { gonfio: .8, bordo: .035 });

    // ---- 4. sul fianco: la pettorale dalla punta gialla che rema, con la sua ombra
    const pp = P.suSpina(s, .66, .25), rema = sin(F * 2 + .4), ap = PI * .9 + rema * .35;
    P.ombra(c, pp.x - .15, pp.y + .05, .28, .18, -.3, .25);

<script>
/* Boccone — specie: PESCE FARFALLA (taglia 1, timido). Disco alto e sottile, bianco davanti e giallo dietro, con la banda
   scura che nasconde l'occhio vero, il finto occhio vicino alla coda e il muso lungo a pinzetta (il tratto esagerato).
   Il muso fa parte della spina del corpo: così la fronte incavata resta una curva sola. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, max } = Math;

// ---- tinte (una volta sola): bianco con l'ombra azzurra, giallo con l'ombra arancio, «nero» blu notte
const T = { bianco: P.tinta('#f7f9ff', '#86a8f2'), corpo: P.tinta('#ffd21f', '#ff6a14'), notte: P.tinta('#2b2a86'), pinna: P.tinta('#ffcf24', '#ff6a14'),
  pett: P.tinta('#ffe98a', '#ffa23c'), labbra: P.tinta('#ff6f8f') };
const ORLO = '#fff8d6', LINEA = P.alfa('#8f8ae6', .55);
// la spina va dalla coda (u = 0) alla punta del muso (u = 1): il disco finisce a u ≈ .76, poi c'è la pinzetta
const SU = P.sagoma([[0, .14], [.08, .3], [.22, .72], [.4, .96], [.56, .92], [.68, .72], [.77, .46], [.85, .22], [.92, .13], [1, .1]]);
const GIU = P.sagoma([[0, .14], [.08, .3], [.22, .7], [.4, .92], [.56, .86], [.68, .64], [.77, .38], [.85, .19], [.92, .12], [1, .09]]);

   dalla banda dell'occhio in avanti il muso è tutto bianco. */
const liscio = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);

  const q = {}; c.beginPath();

  c.lineCap = 'round'; c.strokeStyle = LINEA; c.lineWidth = .028; c.stroke();

const fintoOcchio = (c, x, y, r) => {
  c.beginPath(); c.arc(x, y, r * 1.36, 0, TAU); c.fillStyle = '#ffffff'; c.fill();
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = T.notte.base; c.fill();

  c.restore();
};

B.specie.registra({
  id: 'pesce_farfalla',
  descrizione: 'Con il muso a pinzetta pesca i bocconi nelle fessure dei coralli. La banda scura nasconde l\'occhio vero e la macchia vicino alla coda ne finge un altro: chi lo attacca sbaglia direzione, e lui scappa dall\'altra parte.',
  forma: { lx: 1.0, ly: .95 },
  ingombro: { x0: -1.33, y0: -1.13, x1: 1.36, y1: 1.24 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};

    P.suSpina(s, 0, 0, q);

    const d0 = P.suSpina(s, .68, -.92), d1 = P.suSpina(s, .05, -.85), a0 = P.suSpina(s, .52, .92), a1 = P.suSpina(s, .05, .85);
    P.pinna(c, { x0: d0.x, y0: d0.y, x1: d1.x, y1: d1.y, a0: -(PI / 2 + .15 - alza), a1: -(PI - .55 - alza * .4), lung: .6, profilo: [.5, .58, .66, .74, .84, .96, 1, .86], n: 10, smerlo: .55, piega: -.1,

    P.pinna(c, { x0: a0.x, y0: a0.y, x1: a1.x, y1: a1.y, a0: PI / 2 + .5 - alza, a1: PI - .55, lung: .58, profilo: [.4, .7, .92, 1, .84], n: 7, smerlo: .3, piega: .1,
      onda: .06, fase: F * 2 - 1, passo: .5, tinta: T.pinna, orlo: ORLO });
    const pv = P.suSpina(s, .6, .96);

    P.volume(c, s, T.corpo, { luce, dentro(cc) {

    const g1 = P.suSpina(s, .63, -.45), g2 = P.suSpina(s, .595, 0), g3 = P.suSpina(s, .63, .5);
    P.solco(c, [g1.x, g1.y, g2.x, g2.y, g3.x, g3.y], T.bianco, .035);                               // opercolo
    P.riflesso(c, .14, -.66, .44, -.2, .14);

    const pp = P.suSpina(s, .56, .22), rema = sin(F * 2 + .4), ap = PI * .9 + rema * .35;

    // ---- 4. la faccia. Calmo: occhio ambrato dentro la banda, pinzetta chiusa. A caccia: occhio rosso tagliato, sopracciglio, pinzetta aperta coi dentini
    const e = P.suSpina(s, .745, -.34);

    if (m) P.sopracciglio(c, e.x + .05, e.y - .2, .44, .5, T.notte.bordo, .11);

})();

<script>
/* Boccone — specie: PESCE LEONE (taglia 3, pigro, veleno). Un ventaglio che nuota: corpo a righe rosse e panna, una fila di
   lunghi aculei velenosi separati sulla schiena (ognuno con la sua bandierina), due grandi pinne pettorali piumate (la
   lontana spunta sotto il mento, la vicina copre il fianco) con i raggi liberi in punta, cornetti sopra gli occhi, pinne
   molli chiare a puntini. Va piano; a caccia apre i ventagli, drizza gli aculei (le punte si accendono di giallo veleno)
   e spalanca la bocca. Il tratto esagerato sono i ventagli e gli aculei. */
(() => {
'use strict';
const B = window.B, P = B.pittura, TAU = Math.PI * 2, PI = Math.PI;
const { sin, cos, max, hypot } = Math;

// ---- tinte (una volta sola)

  lontana: P.tinta('#c03c58', '#5a1a66'), spina: P.tinta('#fff0d2', '#ff9a4a'), lembo: P.tinta('#ff8f5e', '#b02850') };
const PANNA = '#fff4e4', ROSSO = '#d42a30', CUPO = '#a01f4e', VELENO = '#eaff5a';
const RIGA = P.alfa(PANNA, .93), VENTRE = P.alfa(PANNA, .3), NEO = P.alfa(CUPO, .8), RIGA_MENTO = P.alfa(ROSSO, .85);
// ---- sagoma: testone, fronte ripida, ventre che si ritira sotto la testa per far posto alla mandibola
const SU = P.sagoma([[0, .12], [.14, .2], [.32, .36], [.52, .5], [.7, .58], [.84, .56], [.94, .46], [1, .34]]);
const GIU = P.sagoma([[0, .12], [.14, .2], [.32, .34], [.52, .45], [.68, .48], [.8, .4], [.9, .3], [1, .22]]);
const ONDA = { amp: .08, onde: .5, testa: .1 };
/* Le righe panna sul rosso: [da, a, pendenza]. Larghe e strette alternate, un po' storte; sulla testa si aprono a raggiera
   attorno all'occhio (che resta dentro una riga rossa). */
const STRISCE = [[.05, .085, .02], [.15, .19, .02], [.245, .27, .02], [.335, .385, .02], [.45, .475, .015], [.545, .595, .01], [.66, .685, -.01], [.75, .795, -.04], [.915, .95, .05]]
  .map((z, i) => [v => z[0] + z[2] * v + .012 * sin(v * 5 + i), v => z[1] + z[2] * v - .012 * sin(v * 4 + i * 2)]);
const NA = 11, ACULEI = [.6, .78, .9, .98, 1, 1, .97, .92, .84, .74, .6];       // gli aculei della schiena, dal primo (sulla nuca) all'ultimo
const PROFILO = [.74, .92, 1, 1, .94, .84, .72];                                // lunghezza dei raggi dei ventagli
const LB = .62, HB = .21;                                                       // la mandibola: lunghezza e spessore
const righeMento = cc => { cc.beginPath(); cc.rect(LB * .3, -.1, LB * .11, .5); cc.rect(LB * .56, -.1, LB * .1, .5); cc.rect(LB * .8, -.1, LB * .08, .5); cc.fillStyle = RIGA_MENTO; cc.fill(); };

/* Tante punte (aculei, bandierine, lembi) in UN solo tracciato. lista = [x, y, angolo, lunghezza, larghezza, curva, …]. */
const punte = (c, l, colore, bordo, gonfio = .8, spess = .07) => {
  c.beginPath();
  for (let i = 0; i < l.length; i += 6) {
    const x = l[i], y = l[i + 1], a = l[i + 2], L = l[i + 3], hx = -sin(a) * l[i + 4] / 2, hy = cos(a) * l[i + 4] / 2, cu = l[i + 5];
    const px = x + cos(a + cu) * L, py = y + sin(a + cu) * L, mx = x + cos(a + cu * .3) * L * .5, my = y + sin(a + cu * .3) * L * .5;

/* Sfumatura radiale «a gradini»: attorno a (x, y), da k0·R a .86·R, n fasce alterne dei colori b e a; l'ultimo tratto sfuma
   in `punta`. Data a un ventaglio o a una fila di aculei li riga tutti insieme, ad archi, con un solo riempimento. */

  const g = c.createRadialGradient(x, y, 0, x, y, R), passo = (.86 - k0) / n;
  g.addColorStop(0, a);

    const x = bx[i] + (ex[i] - bx[i]) * quota, y = by[i] + (ey[i] - by[i]) * quota, hx = (x + px) / 2, hy = (y + py) / 2;
    c.quadraticCurveTo(hx + ((bx[i] + bx[i - 1]) / 2 - hx) * sm, hy + ((by[i] + by[i - 1]) / 2 - hy) * sm, x, y); px = x; py = y;
  }

  c.beginPath();
  for (let i = 0; i <= n; i++) {
    const dx = ex[i] - bx[i], dy = ey[i] - by[i], d = hypot(dx, dy) || 1, hx = -dy / d * larg, hy = dx / d * larg, x0 = bx[i] + dx * .16, y0 = by[i] + dy * .16;
    c.moveTo(x0, y0); c.quadraticCurveTo(mx[i] + hx, my[i] + hy, ex[i], ey[i]); c.quadraticCurveTo(mx[i] - hx, my[i] - hy, x0, y0); c.closePath();

const nei = (c, g) => {
  for (let i = 1; i < g.n; i++) for (let j = 0; j < 2; j++) {
    const k = .02 + .52 * j, x = g.mx[i] + (g.ex[i] - g.mx[i]) * k, y = g.my[i] + (g.ey[i] - g.my[i]) * k;
    c.moveTo(x + .03, y); c.arc(x, y, .03, 0, TAU);
  }
};

B.specie.registra({
  id: 'pesce_leone',
  descrizione: 'Nuota piano piano, senza paura di nessuno: gli aculei che porta sulla schiena sono velenosi. Con le grandi pinne a ventaglio spinge i pesciolini in un angolo, poi li aspira in un boccone.',
  forma: { lx: 1.0, ly: .62 },
  ingombro: { x0: -1.6, y0: -1.75, x1: 1.2, y1: 1.5 },
  disegna(c, o) {
    const fase = o.fase || 0, F = fase * TAU, m = !!o.minaccia, b = o.bocca || 0, q = {};
    c.save();
    const s = P.spinaPesce(14, -.85, .62, fase, ONDA, SU, GIU, { testa: .26 }), luce = [.3, -.5, 1.8], punta = m ? VELENO : PANNA;

    // ---- 1. dietro al corpo. Il ventaglio lontano, che spunta sotto il mento (più scuro)
    const pl = P.suSpina(s, .7, .5), al = PI * .4 + sin(F + 1.5) * .07, sl = m ? .8 : .62, Ll = m ? .98 : .84;
    const gl = P.raggi({ x0: pl.x - .12, y0: pl.y, x1: pl.x + .1, y1: pl.y, a0: al + sl, a1: al - sl, lung: Ll, profilo: PROFILO, n: 7, onda: .06, fase: F * 2 + 1, passo: .6 });
    ventaglio(c, gl, .68, .55, T.lontana.base, fasce(c, pl.x, pl.y, Ll, .2, 8, T.lontana.luce, T.lontana.scura, T.lontana.luce), T.lontana.bordo);
    // coda, dorsale molle e anale: chiare, a puntini
    P.suSpina(s, 0, 0, q);
    const gc = P.coda(c, { x: q.x + .05, y: q.y, ang: q.ang + PI + sin(F - 1.1) * .28, tipo: 'ventaglio', lung: .52, alt: .44, radice: .12, fase: F - 1.9, onda: .16, smerlo: .3, tinta: T.vela, orlo: PANNA });
    const b0 = P.suSpina(s, .31, -.86), b1 = P.suSpina(s, .09, -.8), n0 = P.suSpina(s, .36, .86), n1 = P.suSpina(s, .1, .8);
    const gd = P.pinna(c, { x0: b0.x, y0: b0.y, x1: b1.x, y1: b1.y, a0: -(PI / 2 + .15), a1: -(PI - .4), lung: .5, profilo: [.75, 1, 1, .85, .6], n: 5, smerlo: .35, onda: .09, fase: F * 2 - 1, tinta: T.vela, orlo: PANNA });
    const ga = P.pinna(c, { x0: n0.x, y0: n0.y, x1: n1.x, y1: n1.y, a0: PI / 2 + .3, a1: PI - .4, lung: .42, profilo: [.8, 1, .95, .7], n: 5, smerlo: .35, onda: .09, fase: F * 2 - 2, tinta: T.vela, orlo: PANNA });

<script>

}
